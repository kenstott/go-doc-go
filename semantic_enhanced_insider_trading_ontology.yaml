    description: Matches the XML tag for the direct or indirect nature of insider
      ownership in Form 4 filings.
  - type: regex
    pattern: <securityTitle>
    confidence: 0.9
    element_types:
    - xml_element
    description: Matches the XML tag for the security title (company name) in Form
