domain:
  name: sec_insider_trading_semantic_analysis
  version: 1.0.0
  description: Semantic-enhanced ontology for SEC insider trading analysis with robust
    similarity matching
  discovery_method: semantic_enhanced_interactive_insider_trading
  user_context: "SEC regulatory filings focused on insider trading analysis:\n\nPrimary\
    \ Documents:\n\u2022 Form 4 - Insider trading transaction reports (XML structured\
    \ data)\n\u2022 10-K annual reports with comprehensive financial statements\n\u2022\
    \ 10-Q quarterly reports with interim financial updates\n\u2022 8-K current reports\
    \ for material corporate events\n\nKey Analysis Focus:\n\u2022 Insider transactions:\
    \ buy/sell activities, transaction amounts, prices\n\u2022 Share ownership: ownership\
    \ changes, direct/indirect ownership\n\u2022 Insider identification: executives,\
    \ directors, officers, their roles\n\u2022 Company identification: issuer names,\
    \ ticker symbols, CIK numbers\n\u2022 Temporal tracking: transaction dates, filing\
    \ dates, reporting periods\n\u2022 Financial metrics: revenue, earnings, financial\
    \ performance data\n\nData Formats:\n\u2022 XML: Structured transaction data from\
    \ Form 4 filings\n\u2022 HTML: Human-readable financial reports and statements\n\
    \nSEMANTIC MATCHING REQUIREMENTS:\n\u2022 Executive titles: Need to match CEO\
    \ \u2248 Chief Executive Officer \u2248 President \u2248 Chief Operating Officer\n\
    \u2022 Company variations: Need to match Microsoft \u2248 MSFT \u2248 Microsoft\
    \ Corporation \u2248 Microsoft Corp\n\u2022 Transaction types: Need to match buy\
    \ \u2248 purchase \u2248 acquisition \u2248 acquired \u2248 disposition \u2248\
    \ sold\n\u2022 Financial terms: Need to match revenue \u2248 sales \u2248 income\
    \ \u2248 earnings \u2248 profit\n\nThe goal is to track insider trading patterns\
    \ with robust semantic matching that handles\nnatural language variations, abbreviations,\
    \ and synonyms commonly found in SEC filings."
  settings:
    default_confidence_threshold: 0.7
    max_relationships_per_pair: 5
    enable_transitive_inference: true
    insider_trading_focus: true
    semantic_similarity_enabled: true
    embedding_model_suggested: sentence-transformers/all-MiniLM-L6-v2
terms:
- id: insider
  label: Insider
  description: A person who has access to non-public information about a company,
    such as an executive, director, or officer. Insiders are required to report their
    trading activities to the SEC.
  aliases:
  - reportingOwner
  - rptOwnerStateDescription
  - ownerSignature
  - reportingOwnerRelationship
  - reportingOwnerId
  semantic_variations:
  - executive
  - director
  - officer
  - CEO
  - Chief Executive Officer
  - President
  - Chief Operating Officer
  domain_context: Insiders are the key entities involved in insider trading activities
    that are reported to the SEC.
- id: transaction
  label: Transaction
  description: A trading activity performed by an insider, such as buying, selling,
    or acquiring shares of a company's stock. Transactions are reported with details
    like the type of transaction, number of shares, price per share, and transaction
    date.
  aliases:
  - transactionAcquiredDisposedCode
  - transactionDate
  - transactionPricePerShare
  - transactionCoding
  - transactionAmounts
  - equitySwapInvolved
  - transactionFormType
  semantic_variations:
  - buy
  - purchase
  - acquire
  - disposition
  - sold
  - trade
  - transaction
  domain_context: Transactions are the core events being analyzed to understand insider
    trading patterns and activities.
- id: ownership
  label: Ownership
  description: Details about an insider's ownership of a company's shares, including
    the nature of ownership (direct or indirect), the number of shares owned before
    and after a transaction, and the total ownership percentage.
  aliases:
  - ownershipNature
  - directOrIndirectOwnership
  - securityTitle
  - sharesOwnedFollowingTransaction
  - postTransactionAmounts
  semantic_variations:
  - shares
  - ownership
  - stake
  - holdings
  domain_context: Ownership information is crucial for understanding the impact of
    insider trading activities and changes in insider positions.
- id: company
  label: Company
  description: The issuer of the securities being traded by insiders. Companies are
    identified by their legal names, ticker symbols, and CIK (Central Index Key) numbers
    assigned by the SEC.
  aliases:
  - securityTitle
  semantic_variations:
  - Microsoft
  - MSFT
  - Microsoft Corporation
  - Microsoft Corp
  domain_context: The companies whose securities are being traded by insiders are
    the primary focus of the analysis.
- id: filing
  label: Filing
  description: The regulatory documents submitted to the SEC that contain information
    about insider trading activities, such as Form 4 reports and periodic financial
    reports (10-K, 10-Q, 8-K).
  aliases:
  - footnoteId
  - transactionFormType
  semantic_variations:
  - Form 4
  - 10-K
  - 10-Q
  - 8-K
  - filing
  - report
  - disclosure
  domain_context: Insider trading information is primarily obtained from the regulatory
    filings submitted to the SEC.
- id: financial
  label: Financial Metric
  description: Financial performance data reported by companies in their periodic
    financial statements, such as revenue, earnings, income, and profit.
  aliases: []
  semantic_variations:
  - revenue
  - sales
  - income
  - earnings
  - profit
  - financial
  - performance
  domain_context: Financial metrics are important contextual information for understanding
    the overall performance of companies whose insiders are trading.
element_mappings:
- term_id: insider
  rules:
  - type: semantic
    semantic_phrase: executive director officer CEO president chief executive officer
      chief operating officer chief financial officer
    confidence: 0.75
    element_types:
    - paragraph
    - table_cell
    description: Matches variations of executive titles and roles that indicate insider
      status.
  - type: keywords
    keywords:
    - reportingOwner
    - rptOwnerStateDescription
    - ownerSignature
    - reportingOwnerRelationship
    - reportingOwnerId
    confidence: 0.7
    element_types:
    - xml_element
    description: Matches exact XML tags for insider identification in Form 4 filings.
- term_id: transaction
  rules:
  - type: semantic
    semantic_phrase: buy purchase acquire acquisition disposition sold sale trading
      transaction
    confidence: 0.75
    element_types:
    - paragraph
    - table_cell
    description: Matches various terms used to describe insider trading activities.
  - type: regex
    pattern: <transactionAcquiredDisposedCode>
    confidence: 0.9
    element_types:
    - xml_element
    description: Matches the XML tag for the transaction type in Form 4 filings.
  - type: regex
    pattern: <transactionDate>
    confidence: 0.9
    element_types:
    - xml_element
    description: Matches the XML tag for the transaction date in Form 4 filings.
  - type: regex
    pattern: <transactionPricePerShare>
    confidence: 0.9
    element_types:
    - xml_element
    description: Matches the XML tag for the transaction price per share in Form 4
      filings.
  - type: regex
    pattern: <transactionCoding>
    confidence: 0.9
    element_types:
    - xml_element
    description: Matches the XML tag for the transaction coding in Form 4 filings.
- term_id: ownership
  rules:
  - type: semantic
    semantic_phrase: shares ownership stake holdings
    confidence: 0.75
    element_types:
    - paragraph
    - table_cell
    description: Matches various terms used to describe insider ownership of company
