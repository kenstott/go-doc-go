  - type: regex
    pattern: <sharesOwnedFollowingTransaction>
    confidence: 0.9
    element_types:
    - xml_element
    description: Matches the XML tag for the number of shares owned following a transaction
      in Form 4 filings.
- term_id: company
  rules:
  - type: semantic
    semantic_phrase: company corporation issuer enterprise business firm organization
    confidence: 0.75
    element_types:
    - paragraph
    - table_cell
    description: Matches various terms used to refer to the company whose securities
      are being traded.
  - type: keywords
    keywords:
    - securityTitle
    confidence: 0.7
    element_types:
    - xml_element
    description: Matches the exact XML tag for the security title (company name) in
      Form 4 filings.
- term_id: filing
  rules:
  - type: semantic
    semantic_phrase: Form 4 10-K 10-Q 8-K filing report disclosure
    confidence: 0.75
    element_types:
    - paragraph
    - table_cell
    description: Matches various terms used to refer to the regulatory filings that
      contain insider trading information.
  - type: keywords
    keywords:
    - footnoteId
    - transactionFormType
    confidence: 0.7
    element_types:
    - xml_element
    description: Matches the exact XML tags for filing-related information in Form
      4 filings.
- term_id: financial
  rules:
  - type: semantic
    semantic_phrase: revenue sales income earnings profit financial performance
    confidence: 0.75
    element_types:
    - paragraph
    - table_cell
    description: Matches various financial metrics and performance indicators that
      provide context for insider trading activities.
relationship_rules:
- id: insider_executes_transaction
  relationship_type: action
  description: Insider executes a stock transaction
  source:
    term_id: insider
    semantic_phrase: (?i)(executive|director|officer|insider)
  target:
    term_id: transaction
    semantic_phrase: (?i)(buy|purchase|acquisition|acquired|disposition|sold)
  confidence:
    minimum_score: 0.8
  constraints:
    hierarchy_level: document
- id: insider_owns_shares
  relationship_type: ownership
  description: Insider owns company shares
  source:
    term_id: insider
    semantic_phrase: (?i)(executive|director|officer|insider)
  target:
    term_id: ownership
    semantic_phrase: (?i)(owns|ownership|shares)
  confidence:
    minimum_score: 0.8
  constraints:
    hierarchy_level: document
- id: insider_works_for_company
  relationship_type: corporate_structure
  description: Insider works for a company
  source:
    term_id: insider
    semantic_phrase: (?i)(executive|director|officer|insider)
  target:
    term_id: company
    semantic_phrase: (?i)(company|corporation|inc|llc)
  confidence:
    minimum_score: 0.8
  constraints:
    hierarchy_level: document
- id: transaction_involves_company
  relationship_type: transaction
  description: A transaction involves a company's stock
  source:
    term_id: transaction
    semantic_phrase: (?i)(buy|purchase|acquisition|acquired|disposition|sold)
  target:
    term_id: company
    semantic_phrase: (?i)(company|corporation|inc|llc)
  confidence:
    minimum_score: 0.8
  constraints:
    hierarchy_level: document
- id: transaction_occurred_on_date
  relationship_type: temporal
  description: A transaction occurred on a specific date
  source:
    term_id: transaction
    semantic_phrase: (?i)(buy|purchase|acquisition|acquired|disposition|sold)
  target:
    term_id: filing
    semantic_phrase: (?i)(date|filed|reported)
  confidence:
    minimum_score: 0.8
  constraints:
    hierarchy_level: document
- id: company_reports_financial_metrics
  relationship_type: financial
  description: A company reports financial metrics in its filings
  source:
    term_id: company
    semantic_phrase: (?i)(company|corporation|inc|llc)
  target:
    term_id: financial
    semantic_phrase: (?i)(revenue|sales|income|earnings|profit)
  confidence:
    minimum_score: 0.8
  constraints:
    hierarchy_level: document
