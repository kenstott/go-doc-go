domain:
  name: "corporate_leadership_compensation"
  version: "1.0.0"
  description: "Ontology for tracking executive appointments, board composition, and compensation structures from SEC filings - discovered through human-AI conversation"
  discovery_method: "conversation_driven_discovery"
  settings:
    default_confidence_threshold: 0.70
    max_relationships_per_pair: 5
    enable_transitive_inference: true
    human_guided: true

terms:
- id: executive_position
  label: "Executive Position"
  description: "Corporate leadership roles and titles, including both permanent and interim appointments"
  aliases: []
  semantic_variations:
    - "Chief Executive Officer"
    - "CEO"
    - "CFO"
    - "President"
    - "Director"
    - "Officer"
    - "Interim CEO"
    - "Acting Chairman"
    - "Audit Committee Chair"
    - "Compensation Committee Chair"

- id: multiple_roles
  label: "Multiple Roles"
  description: "Cases where an individual holds multiple leadership positions simultaneously"
  aliases: []
  semantic_variations:
    - "dual role"
    - "also serves as"
    - "in addition to their role"
    - "CEO and Chairman"
    - "serves as both"

- id: board_committee
  label: "Board Committee"
  description: "Board-level oversight groups and committee structures"
  aliases: []
  semantic_variations:
    - "Audit Committee"
    - "Compensation Committee"
    - "Committee Member"
    - "Committee Chair"
    - "appointed to committee"
    - "stepping down from committee"

- id: compensation_equity
  label: "Equity Compensation"
  description: "Stock-based compensation components and equity awards"
  aliases: []
  semantic_variations:
    - "RSUs"
    - "stock options"
    - "performance shares"
    - "equity awards"
    - "stock grants"
    - "restricted stock"

- id: compensation_cash
  label: "Cash Compensation"
  description: "Cash-based compensation components including salary and bonuses"
  aliases: []
  semantic_variations:
    - "base salary"
    - "cash bonus"
    - "cash compensation"
    - "incentive pay"
    - "annual bonus"

- id: vesting_conditions
  label: "Vesting Conditions"
  description: "Performance requirements and conditions for compensation vesting"
  aliases: []
  semantic_variations:
    - "performance-based vesting"
    - "vesting conditions"
    - "performance targets"
    - "vesting requirements"
    - "clawback provisions"
    - "grant terms"

element_mappings:
- term_id: executive_position
  rules:
  - type: semantic
    semantic_phrase: "Chief Executive Officer CEO CFO President Director Officer Interim Acting Chairman"
    confidence: 0.80
    element_types: ["paragraph", "table_cell"]
    description: "Matches executive titles and leadership positions"

  - type: regex
    pattern: "(Chief\\s+\\w+\\s+Officer|\\bCEO\\b|\\bCFO\\b|President|Director|Officer)"
    confidence: 0.85
    element_types: ["paragraph", "table_cell"]
    description: "Pattern matching for formal executive titles"

- term_id: multiple_roles
  rules:
  - type: semantic
    semantic_phrase: "dual role also serves as in addition to their role CEO and Chairman serves as both"
    confidence: 0.75
    element_types: ["paragraph", "table_cell"]
    description: "Identifies when executives hold multiple positions"

- term_id: board_committee
  rules:
  - type: semantic
    semantic_phrase: "Audit Committee Compensation Committee Committee Member Committee Chair appointed to committee"
    confidence: 0.80
    element_types: ["paragraph", "table_cell"]
    description: "Matches board committee roles and changes"

- term_id: compensation_equity
  rules:
  - type: semantic
    semantic_phrase: "RSUs stock options performance shares equity awards stock grants restricted stock"
    confidence: 0.85
    element_types: ["paragraph", "table_cell"]
    description: "Identifies stock-based compensation elements"

- term_id: compensation_cash
  rules:
  - type: semantic
    semantic_phrase: "base salary cash bonus cash compensation incentive pay annual bonus"
    confidence: 0.80
    element_types: ["paragraph", "table_cell"]
    description: "Identifies cash-based compensation elements"

- term_id: vesting_conditions
  rules:
  - type: semantic
    semantic_phrase: "performance-based vesting vesting conditions performance targets clawback provisions grant terms"
    confidence: 0.75
    element_types: ["paragraph", "table_cell"]
    description: "Matches performance and vesting requirements"

relationship_rules:
- id: executive_receives_equity
  relationship_type: compensation
  description: "Executive position receives equity compensation"
  source:
    term_id: executive_position
    semantic_phrase: "(?i)(CEO|CFO|President|Director|Officer)"
  target:
    term_id: compensation_equity
    semantic_phrase: "(?i)(stock|equity|RSU|option|grant)"
  confidence:
    minimum_score: 0.80
  constraints:
    hierarchy_level: document

- id: executive_receives_cash
  relationship_type: compensation
  description: "Executive position receives cash compensation"
  source:
    term_id: executive_position
    semantic_phrase: "(?i)(CEO|CFO|President|Director|Officer)"
  target:
    term_id: compensation_cash
    semantic_phrase: "(?i)(salary|bonus|cash|compensation)"
  confidence:
    minimum_score: 0.80
  constraints:
    hierarchy_level: document

- id: executive_serves_on_committee
  relationship_type: governance
  description: "Executive serves on board committee"
  source:
    term_id: executive_position
    semantic_phrase: "(?i)(CEO|CFO|President|Director|Officer)"
  target:
    term_id: board_committee
    semantic_phrase: "(?i)(committee|audit|compensation)"
  confidence:
    minimum_score: 0.75
  constraints:
    hierarchy_level: document

- id: equity_subject_to_vesting
  relationship_type: performance
  description: "Equity compensation subject to vesting conditions"
  source:
    term_id: compensation_equity
    semantic_phrase: "(?i)(stock|equity|RSU|option|grant)"
  target:
    term_id: vesting_conditions
    semantic_phrase: "(?i)(vesting|performance|target|condition)"
  confidence:
    minimum_score: 0.75
  constraints:
    hierarchy_level: document

- id: executive_holds_multiple_roles
  relationship_type: governance
  description: "Executive holds multiple leadership positions"
  source:
    term_id: executive_position
    semantic_phrase: "(?i)(CEO|CFO|President|Director|Officer)"
  target:
    term_id: multiple_roles
    semantic_phrase: "(?i)(also|dual|both|addition)"
  confidence:
    minimum_score: 0.70
  constraints:
    hierarchy_level: document

metadata:
  discovery_conversation:
    human_interests:
      - "executive compensation patterns"
      - "board member appointments"
      - "leadership changes and governance trends"
      - "stock-based compensation variations"
      - "performance-based vesting conditions"
      - "board committee reshuffling"
      - "compensation clawback provisions"

    ai_contributions:
      - "identified data patterns from corpus analysis"
      - "suggested semantic variations for executive titles"
      - "proposed compensation type distinctions"
      - "inferred relationship types from co-occurrence"

    conversation_insights:
      - "human emphasized interim appointments as key transition signals"
      - "multiple roles seen as important governance indicator"
      - "performance-based vesting reveals company priorities"
      - "committee changes often precede strategic shifts"

  corpus_evidence:
    key_discovered_patterns:
      - "officer: 158 occurrences"
      - "director: 81 occurrences"
      - "stock: 182 occurrences"
      - "award: 60 occurrences"
      - "effective often co-occurs with: income, director, award"

    validation_notes:
      - "patterns align with human domain expertise"
      - "semantic rules capture natural language variations"
      - "relationships reflect real governance structures"