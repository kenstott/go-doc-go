version: "1.0.0"
description: "Automotive domain ontology for vehicle specifications, parts, and recalls"

domains:
  - name: "vehicles"
    description: "Vehicle information domain"
    entities:
      - name: "Vehicle"
        description: "Motor vehicle entity"
        queries:
          - path: "$.elements[?(@.content =~ /(Vehicle|Car|Truck|SUV).*VIN.*/)].content"
            id_columns: ["content"]
            confidence: 0.9
            attributes:
              vin: "$.properties.vin"
              make: "$.properties.make"
              model: "$.properties.model"
              year: "$.properties.year"

      - name: "VIN"
        description: "Vehicle Identification Number"
        queries:
          - path: "$.elements[?(@.content =~ /VIN:\\s*[A-HJ-NPR-Z0-9]{17}/)].content"
            id_columns: ["content"]
            confidence: 0.95
            attributes:
              vin_number: "$.content"

      - name: "Manufacturer"
        description: "Vehicle manufacturer"
        queries:
          - path: "$.elements[?(@.content =~ /(Ford|Toyota|GM|Honda|Tesla).*(Motor|Company)/)].content"
            id_columns: ["content"]
            confidence: 0.85

  - name: "parts"
    description: "Vehicle parts and components domain"
    entities:
      - name: "Part"
        description: "Vehicle part or component"
        queries:
          - path: "$.elements[?(@.content =~ /Part Number.*(\\d{3,})/)].content"
            id_columns: ["properties.part_number"]
            confidence: 0.9
            attributes:
              part_number: "$.properties.part_number"
              part_name: "$.properties.part_name"
              price: "$.properties.price"

      - name: "Engine"
        description: "Vehicle engine"
        queries:
          - path: "$.elements[?(@.element_type=='section' && @.content =~ /Engine.*(V6|V8|I4|Electric)/)].content"
            id_columns: ["content"]
            confidence: 0.9

  - name: "recalls"
    description: "Vehicle recalls and safety issues"
    entities:
      - name: "Recall"
        description: "Vehicle recall notice"
        queries:
          - path: "$.elements[?(@.content =~ /Recall.*(Campaign|Notice|Number)/)].content"
            id_columns: ["properties.recall_number"]
            confidence: 0.95
            attributes:
              recall_number: "$.properties.recall_number"
              recall_date: "$.properties.recall_date"
              affected_vehicles: "$.properties.affected_count"

      - name: "SafetyIssue"
        description: "Safety defect or issue"
        queries:
          - path: "$.elements[?(@.content =~ /(Safety|Defect|Hazard)/)].content"
            id_columns: ["content"]
            confidence: 0.8

  relationships:
    - name: "HAS_VIN"
      description: "Vehicle has VIN"
      source_entity: "Vehicle"
      target_entity: "VIN"
      source_query:
        path: "$.elements[?(@.content =~ /(Vehicle|Car)/)].element_id"
        id_columns: ["element_id"]
      target_query:
        path: "$.elements[?(@.content =~ /VIN:/)].element_id"
        id_columns: ["element_id"]
      confidence: 0.9

    - name: "MANUFACTURED_BY"
      description: "Vehicle manufactured by company"
      source_entity: "Vehicle"
      target_entity: "Manufacturer"
      source_query:
        path: "$.elements[?(@.content =~ /Vehicle/)].element_id"
        id_columns: ["element_id"]
      target_query:
        path: "$.elements[?(@.content =~ /(Ford|Toyota|GM)/)].element_id"
        id_columns: ["element_id"]
      confidence: 0.85

    - name: "CONTAINS_PART"
      description: "Vehicle contains part"
      source_entity: "Vehicle"
      target_entity: "Part"
      confidence: 0.8

    - name: "SUBJECT_TO_RECALL"
      description: "Vehicle subject to recall"
      source_entity: "Vehicle"
      target_entity: "Recall"
      confidence: 0.95

    - name: "ADDRESSES_ISSUE"
      description: "Recall addresses safety issue"
      source_entity: "Recall"
      target_entity: "SafetyIssue"
      confidence: 0.9
