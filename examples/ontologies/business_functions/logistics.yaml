domain: logistics
description: Transportation, warehousing operations, fleet management, route optimization, freight forwarding, and last-mile delivery
subdomains:
  - transportation_management
  - warehouse_operations
  - fleet_management
  - freight_forwarding
  - last_mile_delivery
  - route_optimization

entity_types:
  - entity_type: shipment
    description: Individual shipment or freight consignment
    aliases: [freight, consignment, cargo, load]
    element_types: [paragraph, heading, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [shipment, freight, consignment, cargo, load, tracking number, BOL, bill of lading]

  - entity_type: carrier
    description: Transportation carrier or freight provider
    aliases: [transporter, shipper, freight company, haulier]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [carrier, transporter, freight company, trucking company, shipping line, airline]

  - entity_type: vehicle
    description: Transportation vehicle or fleet asset
    aliases: [truck, trailer, vessel, aircraft]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [truck, trailer, vehicle, vessel, container, aircraft, fleet]

  - entity_type: route
    description: Transportation route or lane
    aliases: [lane, shipping lane, delivery route]
    element_types: [paragraph, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [route, lane, origin, destination, from, to, via]

  - entity_type: warehouse_location
    description: Warehouse, distribution center, or fulfillment center
    aliases: [DC, distribution center, fulfillment center, depot]
    element_types: [paragraph, heading, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [warehouse, distribution center, DC, fulfillment center, depot, facility]

  - entity_type: driver
    description: Vehicle driver or operator
    aliases: [operator, trucker, delivery driver]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [driver, operator, trucker, CDL, commercial driver]

  - entity_type: delivery
    description: Final delivery or drop-off
    aliases: [drop-off, delivery stop, consignee delivery]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [delivery, drop-off, delivered, received, signed, POD, proof of delivery]

  - entity_type: freight_rate
    description: Shipping rate or transportation cost
    aliases: [shipping cost, freight charge, transportation rate]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [freight rate, shipping cost, transportation cost, per mile, per kg, rate card]

relationship_types:
  - relationship_type: transported_by
    description: Shipment transported by carrier
    source_entity: shipment
    target_entity: carrier
    sample_rules:
      - type: keyword_match
        keywords: [transported by, shipped via, carrier, hauled by]

  - relationship_type: assigned_to_vehicle
    description: Shipment assigned to vehicle
    source_entity: shipment
    target_entity: vehicle
    sample_rules:
      - type: keyword_match
        keywords: [loaded on, assigned to, vehicle, truck, trailer]

  - relationship_type: follows_route
    description: Shipment follows route
    source_entity: shipment
    target_entity: route
    sample_rules:
      - type: keyword_match
        keywords: [route, from, to, via, lane]

  - relationship_type: stored_at
    description: Shipment stored at warehouse
    source_entity: shipment
    target_entity: warehouse_location
    sample_rules:
      - type: keyword_match
        keywords: [stored at, held at, warehouse, DC, facility]

  - relationship_type: driven_by
    description: Vehicle driven by driver
    source_entity: vehicle
    target_entity: driver
    sample_rules:
      - type: keyword_match
        keywords: [driven by, operator, assigned driver]

  - relationship_type: delivered_to
    description: Shipment delivered to location
    source_entity: shipment
    target_entity: delivery
    sample_rules:
      - type: keyword_match
        keywords: [delivered to, received at, destination, consignee]

  - relationship_type: priced_at
    description: Shipment priced at freight rate
    source_entity: shipment
    target_entity: freight_rate
    sample_rules:
      - type: keyword_match
        keywords: [rate, cost, freight charge, priced at]
