domain: marketing
description: Marketing campaigns, lead generation, customer engagement, brand management, content marketing, and marketing analytics
subdomains:
  - digital_marketing
  - content_marketing
  - marketing_analytics
  - brand_management
  - customer_engagement
  - campaign_management

entity_types:
  - entity_type: campaign
    description: Marketing campaign or promotional initiative
    aliases: [promotion, marketing initiative, advertising campaign]
    element_types: [paragraph, heading, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [campaign, promotion, initiative, marketing program, advertising]

  - entity_type: lead
    description: Potential customer or sales prospect
    aliases: [prospect, potential customer, sales lead]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [lead, prospect, potential customer, inquiry, interested party]

  - entity_type: channel
    description: Marketing or communication channel
    aliases: [marketing channel, distribution channel, media channel]
    element_types: [paragraph, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [email, social media, website, blog, newsletter, SEO, SEM, paid ads, organic]

  - entity_type: content
    description: Marketing content piece
    aliases: [content piece, marketing asset, creative asset]
    element_types: [paragraph, heading, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [blog post, article, whitepaper, case study, infographic, video, ebook]

  - entity_type: brand
    description: Brand or product brand identity
    aliases: [product brand, brand identity, trademark]
    element_types: [paragraph, heading]
    sample_rules:
      - type: keyword_match
        keywords: [brand, trademark, logo, brand identity, brand values, brand voice]

  - entity_type: audience_segment
    description: Target audience or customer segment
    aliases: [target audience, customer segment, demographic]
    element_types: [paragraph, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [target audience, segment, demographic, persona, customer profile]

  - entity_type: metric
    description: Marketing performance metric or KPI
    aliases: [KPI, performance indicator, measurement]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [CTR, conversion rate, ROI, ROAS, impressions, clicks, engagement rate, bounce rate]

relationship_types:
  - relationship_type: targets_audience
    description: Campaign targets specific audience segment
    source_entity: campaign
    target_entity: audience_segment
    sample_rules:
      - type: keyword_match
        keywords: [targets, aimed at, focused on, designed for]

  - relationship_type: uses_channel
    description: Campaign uses marketing channel
    source_entity: campaign
    target_entity: channel
    sample_rules:
      - type: keyword_match
        keywords: [via, through, using, channel, distributed on]

  - relationship_type: generates_lead
    description: Campaign generates leads
    source_entity: campaign
    target_entity: lead
    sample_rules:
      - type: keyword_match
        keywords: [generated, produced, resulted in, created]

  - relationship_type: includes_content
    description: Campaign includes content piece
    source_entity: campaign
    target_entity: content
    sample_rules:
      - type: keyword_match
        keywords: [includes, contains, features, showcases]

  - relationship_type: promotes_brand
    description: Campaign promotes brand
    source_entity: campaign
    target_entity: brand
    sample_rules:
      - type: keyword_match
        keywords: [promotes, advertises, markets, highlights]

  - relationship_type: measured_by
    description: Campaign measured by metric
    source_entity: campaign
    target_entity: metric
    sample_rules:
      - type: keyword_match
        keywords: [measured by, tracked with, performance, metrics, KPI]
