domain: sales
description: Sales opportunities, pipelines, quotations, customer relationships, forecasting, and revenue management
subdomains:
  - lead_management
  - opportunity_management
  - quote_to_cash
  - territory_management
  - sales_analytics
  - customer_relationship

entity_types:
  - entity_type: opportunity
    description: Sales opportunity or potential deal
    aliases: [deal, sales opportunity, potential sale]
    element_types: [paragraph, heading, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [opportunity, deal, potential sale, sales opportunity, prospect]

  - entity_type: quote
    description: Price quotation or proposal
    aliases: [quotation, proposal, price quote, estimate]
    element_types: [paragraph, heading, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [quote, quotation, proposal, estimate, pricing, price quote]

  - entity_type: customer
    description: Customer or client organization
    aliases: [client, account, customer account]
    element_types: [paragraph, heading, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [customer, client, account, buyer, purchaser]

  - entity_type: product
    description: Product or service being sold
    aliases: [service, offering, solution, product line]
    element_types: [paragraph, heading, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [product, service, solution, offering, SKU]

  - entity_type: sales_stage
    description: Stage in the sales pipeline
    aliases: [pipeline stage, sales phase, deal stage]
    element_types: [paragraph, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [qualification, proposal, negotiation, closed won, closed lost, discovery]

  - entity_type: territory
    description: Sales territory or region
    aliases: [region, sales region, geographic area]
    element_types: [paragraph, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [territory, region, area, geographic, EMEA, APAC, Americas, North America]

  - entity_type: sales_rep
    description: Sales representative or account executive
    aliases: [account executive, sales person, AE, sales manager]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [sales rep, account executive, AE, sales manager, sales person]

  - entity_type: forecast
    description: Sales forecast or revenue projection
    aliases: [revenue forecast, sales projection, pipeline forecast]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [forecast, projection, pipeline, quota, target, revenue prediction]

relationship_types:
  - relationship_type: assigned_to_rep
    description: Opportunity assigned to sales rep
    source_entity: opportunity
    target_entity: sales_rep
    sample_rules:
      - type: keyword_match
        keywords: [assigned to, owned by, managed by, responsible]

  - relationship_type: associated_with_customer
    description: Opportunity associated with customer
    source_entity: opportunity
    target_entity: customer
    sample_rules:
      - type: keyword_match
        keywords: [customer, account, client, for]

  - relationship_type: includes_product
    description: Opportunity includes product
    source_entity: opportunity
    target_entity: product
    sample_rules:
      - type: keyword_match
        keywords: [includes, for, selling, offering]

  - relationship_type: at_stage
    description: Opportunity at sales stage
    source_entity: opportunity
    target_entity: sales_stage
    sample_rules:
      - type: keyword_match
        keywords: [stage, phase, status, at]

  - relationship_type: in_territory
    description: Opportunity in sales territory
    source_entity: opportunity
    target_entity: territory
    sample_rules:
      - type: keyword_match
        keywords: [in, territory, region, area]

  - relationship_type: generated_quote
    description: Opportunity generated quote
    source_entity: opportunity
    target_entity: quote
    sample_rules:
      - type: keyword_match
        keywords: [quote, proposal, quotation, pricing]

  - relationship_type: contributes_to_forecast
    description: Opportunity contributes to forecast
    source_entity: opportunity
    target_entity: forecast
    sample_rules:
      - type: keyword_match
        keywords: [forecast, projected, pipeline, included in]
