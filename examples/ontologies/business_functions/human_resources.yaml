domain: human_resources
description: Employee management, recruitment, compensation, benefits, performance management, training, and workforce planning
subdomains:
  - recruitment
  - onboarding
  - compensation
  - benefits
  - performance_management
  - training_development
  - employee_relations

entity_types:
  - entity_type: employee
    description: Individual working for the organization
    aliases: [staff member, worker, team member, personnel]
    element_types: [paragraph, heading, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [employee, staff, personnel, worker, team member, full-time, part-time, contractor]

  - entity_type: position
    description: Job role or position within the organization
    aliases: [job, role, job title, position title]
    element_types: [paragraph, heading, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [position, job title, role, manager, director, analyst, engineer, coordinator]

  - entity_type: department
    description: Organizational unit or division
    aliases: [division, unit, team, group]
    element_types: [paragraph, heading, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [department, division, unit, team, HR, IT, finance, marketing, sales, operations]

  - entity_type: compensation
    description: Salary, wages, or payment structure
    aliases: [salary, wage, pay, remuneration]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [salary, wage, compensation, pay, bonus, commission, hourly rate, annual salary]

  - entity_type: benefit
    description: Employee benefit or perk
    aliases: [perk, employee benefit, fringe benefit]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [health insurance, 401k, retirement plan, PTO, vacation, sick leave, dental, vision]

  - entity_type: performance_review
    description: Employee performance evaluation or assessment
    aliases: [appraisal, evaluation, assessment, review]
    element_types: [paragraph, heading, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [performance review, appraisal, evaluation, assessment, feedback, rating, goals]

  - entity_type: training_program
    description: Educational or skill development program
    aliases: [course, workshop, training, development program]
    element_types: [paragraph, heading, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [training, workshop, course, certification, learning, development, seminar]

relationship_types:
  - relationship_type: reports_to
    description: Employee reporting relationship
    source_entity: employee
    target_entity: employee
    sample_rules:
      - type: keyword_match
        keywords: [reports to, manager, supervisor, direct report]

  - relationship_type: holds_position
    description: Employee holds a specific position
    source_entity: employee
    target_entity: position
    sample_rules:
      - type: keyword_match
        keywords: [position, job title, role, works as]

  - relationship_type: assigned_to_department
    description: Employee assigned to department
    source_entity: employee
    target_entity: department
    sample_rules:
      - type: keyword_match
        keywords: [assigned to, works in, department, division]

  - relationship_type: receives_compensation
    description: Employee receives compensation
    source_entity: employee
    target_entity: compensation
    sample_rules:
      - type: keyword_match
        keywords: [salary, wage, paid, compensation]

  - relationship_type: enrolled_in_benefit
    description: Employee enrolled in benefit plan
    source_entity: employee
    target_entity: benefit
    sample_rules:
      - type: keyword_match
        keywords: [enrolled, participates, receives, benefit, coverage]

  - relationship_type: completed_training
    description: Employee completed training program
    source_entity: employee
    target_entity: training_program
    sample_rules:
      - type: keyword_match
        keywords: [completed, finished, attended, training, course]
