domain: science_research
description: Scientific research, experiments, publications, grants, datasets, and research methodology
subdomains:
  - experimental_research
  - publications
  - grant_management
  - data_management
  - peer_review

entity_types:
  - entity_type: research_project
    description: Scientific research project or study
    aliases: [study, project, investigation, research]
    element_types: [paragraph, heading, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [research, study, project, investigation, experiment]

  - entity_type: experiment
    description: Scientific experiment or trial
    aliases: [trial, test, assay, procedure]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [experiment, trial, test, assay, procedure, methodology]

  - entity_type: publication
    description: Scientific publication or paper
    aliases: [paper, article, journal article, manuscript]
    element_types: [paragraph, heading, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [publication, paper, article, journal, manuscript, published]

  - entity_type: researcher
    description: Researcher or scientist
    aliases: [scientist, investigator, principal investigator, PI]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [researcher, scientist, investigator, PI, principal investigator]

  - entity_type: grant
    description: Research grant or funding
    aliases: [funding, award, grant funding]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [grant, funding, award, NIH, NSF, funding agency]

  - entity_type: dataset
    description: Research dataset or data collection
    aliases: [data, data collection, research data]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [dataset, data, data collection, research data, measurements]

relationship_types:
  - relationship_type: conducted_by
    description: Research conducted by researcher
    source_entity: research_project
    target_entity: researcher
    sample_rules:
      - type: keyword_match
        keywords: [conducted by, led by, principal investigator]

  - relationship_type: part_of
    description: Experiment part of project
    source_entity: experiment
    target_entity: research_project
    sample_rules:
      - type: keyword_match
        keywords: [part of, within, under, related to]

  - relationship_type: published_as
    description: Research published as publication
    source_entity: research_project
    target_entity: publication
    sample_rules:
      - type: keyword_match
        keywords: [published, resulted in, reported in]

  - relationship_type: funded_by
    description: Research funded by grant
    source_entity: research_project
    target_entity: grant
    sample_rules:
      - type: keyword_match
        keywords: [funded by, supported by, grant]

  - relationship_type: generated_dataset
    description: Experiment generated dataset
    source_entity: experiment
    target_entity: dataset
    sample_rules:
      - type: keyword_match
        keywords: [generated, produced, collected, resulted in]
