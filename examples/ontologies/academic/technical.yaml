domain: technical
description: Software documentation, API specifications, technical manuals, architecture documents, and IT infrastructure documentation
subdomains:
    - software_development
    - api_documentation
    - system_architecture
    - networking
    - database
    - cloud_infrastructure
terms:
    - name: API
      synonyms:
        - application programming interface
        - web service
        - endpoint
        - service
      description: Application programming interface
    - name: endpoint
      synonyms:
        - route
        - path
        - resource
        - URI
      description: API endpoint or URL path
    - name: parameter
      synonyms:
        - argument
        - input
        - variable
        - field
      description: Input parameter or variable
    - name: response
      synonyms:
        - output
        - result
        - return value
        - payload
      description: API response or output
    - name: authentication
      synonyms:
        - auth
        - authorization
        - credentials
        - access control
      description: Authentication and authorization mechanism
    - name: schema
      synonyms:
        - structure
        - model
        - definition
        - specification
      description: Data schema or structure definition
    - name: dependency
      synonyms:
        - requirement
        - prerequisite
        - library
        - package
      description: Software dependency or required component
    - name: configuration
      synonyms:
        - config
        - settings
        - options
        - parameters
      description: System or application configuration
    - name: deployment
      synonyms:
        - release
        - rollout
        - installation
        - provisioning
      description: Software deployment or release
    - name: protocol
      synonyms:
        - standard
        - specification
        - format
      description: Communication protocol or standard
entity_types:
    - entity_type: software_component
      description: Software component, module, or service
      aliases:
        - component
        - module
        - service
        - microservice
        - library
      element_types:
        - paragraph
        - heading
        - code
      sample_rules:
        - type: keyword_match
          keywords:
            - service
            - module
            - component
            - library
            - package
    - entity_type: api_endpoint
      description: API endpoint or resource path
      aliases:
        - endpoint
        - route
        - path
        - resource
        - URL
      element_types:
        - paragraph
        - code
        - list_item
      sample_rules:
        - type: regex_pattern
          pattern: '\b(?:GET|POST|PUT|DELETE|PATCH)\s+/[a-zA-Z0-9/_\-{}]+'
        - type: regex_pattern
          pattern: /api/v\d+/[a-zA-Z0-9/_\-]+
    - entity_type: http_method
      description: HTTP request method
      aliases:
        - method
        - verb
        - request type
      element_types:
        - paragraph
        - code
        - table_cell
      sample_rules:
        - type: keyword_match
          keywords:
            - GET
            - POST
            - PUT
            - DELETE
            - PATCH
            - HEAD
            - OPTIONS
    - entity_type: parameter
      description: Function or API parameter
      aliases:
        - argument
        - input
        - field
        - variable
      element_types:
        - paragraph
        - code
        - table_cell
      sample_rules:
        - type: keyword_match
          keywords:
            - parameter
            - param
            - argument
            - arg
            - field
    - entity_type: data_type
      description: Programming data type
      aliases:
        - type
        - class
        - structure
      element_types:
        - paragraph
        - code
        - table_cell
      sample_rules:
        - type: keyword_match
          keywords:
            - string
            - int
            - integer
            - boolean
            - bool
            - float
            - double
            - array
            - object
            - map
            - list
    - entity_type: status_code
      description: HTTP status code
      aliases:
        - response code
        - error code
      element_types:
        - paragraph
        - code
        - table_cell
      sample_rules:
        - type: regex_pattern
          pattern: '\b(?:200|201|204|400|401|403|404|500|502|503)\b'
        - type: keyword_match
          keywords:
            - 200 OK
            - 404 Not Found
            - 500 Internal Server Error
    - entity_type: authentication_method
      description: Authentication or authorization method
      aliases:
        - auth
        - security
        - credentials
      element_types:
        - paragraph
        - heading
      sample_rules:
        - type: keyword_match
          keywords:
            - OAuth
            - JWT
            - API key
            - bearer token
            - basic auth
            - authentication
            - authorization
    - entity_type: database
      description: Database system or instance
      aliases:
        - datastore
        - database system
        - DB
      element_types:
        - paragraph
        - heading
      sample_rules:
        - type: keyword_match
          keywords:
            - PostgreSQL
            - MySQL
            - MongoDB
            - Redis
            - Elasticsearch
            - DynamoDB
            - Cassandra
    - entity_type: protocol
      description: Communication protocol or standard
      aliases:
        - standard
        - specification
      element_types:
        - paragraph
        - heading
      sample_rules:
        - type: keyword_match
          keywords:
            - HTTP
            - HTTPS
            - WebSocket
            - gRPC
            - REST
            - GraphQL
            - MQTT
            - AMQP
            - TCP
            - UDP
    - entity_type: programming_language
      description: Programming language
      aliases:
        - language
        - platform
      element_types:
        - paragraph
        - heading
        - code
      sample_rules:
        - type: keyword_match
          keywords:
            - Python
            - Java
            - JavaScript
            - Go
            - Rust
            - C++
            - TypeScript
            - Ruby
            - PHP
            - Swift
    - entity_type: framework
      description: Software framework or library
      aliases:
        - library
        - toolkit
        - SDK
      element_types:
        - paragraph
        - heading
      sample_rules:
        - type: keyword_match
          keywords:
            - React
            - Django
            - Flask
            - Spring
            - Express
            - FastAPI
            - Angular
            - Vue
            - Rails
    - entity_type: infrastructure_component
      description: Infrastructure or cloud component
      aliases:
        - cloud service
        - infrastructure
        - resource
      element_types:
        - paragraph
        - heading
      sample_rules:
        - type: keyword_match
          keywords:
            - EC2
            - S3
            - Lambda
            - RDS
            - Kubernetes
            - Docker
            - load balancer
            - container
            - VM
    - entity_type: configuration_setting
      description: Configuration setting or environment variable
      aliases:
        - config
        - setting
        - env var
        - option
      element_types:
        - paragraph
        - code
        - table_cell
      sample_rules:
        - type: regex_pattern
          pattern: '\b[A-Z][A-Z0-9_]+\b'
        - type: keyword_match
          keywords:
            - config
            - configuration
            - environment variable
            - setting
    - entity_type: error_type
      description: Error or exception type
      aliases:
        - exception
        - error
        - failure
      element_types:
        - paragraph
        - code
      sample_rules:
        - type: regex_pattern
          pattern: '\b[A-Z][a-zA-Z]*(?:Error|Exception)\b'
        - type: keyword_match
          keywords:
            - error
            - exception
            - failure
            - timeout
common_entity_refs:
    - person
    - role
    - date
    - time
    - duration
    - email
    - phone
    - url
    - percentage
    - number
    - code
relationships:
    - name: component_implements_api
      source_type: software_component
      target_type: api_endpoint
      relationship_type: implements
      description: Component implements API endpoint
      sample_patterns:
        - '{component} implements {endpoint}'
        - '{endpoint} provided by {component}'
    - name: endpoint_accepts_parameter
      source_type: api_endpoint
      target_type: parameter
      relationship_type: related_to
      description: Endpoint accepts parameter
      sample_patterns:
        - '{endpoint} accepts {parameter}'
        - '{parameter} for {endpoint}'
    - name: component_depends_on_component
      source_type: software_component
      target_type: software_component
      relationship_type: depends_on
      description: Component depends on another component
      sample_patterns:
        - '{component} depends on {component}'
        - '{component} requires {component}'
    - name: component_uses_database
      source_type: software_component
      target_type: database
      relationship_type: depends_on
      description: Component uses database
      sample_patterns:
        - '{component} uses {database}'
        - '{component} connects to {database}'
    - name: endpoint_returns_status_code
      source_type: api_endpoint
      target_type: status_code
      relationship_type: related_to
      description: Endpoint returns status code
      sample_patterns:
        - '{endpoint} returns {status_code}'
        - '{status_code} from {endpoint}'
    - name: component_uses_framework
      source_type: software_component
      target_type: framework
      relationship_type: depends_on
      description: Component uses framework
      sample_patterns:
        - '{component} built with {framework}'
        - '{component} uses {framework}'
    - name: component_written_in_language
      source_type: software_component
      target_type: programming_language
      relationship_type: related_to
      description: Component written in programming language
      sample_patterns:
        - '{component} written in {language}'
        - '{component} ({language})'
    - name: endpoint_uses_authentication
      source_type: api_endpoint
      target_type: authentication_method
      relationship_type: depends_on
      description: Endpoint requires authentication
      sample_patterns:
        - '{endpoint} requires {auth}'
        - '{auth} for {endpoint}'
    - name: component_deployed_on_infrastructure
      source_type: software_component
      target_type: infrastructure_component
      relationship_type: related_to
      description: Component deployed on infrastructure
      sample_patterns:
        - '{component} deployed on {infrastructure}'
        - '{component} runs on {infrastructure}'
    - name: component_communicates_via_protocol
      source_type: software_component
      target_type: protocol
      relationship_type: related_to
      description: Component uses communication protocol
      sample_patterns:
        - '{component} uses {protocol}'
        - '{protocol} for {component}'
