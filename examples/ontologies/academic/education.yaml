# Example Education Domain Catalog
# This file demonstrates how to define a custom domain catalog using YAML
# Place domain catalog files in a directory and load them using RegisterFromDirectory()

domain: education
description: Educational institutions, curricula, student records, academic programs, and learning materials

subdomains:
  - k12_education
  - higher_education
  - professional_development
  - online_learning

terms:
  - name: curriculum
    synonyms:
      - syllabus
      - course of study
      - program
      - coursework
    description: Planned educational program or course content

  - name: assessment
    synonyms:
      - evaluation
      - test
      - exam
      - quiz
      - grading
    description: Measurement of student learning

  - name: accreditation
    synonyms:
      - certification
      - recognition
      - approval
    description: Official recognition of educational quality

  - name: enrollment
    synonyms:
      - registration
      - admission
      - matriculation
    description: Student registration in courses or programs

entity_types:
  - entity_type: student
    description: Student or learner
    aliases:
      - learner
      - pupil
      - enrollee
    element_types:
      - paragraph
      - table_cell
    sample_rules:
      - type: keyword_match
        keywords:
          - student
          - pupil
          - learner

  - entity_type: instructor
    description: Teacher, professor, or instructor
    aliases:
      - teacher
      - professor
      - educator
      - faculty
    element_types:
      - paragraph
      - heading
    sample_rules:
      - type: keyword_match
        keywords:
          - professor
          - teacher
          - instructor
          - Dr.

  - entity_type: course
    description: Academic course or class
    aliases:
      - class
      - subject
      - module
    element_types:
      - paragraph
      - heading
      - list_item
    sample_rules:
      - type: keyword_match
        keywords:
          - course
          - class
          - subject
      - type: regex_pattern
        pattern: '\b[A-Z]{2,4}\s*\d{3,4}\b'

  - entity_type: program
    description: Degree program or academic program
    aliases:
      - degree
      - major
      - concentration
    element_types:
      - paragraph
      - heading
    sample_rules:
      - type: keyword_match
        keywords:
          - program
          - degree
          - major
          - Bachelor
          - Master
          - PhD

  - entity_type: institution
    description: Educational institution
    aliases:
      - school
      - college
      - university
    element_types:
      - paragraph
      - heading
    sample_rules:
      - type: keyword_match
        keywords:
          - university
          - college
          - school
          - institute
      - type: regex_pattern
        pattern: '\b[A-Z][a-z]+\s+(?:University|College|Institute)\b'

  - entity_type: grade
    description: Student grade or mark
    aliases:
      - mark
      - score
      - result
    element_types:
      - table_cell
      - paragraph
    sample_rules:
      - type: regex_pattern
        pattern: '\b[A-F][+-]?\b'
      - type: regex_pattern
        pattern: '\b\d{1,3}%\b'

  - entity_type: credit
    description: Academic credit or credit hour
    aliases:
      - credit hour
      - unit
    element_types:
      - table_cell
      - paragraph
    sample_rules:
      - type: keyword_match
        keywords:
          - credit
          - credits
          - credit hour
          - unit

# Reference common entities from common.go
common_entity_refs:
  - person        # For students, faculty, staff
  - role          # For academic roles
  - date          # For semester dates, deadlines
  - time          # For class times
  - duration      # For course duration, semester length
  - address       # For campus addresses
  - city          # For campus locations
  - region        # For state/province
  - email         # For student/faculty contact
  - phone         # For contact information
  - url           # For course websites, portals
  - percentage    # For grades, scores
  - number        # For course numbers, credits

relationships:
  - name: student_enrolled_in_course
    source_type: student
    target_type: course
    relationship_type: related_to
    description: Student enrolled in course
    sample_patterns:
      - "{student} enrolled in {course}"
      - "{student} taking {course}"
      - "{course} for {student}"

  - name: instructor_teaches_course
    source_type: instructor
    target_type: course
    relationship_type: related_to
    description: Instructor teaches course
    sample_patterns:
      - "{instructor} teaches {course}"
      - "{course} taught by {instructor}"
      - "{instructor}, instructor for {course}"

  - name: course_part_of_program
    source_type: course
    target_type: program
    relationship_type: part_of
    description: Course is part of academic program
    sample_patterns:
      - "{course} in {program}"
      - "{program} includes {course}"

  - name: student_pursuing_program
    source_type: student
    target_type: program
    relationship_type: related_to
    description: Student pursuing degree program
    sample_patterns:
      - "{student} pursuing {program}"
      - "{program} student: {student}"

  - name: institution_offers_program
    source_type: institution
    target_type: program
    relationship_type: related_to
    description: Institution offers program
    sample_patterns:
      - "{institution} offers {program}"
      - "{program} at {institution}"

  - name: student_received_grade
    source_type: student
    target_type: grade
    relationship_type: related_to
    description: Student received grade
    sample_patterns:
      - "{student} received {grade}"
      - "{grade} for {student}"
