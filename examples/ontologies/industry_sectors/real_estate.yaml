domain: real_estate
description: Property management, leases, facilities, space management, property valuation, and commercial real estate
subdomains:
  - property_management
  - lease_administration
  - facilities_management
  - commercial_real_estate
  - property_valuation

entity_types:
  - entity_type: property
    description: Real estate property or building
    aliases: [building, real estate, asset, facility]
    element_types: [paragraph, heading, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [property, building, facility, real estate, asset, premises]

  - entity_type: lease
    description: Lease agreement or rental contract
    aliases: [rental agreement, tenancy agreement, lease contract]
    element_types: [paragraph, heading, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [lease, rental, tenancy, lease agreement, rental agreement]

  - entity_type: tenant
    description: Tenant or lessee
    aliases: [lessee, renter, occupant]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [tenant, lessee, renter, occupant]

  - entity_type: landlord
    description: Property owner or lessor
    aliases: [lessor, property owner, owner]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [landlord, lessor, property owner, owner]

  - entity_type: rental_rate
    description: Rental rate or lease rate
    aliases: [rent, lease rate, rental price]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [rent, rental rate, lease rate, per square foot, PSF, rental price]

  - entity_type: square_footage
    description: Property size or area
    aliases: [area, size, square feet, SF]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [square feet, SF, square footage, area, size]

relationship_types:
  - relationship_type: leased_by
    description: Property leased by tenant
    source_entity: property
    target_entity: tenant
    sample_rules:
      - type: keyword_match
        keywords: [leased by, tenant, renter, occupied by]

  - relationship_type: owned_by
    description: Property owned by landlord
    source_entity: property
    target_entity: landlord
    sample_rules:
      - type: keyword_match
        keywords: [owned by, owner, landlord]

  - relationship_type: has_lease
    description: Property has lease agreement
    source_entity: property
    target_entity: lease
    sample_rules:
      - type: keyword_match
        keywords: [lease, rental agreement, tenancy]

  - relationship_type: priced_at
    description: Property priced at rental rate
    source_entity: property
    target_entity: rental_rate
    sample_rules:
      - type: keyword_match
        keywords: [priced at, rent, rental rate]

  - relationship_type: has_size
    description: Property has square footage
    source_entity: property
    target_entity: square_footage
    sample_rules:
      - type: keyword_match
        keywords: [square feet, SF, area, size]
