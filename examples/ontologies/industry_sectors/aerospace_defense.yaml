domain: aerospace_defense
description: Aircraft, spacecraft, defense systems, maintenance, contracts, and aerospace operations
subdomains:
  - aircraft_operations
  - maintenance_repair_overhaul
  - defense_contracts
  - flight_operations
  - aerospace_manufacturing

entity_types:
  - entity_type: aircraft
    description: Aircraft or aerospace vehicle
    aliases: [plane, helicopter, spacecraft, vehicle]
    element_types: [paragraph, heading, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [aircraft, plane, helicopter, spacecraft, tail number, registration]

  - entity_type: maintenance_event
    description: Maintenance or repair event
    aliases: [service, repair, inspection, overhaul]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [maintenance, repair, inspection, service, overhaul, MRO]

  - entity_type: defense_contract
    description: Defense or aerospace contract
    aliases: [contract, agreement, procurement]
    element_types: [paragraph, heading, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [contract, procurement, award, solicitation, RFP]

  - entity_type: flight
    description: Flight or mission
    aliases: [mission, sortie, flight operation]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [flight, mission, sortie, flight plan, departure, arrival]

  - entity_type: component
    description: Aircraft component or part
    aliases: [part, assembly, system, subsystem]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [component, part, assembly, system, subsystem, engine, avionics]

relationship_types:
  - relationship_type: maintained_by
    description: Aircraft maintained by event
    source_entity: aircraft
    target_entity: maintenance_event
    sample_rules:
      - type: keyword_match
        keywords: [maintained, serviced, repaired, inspected]

  - relationship_type: requires_component
    description: Maintenance requires component
    source_entity: maintenance_event
    target_entity: component
    sample_rules:
      - type: keyword_match
        keywords: [requires, needs, replacement, part]

  - relationship_type: contracted_for
    description: Aircraft contracted for
    source_entity: defense_contract
    target_entity: aircraft
    sample_rules:
      - type: keyword_match
        keywords: [for, procurement of, purchase of]

  - relationship_type: operated_as
    description: Aircraft operated as flight
    source_entity: aircraft
    target_entity: flight
    sample_rules:
      - type: keyword_match
        keywords: [operated as, flight, mission]
