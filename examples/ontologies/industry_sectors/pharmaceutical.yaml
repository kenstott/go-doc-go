domain: pharmaceutical
description: Drug development, clinical trials, regulatory affairs, pharmaceutical manufacturing, pharmacovigilance, and commercialization
subdomains:
  - drug_discovery
  - clinical_trials
  - regulatory_affairs
  - manufacturing
  - pharmacovigilance
  - commercial_operations
  - medical_affairs

entity_types:
  - entity_type: drug_compound
    description: Chemical compound or active pharmaceutical ingredient (API)
    aliases: [compound, API, active ingredient, molecule, substance]
    element_types: [paragraph, heading, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [compound, API, active ingredient, molecule, substance, chemical entity, drug substance]

  - entity_type: drug_product
    description: Branded or generic pharmaceutical product
    aliases: [medication, drug, pharmaceutical, medicine, product]
    element_types: [paragraph, heading, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [drug product, medication, pharmaceutical product, brand name, generic name, trade name]

  - entity_type: clinical_trial
    description: Clinical study or trial for drug development
    aliases: [study, trial, clinical study, research study]
    element_types: [paragraph, heading, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [clinical trial, study, phase I, phase II, phase III, phase IV, NCT number, protocol]

  - entity_type: indication
    description: Disease or condition that drug treats
    aliases: [disease, condition, disorder, therapeutic area]
    element_types: [paragraph, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [indication, disease, condition, disorder, therapeutic area, treatment for]

  - entity_type: adverse_event
    description: Adverse reaction or side effect
    aliases: [side effect, adverse reaction, AE, SAE, toxicity]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [adverse event, AE, SAE, side effect, adverse reaction, toxicity, safety signal]

  - entity_type: regulatory_agency
    description: Government regulatory body
    aliases: [FDA, EMA, PMDA, health authority, regulator]
    element_types: [paragraph, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [FDA, EMA, PMDA, Health Canada, regulatory agency, health authority, regulator]

  - entity_type: regulatory_submission
    description: Regulatory filing or submission
    aliases: [NDA, BLA, IND, ANDA, MAA, filing]
    element_types: [paragraph, heading, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [NDA, BLA, IND, ANDA, MAA, regulatory submission, filing, application]

  - entity_type: patent
    description: Intellectual property patent
    aliases: [IP, intellectual property, patent number, exclusivity]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [patent, IP, intellectual property, patent number, exclusivity, patent expiry]

  - entity_type: manufacturer
    description: Drug manufacturing facility or company
    aliases: [CMO, CDMO, manufacturing site, facility, plant]
    element_types: [paragraph, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [manufacturer, CMO, CDMO, manufacturing site, production facility, plant]

  - entity_type: formulation
    description: Drug formulation or dosage form
    aliases: [dosage form, formulation, tablet, capsule, injection]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [formulation, dosage form, tablet, capsule, injection, oral, IV, topical]

  - entity_type: biomarker
    description: Biological marker or endpoint
    aliases: [endpoint, marker, biological marker, surrogate endpoint]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [biomarker, endpoint, marker, biological marker, surrogate endpoint, target]

  - entity_type: investigator
    description: Principal investigator or research lead
    aliases: [PI, principal investigator, researcher, study lead]
    element_types: [paragraph, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [principal investigator, PI, investigator, researcher, study lead, site investigator]

  - entity_type: sponsor
    description: Clinical trial or study sponsor
    aliases: [study sponsor, pharmaceutical company, CRO, sponsor organization]
    element_types: [paragraph, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [sponsor, study sponsor, pharmaceutical company, CRO, contract research organization]

  - entity_type: pharmacokinetics
    description: Drug absorption, distribution, metabolism, excretion (ADME)
    aliases: [PK, ADME, pharmacokinetic, drug metabolism]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [pharmacokinetics, PK, ADME, absorption, distribution, metabolism, excretion, half-life]

  - entity_type: pharmacodynamics
    description: Drug mechanism of action and effects
    aliases: [PD, mechanism of action, MOA, drug effect]
    element_types: [paragraph, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [pharmacodynamics, PD, mechanism of action, MOA, drug effect, mode of action]

  - entity_type: quality_specification
    description: Quality control or quality assurance specification
    aliases: [QC, QA, specification, quality standard, release criteria]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [quality specification, QC, QA, release criteria, specification, quality standard]

  - entity_type: batch_lot
    description: Manufacturing batch or lot
    aliases: [batch, lot, lot number, batch number, production batch]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [batch, lot, lot number, batch number, production batch, manufacturing batch]

  - entity_type: clinical_endpoint
    description: Primary or secondary clinical trial endpoint
    aliases: [endpoint, outcome, efficacy measure, clinical outcome]
    element_types: [paragraph, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [primary endpoint, secondary endpoint, outcome, efficacy measure, clinical outcome]

relationship_types:
  - relationship_type: treats_indication
    description: Drug treats indication
    source_entity: drug_product
    target_entity: indication
    sample_rules:
      - type: keyword_match
        keywords: [treats, indicated for, approved for, treatment of, therapy for]

  - relationship_type: contains_compound
    description: Drug product contains active compound
    source_entity: drug_product
    target_entity: drug_compound
    sample_rules:
      - type: keyword_match
        keywords: [contains, active ingredient, comprised of, formulated with]

  - relationship_type: tested_in_trial
    description: Drug tested in clinical trial
    source_entity: drug_product
    target_entity: clinical_trial
    sample_rules:
      - type: keyword_match
        keywords: [tested in, evaluated in, clinical trial, study protocol]

  - relationship_type: causes_adverse_event
    description: Drug causes adverse event
    source_entity: drug_product
    target_entity: adverse_event
    sample_rules:
      - type: keyword_match
        keywords: [causes, associated with, adverse event, side effect, reported]

  - relationship_type: approved_by_agency
    description: Drug approved by regulatory agency
    source_entity: drug_product
    target_entity: regulatory_agency
    sample_rules:
      - type: keyword_match
        keywords: [approved by, authorized by, cleared by, regulatory approval from]

  - relationship_type: filed_with_agency
    description: Regulatory submission filed with agency
    source_entity: regulatory_submission
    target_entity: regulatory_agency
    sample_rules:
      - type: keyword_match
        keywords: [filed with, submitted to, application to, submission to]

  - relationship_type: manufactured_by
    description: Drug manufactured by facility
    source_entity: drug_product
    target_entity: manufacturer
    sample_rules:
      - type: keyword_match
        keywords: [manufactured by, produced by, made by, manufacturing site]

  - relationship_type: protected_by_patent
    description: Drug protected by patent
    source_entity: drug_product
    target_entity: patent
    sample_rules:
      - type: keyword_match
        keywords: [protected by, patent, covered by, intellectual property]

  - relationship_type: uses_formulation
    description: Drug uses specific formulation
    source_entity: drug_product
    target_entity: formulation
    sample_rules:
      - type: keyword_match
        keywords: [formulated as, dosage form, available as, formulation]

  - relationship_type: targets_biomarker
    description: Drug targets biomarker
    source_entity: drug_compound
    target_entity: biomarker
    sample_rules:
      - type: keyword_match
        keywords: [targets, acts on, binds to, inhibits, agonist, antagonist]

  - relationship_type: led_by_investigator
    description: Trial led by investigator
    source_entity: clinical_trial
    target_entity: investigator
    sample_rules:
      - type: keyword_match
        keywords: [led by, principal investigator, conducted by, investigator]

  - relationship_type: sponsored_by
    description: Trial sponsored by organization
    source_entity: clinical_trial
    target_entity: sponsor
    sample_rules:
      - type: keyword_match
        keywords: [sponsored by, funded by, supported by, sponsor]

  - relationship_type: measures_endpoint
    description: Trial measures clinical endpoint
    source_entity: clinical_trial
    target_entity: clinical_endpoint
    sample_rules:
      - type: keyword_match
        keywords: [measures, primary endpoint, secondary endpoint, outcome measure]

  - relationship_type: exhibits_pk_profile
    description: Drug exhibits pharmacokinetic profile
    source_entity: drug_product
    target_entity: pharmacokinetics
    sample_rules:
      - type: keyword_match
        keywords: [pharmacokinetics, PK profile, ADME, absorption, metabolism]

  - relationship_type: exhibits_pd_profile
    description: Drug exhibits pharmacodynamic profile
    source_entity: drug_product
    target_entity: pharmacodynamics
    sample_rules:
      - type: keyword_match
        keywords: [mechanism of action, MOA, pharmacodynamics, PD profile]

  - relationship_type: meets_specification
    description: Batch meets quality specification
    source_entity: batch_lot
    target_entity: quality_specification
    sample_rules:
      - type: keyword_match
        keywords: [meets specification, complies with, passes, conforms to]

  - relationship_type: part_of_batch
    description: Product part of manufacturing batch
    source_entity: drug_product
    target_entity: batch_lot
    sample_rules:
      - type: keyword_match
        keywords: [batch, lot number, manufactured in, production batch]