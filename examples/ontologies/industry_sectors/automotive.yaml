domain: automotive
description: Vehicles, parts, service, sales, dealerships, and automotive manufacturing
subdomains:
  - vehicle_sales
  - parts_inventory
  - service_management
  - manufacturing
  - dealership_management

entity_types:
  - entity_type: vehicle
    description: Motor vehicle or automobile
    aliases: [car, automobile, truck, SUV]
    element_types: [paragraph, heading, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [vehicle, car, automobile, truck, SUV, VIN, model, make]

  - entity_type: part
    description: Vehicle part or component
    aliases: [component, spare part, auto part]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [part, component, spare part, OEM, part number, SKU]

  - entity_type: service_appointment
    description: Vehicle service or maintenance appointment
    aliases: [service, maintenance, repair]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [service, maintenance, repair, oil change, inspection, tune-up]

  - entity_type: dealership
    description: Vehicle dealership or sales location
    aliases: [dealer, showroom, sales center]
    element_types: [paragraph, heading, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [dealership, dealer, showroom, sales center, service center]

  - entity_type: customer
    description: Vehicle customer or owner
    aliases: [owner, buyer, client]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [customer, owner, buyer, client, driver]

relationship_types:
  - relationship_type: owned_by
    description: Vehicle owned by customer
    source_entity: vehicle
    target_entity: customer
    sample_rules:
      - type: keyword_match
        keywords: [owned by, belongs to, registered to]

  - relationship_type: requires_part
    description: Service requires part
    source_entity: service_appointment
    target_entity: part
    sample_rules:
      - type: keyword_match
        keywords: [requires, needs, part, component]

  - relationship_type: serviced_at
    description: Vehicle serviced at dealership
    source_entity: vehicle
    target_entity: dealership
    sample_rules:
      - type: keyword_match
        keywords: [serviced at, service location, dealer]

  - relationship_type: sold_by
    description: Vehicle sold by dealership
    source_entity: vehicle
    target_entity: dealership
    sample_rules:
      - type: keyword_match
        keywords: [sold by, purchased from, dealer]
