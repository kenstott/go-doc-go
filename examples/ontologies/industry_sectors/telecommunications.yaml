domain: telecommunications
description: Networks, subscribers, services, billing, infrastructure, and telecommunications operations
subdomains:
  - network_infrastructure
  - subscriber_management
  - service_provisioning
  - billing
  - network_operations

entity_types:
  - entity_type: subscriber
    description: Telecommunications subscriber or customer
    aliases: [customer, account, user, line]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [subscriber, customer, account, phone number, mobile number]

  - entity_type: service_plan
    description: Service plan or subscription package
    aliases: [plan, package, subscription, tariff]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [plan, package, subscription, unlimited, data plan, voice plan]

  - entity_type: network_element
    description: Network infrastructure element
    aliases: [tower, cell site, base station, switch]
    element_types: [paragraph, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [tower, cell site, base station, switch, router, gateway]

  - entity_type: service
    description: Telecommunications service
    aliases: [feature, offering, add-on]
    element_types: [paragraph, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [voice, data, SMS, MMS, roaming, voicemail, call forwarding]

relationship_types:
  - relationship_type: subscribed_to
    description: Subscriber subscribed to plan
    source_entity: subscriber
    target_entity: service_plan
    sample_rules:
      - type: keyword_match
        keywords: [subscribed, plan, on plan, has plan]

  - relationship_type: uses_service
    description: Subscriber uses service
    source_entity: subscriber
    target_entity: service
    sample_rules:
      - type: keyword_match
        keywords: [uses, enabled, activated, has service]

  - relationship_type: served_by
    description: Subscriber served by network element
    source_entity: subscriber
    target_entity: network_element
    sample_rules:
      - type: keyword_match
        keywords: [served by, connected to, on network]
