domain: energy_utilities
description: Power generation, transmission, distribution, customer billing, renewable energy, and utility infrastructure
subdomains:
  - power_generation
  - transmission_distribution
  - customer_billing
  - renewable_energy
  - grid_management

entity_types:
  - entity_type: power_plant
    description: Power generation facility
    aliases: [generation facility, plant, power station]
    element_types: [paragraph, heading, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [power plant, generation facility, plant, power station, generator]

  - entity_type: transmission_line
    description: Power transmission line or infrastructure
    aliases: [power line, transmission infrastructure, grid]
    element_types: [paragraph, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [transmission line, power line, grid, transmission infrastructure]

  - entity_type: utility_customer
    description: Utility customer or account
    aliases: [customer, account, subscriber]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [customer, account, subscriber, ratepayer]

  - entity_type: energy_consumption
    description: Energy usage or consumption
    aliases: [usage, consumption, demand, load]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [consumption, usage, kWh, kilowatt-hour, demand, load, megawatt]

  - entity_type: utility_rate
    description: Utility rate or tariff
    aliases: [tariff, rate, price, billing rate]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [rate, tariff, price per kWh, billing rate, electricity rate]

  - entity_type: renewable_source
    description: Renewable energy source
    aliases: [solar, wind, hydro, renewable]
    element_types: [paragraph, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [solar, wind, hydro, renewable, photovoltaic, wind turbine]

relationship_types:
  - relationship_type: generated_by
    description: Energy generated by plant
    source_entity: energy_consumption
    target_entity: power_plant
    sample_rules:
      - type: keyword_match
        keywords: [generated by, produced by, from]

  - relationship_type: transmitted_via
    description: Energy transmitted via line
    source_entity: energy_consumption
    target_entity: transmission_line
    sample_rules:
      - type: keyword_match
        keywords: [transmitted via, delivered through, carried by]

  - relationship_type: consumed_by
    description: Energy consumed by customer
    source_entity: energy_consumption
    target_entity: utility_customer
    sample_rules:
      - type: keyword_match
        keywords: [consumed by, used by, customer]

  - relationship_type: billed_at
    description: Customer billed at rate
    source_entity: utility_customer
    target_entity: utility_rate
    sample_rules:
      - type: keyword_match
        keywords: [billed at, charged, rate, tariff]

  - relationship_type: powered_by
    description: Facility powered by renewable source
    source_entity: power_plant
    target_entity: renewable_source
    sample_rules:
      - type: keyword_match
        keywords: [powered by, uses, renewable, solar, wind]
