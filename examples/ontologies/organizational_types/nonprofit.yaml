domain: nonprofit
description: Nonprofit organization management including fundraising, donor management, grants, programs, volunteers, and impact measurement

subdomains:
  - fundraising
  - donor_management
  - grant_management
  - program_delivery
  - volunteer_coordination
  - impact_measurement

terms:
  - name: fundraising
    synonyms: [development, donations, giving, charitable giving]
    description: Activities related to raising funds for the organization

  - name: donor
    synonyms: [contributor, benefactor, sponsor, supporter, philanthropist]
    description: Individual or organization that provides financial support

  - name: grant
    synonyms: [award, funding, endowment, subsidy]
    description: Financial award from a foundation or government agency

  - name: program
    synonyms: [initiative, project, service, outreach]
    description: Organized activity or service delivered by the nonprofit

  - name: volunteer
    synonyms: [helper, supporter, activist, community member]
    description: Person who donates time and skills to the organization

  - name: impact
    synonyms: [outcome, result, effect, benefit, change]
    description: Measurable positive change created by the organization

entity_types:
  - entity_type: donor
    description: Individual or organization providing financial support
    aliases: [contributor, benefactor, sponsor, supporter]
    element_types: [paragraph, table_cell, heading]
    sample_rules:
      - type: keyword_match
        keywords: [donor, contributor, sponsor, benefactor]

  - entity_type: donation
    description: Financial contribution or gift
    aliases: [contribution, gift, pledge, grant]
    element_types: [table_cell, paragraph]
    sample_rules:
      - type: regex_pattern
        pattern: \$\d{1,3}(?:,\d{3})*(?:\.\d{2})?

  - entity_type: grant
    description: Formal funding award from foundation or government
    aliases: [award, funding, endowment]
    element_types: [paragraph, heading, table_cell]
    sample_rules:
      - type: keyword_match
        keywords: [grant, award, funding, foundation grant]

  - entity_type: program
    description: Organized service or activity delivered by nonprofit
    aliases: [initiative, project, service, outreach program]
    element_types: [paragraph, heading]
    sample_rules:
      - type: keyword_match
        keywords: [program, initiative, project, outreach]

  - entity_type: volunteer
    description: Person donating time and skills
    aliases: [helper, supporter, community volunteer]
    element_types: [paragraph, table_cell]
    sample_rules:
      - type: keyword_match
        keywords: [volunteer, helper, supporter]

  - entity_type: beneficiary
    description: Person or community served by the nonprofit
    aliases: [client, participant, recipient, member]
    element_types: [paragraph, table_cell]
    sample_rules:
      - type: keyword_match
        keywords: [beneficiary, participant, client, recipient]

  - entity_type: foundation
    description: Grant-making organization
    aliases: [philanthropic organization, charitable foundation]
    element_types: [paragraph, heading]
    sample_rules:
      - type: regex_pattern
        pattern: '\b[A-Z][a-z]+(?: [A-Z][a-z]+)* Foundation\b'

  - entity_type: nonprofit_organization
    description: Tax-exempt charitable organization
    aliases: [charity, NGO, 501c3, charitable organization]
    element_types: [paragraph, heading]
    sample_rules:
      - type: keyword_match
        keywords: [nonprofit, NGO, charity, 501(c)(3), charitable organization]

  - entity_type: impact_metric
    description: Measure of social impact or outcomes
    aliases: [outcome, result, KPI, metric]
    element_types: [table_cell, paragraph]
    sample_rules:
      - type: keyword_match
        keywords: [lives impacted, people served, outcomes achieved, impact]

common_entity_refs:
  - person
  - email
  - phone
  - address
  - date
  - percentage
  - number

relationships:
  - name: donor_contributes_to
    source_type: donor
    target_type: nonprofit_organization
    relationship_type: related_to
    description: Donor provides financial support to nonprofit
    sample_patterns:
      - "{donor} donated to {nonprofit_organization}"
      - "{donor} contributed ${amount} to {nonprofit_organization}"

  - name: grant_awarded_by
    source_type: grant
    target_type: foundation
    relationship_type: related_to
    description: Grant awarded by foundation
    sample_patterns:
      - "{grant} awarded by {foundation}"
      - "{foundation} provided {grant}"

  - name: volunteer_supports
    source_type: volunteer
    target_type: program
    relationship_type: part_of
    description: Volunteer participates in program
    sample_patterns:
      - "{volunteer} volunteers for {program}"
      - "{volunteer} supports {program}"

  - name: program_serves
    source_type: program
    target_type: beneficiary
    relationship_type: related_to
    description: Program provides services to beneficiaries
    sample_patterns:
      - "{program} serves {beneficiary}"
      - "{program} benefits {beneficiary}"
