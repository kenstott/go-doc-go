domain: government
description: Government operations, regulations, permits, licenses, public records, and citizen services
subdomains:
  - licensing
  - permits
  - public_records
  - citizen_services
  - regulatory_compliance

entity_types:
  - entity_type: regulation
    description: Government regulation or law
    aliases: [law, statute, ordinance, rule]
    element_types: [paragraph, heading, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [regulation, law, statute, ordinance, rule, code, CFR, USC]

  - entity_type: permit
    description: Government permit or authorization
    aliases: [authorization, approval, license]
    element_types: [paragraph, heading, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [permit, authorization, approval, building permit, zoning permit]

  - entity_type: license
    description: Government license or certification
    aliases: [certification, credential, registration]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [license, certification, credential, registration, business license]

  - entity_type: citizen
    description: Citizen or resident
    aliases: [resident, constituent, taxpayer]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [citizen, resident, constituent, taxpayer]

  - entity_type: government_agency
    description: Government agency or department
    aliases: [department, bureau, agency, office]
    element_types: [paragraph, heading, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [agency, department, bureau, office, division, DMV, EPA, IRS]

  - entity_type: public_record
    description: Public record or document
    aliases: [government document, official record, filing]
    element_types: [paragraph, heading, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [public record, government document, official record, filing]

relationship_types:
  - relationship_type: issued_by
    description: Permit issued by agency
    source_entity: permit
    target_entity: government_agency
    sample_rules:
      - type: keyword_match
        keywords: [issued by, granted by, approved by]

  - relationship_type: issued_to
    description: Permit issued to citizen
    source_entity: permit
    target_entity: citizen
    sample_rules:
      - type: keyword_match
        keywords: [issued to, granted to, holder]

  - relationship_type: governed_by
    description: Permit governed by regulation
    source_entity: permit
    target_entity: regulation
    sample_rules:
      - type: keyword_match
        keywords: [governed by, under, pursuant to, according to]

  - relationship_type: maintained_by
    description: Record maintained by agency
    source_entity: public_record
    target_entity: government_agency
    sample_rules:
      - type: keyword_match
        keywords: [maintained by, held by, managed by]

  - relationship_type: applies_to
    description: Regulation applies to entity
    source_entity: regulation
    target_entity: citizen
    sample_rules:
      - type: keyword_match
        keywords: [applies to, governs, regulates, covers]
