domain: sustainability_esg
description: Environmental metrics, social responsibility, governance, carbon tracking, and ESG reporting
subdomains:
  - environmental_metrics
  - social_responsibility
  - governance
  - carbon_accounting
  - esg_reporting

entity_types:
  - entity_type: esg_initiative
    description: ESG initiative or program
    aliases: [initiative, program, sustainability initiative]
    element_types: [paragraph, heading, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [initiative, program, sustainability, ESG initiative, green initiative]

  - entity_type: emission
    description: Carbon emission or greenhouse gas
    aliases: [carbon emission, GHG, greenhouse gas, CO2]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [emission, carbon, CO2, greenhouse gas, GHG, tons CO2e]

  - entity_type: environmental_metric
    description: Environmental performance metric
    aliases: [environmental KPI, sustainability metric, green metric]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [environmental metric, sustainability metric, carbon footprint, energy consumption]

  - entity_type: social_metric
    description: Social responsibility metric
    aliases: [social KPI, diversity metric, community impact]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [social metric, diversity, inclusion, community impact, employee wellbeing]

  - entity_type: governance_policy
    description: Governance policy or framework
    aliases: [policy, framework, governance framework, compliance policy]
    element_types: [paragraph, heading, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [governance, policy, framework, compliance, board oversight]

  - entity_type: esg_report
    description: ESG report or disclosure
    aliases: [sustainability report, ESG disclosure, CSR report]
    element_types: [paragraph, heading, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [ESG report, sustainability report, disclosure, CSR report]

relationship_types:
  - relationship_type: reduces_emission
    description: Initiative reduces emission
    source_entity: esg_initiative
    target_entity: emission
    sample_rules:
      - type: keyword_match
        keywords: [reduces, cuts, lowers, decreases, mitigates]

  - relationship_type: tracks_metric
    description: Initiative tracks environmental metric
    source_entity: esg_initiative
    target_entity: environmental_metric
    sample_rules:
      - type: keyword_match
        keywords: [tracks, measures, monitors, reports]

  - relationship_type: governed_by
    description: Initiative governed by policy
    source_entity: esg_initiative
    target_entity: governance_policy
    sample_rules:
      - type: keyword_match
        keywords: [governed by, complies with, follows, adheres to]

  - relationship_type: reported_in
    description: Metric reported in ESG report
    source_entity: environmental_metric
    target_entity: esg_report
    sample_rules:
      - type: keyword_match
        keywords: [reported in, disclosed in, published in]

  - relationship_type: measures_social
    description: Social metric measures impact
    source_entity: social_metric
    target_entity: esg_initiative
    sample_rules:
      - type: keyword_match
        keywords: [measures, tracks, assesses, evaluates]
