domain: security_access_control
description: Authentication, authorization, permissions, roles, identity management, and access control
subdomains:
  - authentication
  - authorization
  - identity_management
  - access_control
  - audit_logging

entity_types:
  - entity_type: user
    description: User or identity
    aliases: [identity, account, principal]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [user, identity, account, principal, username]

  - entity_type: role
    description: Security role or group
    aliases: [group, security group, permission group]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [role, group, security group, permission group]

  - entity_type: permission
    description: Permission or privilege
    aliases: [privilege, access right, entitlement]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [permission, privilege, access right, entitlement, grant]

  - entity_type: resource
    description: Protected resource or object
    aliases: [object, asset, protected resource]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [resource, object, asset, protected resource, system]

  - entity_type: authentication_method
    description: Authentication method or mechanism
    aliases: [auth method, authentication mechanism, credential type]
    element_types: [paragraph, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [authentication, auth method, password, MFA, SSO, OAuth, SAML]

  - entity_type: audit_event
    description: Security audit or access event
    aliases: [access event, security event, audit log]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [audit, access event, security event, log entry, access attempt]

relationship_types:
  - relationship_type: has_role
    description: User has role
    source_entity: user
    target_entity: role
    sample_rules:
      - type: keyword_match
        keywords: [has role, member of, assigned to, in group]

  - relationship_type: has_permission
    description: Role has permission
    source_entity: role
    target_entity: permission
    sample_rules:
      - type: keyword_match
        keywords: [has permission, grants, includes, allows]

  - relationship_type: protects
    description: Permission protects resource
    source_entity: permission
    target_entity: resource
    sample_rules:
      - type: keyword_match
        keywords: [protects, controls access to, guards, secures]

  - relationship_type: authenticated_via
    description: User authenticated via method
    source_entity: user
    target_entity: authentication_method
    sample_rules:
      - type: keyword_match
        keywords: [authenticated via, logged in with, uses, auth method]

  - relationship_type: logged_as
    description: Access logged as audit event
    source_entity: user
    target_entity: audit_event
    sample_rules:
      - type: keyword_match
        keywords: [logged, audit, access event, recorded]
