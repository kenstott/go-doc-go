domain: artificial_intelligence
description: ML models, training data, inference, model governance, and AI/ML operations
subdomains:
  - model_development
  - training_data
  - model_deployment
  - model_monitoring
  - ai_governance

entity_types:
  - entity_type: ml_model
    description: Machine learning model
    aliases: [model, AI model, neural network, algorithm]
    element_types: [paragraph, heading, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [model, ML model, neural network, AI model, algorithm, classifier]

  - entity_type: training_dataset
    description: Training dataset or data collection
    aliases: [dataset, training data, data collection]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [training data, dataset, data collection, training set, labeled data]

  - entity_type: model_version
    description: Model version or iteration
    aliases: [version, iteration, checkpoint]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [version, iteration, checkpoint, model version, release]

  - entity_type: inference_request
    description: Model inference or prediction request
    aliases: [prediction, inference, scoring, model call]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [inference, prediction, scoring, model call, endpoint]

  - entity_type: feature
    description: Model feature or input variable
    aliases: [input, variable, feature vector, attribute]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [feature, input, variable, attribute, feature engineering]

  - entity_type: model_metric
    description: Model performance metric
    aliases: [performance metric, accuracy, precision, recall, F1]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [accuracy, precision, recall, F1, AUC, performance metric]

  - entity_type: ai_policy
    description: AI governance policy or guideline
    aliases: [governance policy, AI guideline, ethical policy]
    element_types: [paragraph, heading, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [AI policy, governance, ethical AI, responsible AI, fairness]

relationship_types:
  - relationship_type: trained_on
    description: Model trained on dataset
    source_entity: ml_model
    target_entity: training_dataset
    sample_rules:
      - type: keyword_match
        keywords: [trained on, trained with, using data, dataset]

  - relationship_type: version_of
    description: Version of model
    source_entity: model_version
    target_entity: ml_model
    sample_rules:
      - type: keyword_match
        keywords: [version of, iteration of, checkpoint of]

  - relationship_type: uses_feature
    description: Model uses feature
    source_entity: ml_model
    target_entity: feature
    sample_rules:
      - type: keyword_match
        keywords: [uses, inputs, feature, variable]

  - relationship_type: evaluated_with
    description: Model evaluated with metric
    source_entity: ml_model
    target_entity: model_metric
    sample_rules:
      - type: keyword_match
        keywords: [evaluated, measured, metric, performance]

  - relationship_type: governed_by
    description: Model governed by policy
    source_entity: ml_model
    target_entity: ai_policy
    sample_rules:
      - type: keyword_match
        keywords: [governed by, complies with, follows, adheres to]

  - relationship_type: inference_from
    description: Inference from model
    source_entity: inference_request
    target_entity: ml_model
    sample_rules:
      - type: keyword_match
        keywords: [from, using, model, prediction from]
