domain: quality_assurance
description: Testing, defects, quality metrics, test automation, and quality standards
subdomains:
  - test_management
  - defect_tracking
  - test_automation
  - quality_metrics
  - compliance_testing

entity_types:
  - entity_type: test_case
    description: Test case or test scenario
    aliases: [test, test scenario, test script]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [test case, test, test scenario, test script, test step]

  - entity_type: test_suite
    description: Test suite or test collection
    aliases: [test collection, test set, test group]
    element_types: [paragraph, heading, list_item]
    sample_rules:
      - type: keyword_match
        keywords: [test suite, test collection, test set, regression suite]

  - entity_type: defect
    description: Bug or defect
    aliases: [bug, issue, problem, fault]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [defect, bug, issue, problem, fault, error]

  - entity_type: test_execution
    description: Test execution or test run
    aliases: [test run, test session, test execution]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [test execution, test run, test session, execution, passed, failed]

  - entity_type: requirement
    description: Requirement or specification
    aliases: [specification, requirement, user story, acceptance criteria]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [requirement, specification, user story, acceptance criteria]

  - entity_type: quality_metric
    description: Quality metric or KPI
    aliases: [KPI, metric, quality indicator, measure]
    element_types: [paragraph, list_item, table_row]
    sample_rules:
      - type: keyword_match
        keywords: [metric, KPI, quality metric, coverage, defect density]

relationship_types:
  - relationship_type: part_of_suite
    description: Test case part of suite
    source_entity: test_case
    target_entity: test_suite
    sample_rules:
      - type: keyword_match
        keywords: [part of, in, belongs to, suite]

  - relationship_type: tests_requirement
    description: Test case tests requirement
    source_entity: test_case
    target_entity: requirement
    sample_rules:
      - type: keyword_match
        keywords: [tests, verifies, validates, covers]

  - relationship_type: found_defect
    description: Test execution found defect
    source_entity: test_execution
    target_entity: defect
    sample_rules:
      - type: keyword_match
        keywords: [found, detected, discovered, identified]

  - relationship_type: executed_test
    description: Execution ran test case
    source_entity: test_execution
    target_entity: test_case
    sample_rules:
      - type: keyword_match
        keywords: [executed, ran, performed, test]

  - relationship_type: measures
    description: Metric measures quality aspect
    source_entity: quality_metric
    target_entity: test_suite
    sample_rules:
      - type: keyword_match
        keywords: [measures, tracks, monitors, assesses]
