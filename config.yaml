  - name: "wikipedia"
    type: "web"
    base_url: "https://en.wikipedia.org"
    url_list:
      - "https://en.wikipedia.org/wiki/Document_management_system"
    include_patterns:
      - "^https://en.wikipedia.org/wiki/"
    exclude_patterns:
      - "/Special:"
      - "/Talk:"
      - "/Category:"
      - "/File:"
    headers:
      User-Agent: "Go-Doc-Go/1.0 (educational project; ken@kenstott.com)"
    max_link_depth: 1
    refresh_interval: 604800  # 7 days in seconds

relationship_detection:
  enabled: true
  structural: true
  semantic: false
  cross_document_semantic:
    similarity_threshold: 0.70

# Processing configuration
processing:
  batch_size: 100
  max_workers: 4
  timeout_seconds: 300
  # Job control database for worker coordination
  job_control:
    backend: "sqlite"
    path: "./job_queue.db"
    claim_timeout: 300
    heartbeat_interval: 30
    max_retries: 3

# Analytics outputs configuration
analytics:
  enabled: true
  outputs:
    - type: "parquet"
      path: "./analytics-output"
      partitioning: ["date", "source"]
    - type: "sqlite"
      path: "./analytics.db"
      tables: ["documents", "elements", "relationships", "embeddings", "metrics"]

logging:
  level: "INFO"
  file: "./logs/go-doc-go.log"
