embedding:
  enabled: true
  provider: fastembed
  model: "sentence-transformers/all-MiniLM-L6-v2"
  dimensions: 384
  chunk_size: 512
  overlap: 128
  contextual: true
  predecessor_count: 1
  successor_count: 1

