# Configuration for ontology extraction
analytics:
  enabled: true
  outputs:
    - type: "parquet"
      path: "/Volumes/T9/sec_analytics"
      partitioning: ["date", "source"]

# Processing configuration
processing:
  batch_size: 100
  max_workers: 4
  timeout_seconds: 300

logging:
  level: "INFO"
  file: "./logs/ontology-extract.log"