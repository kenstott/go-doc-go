domain:
  name: corporate_regulatory_filings
  version: 1.0.0
  description: Discovered ontology for corporate_regulatory_filings domain
  settings:
    default_confidence_threshold: 0.7
    max_relationships_per_pair: 5
    enable_transitive_inference: true
terms:
- id: company_name
  label: Company Name
  description: Name of a corporation or business entity
  aliases:
  - corporation
  - company
  - business
  - issuer
  - registrant
- id: stock_symbol
  label: Stock Symbol
  description: Trading symbol for publicly traded securities
  aliases:
  - symbol
  - ticker
  - trading symbol
  - stock ticker
- id: revenue
  label: Revenue
  description: Total income from business operations
  aliases:
  - sales
  - total revenue
  - gross revenue
  - turnover
- id: executive_officer
  label: Executive Officer
  description: Senior management personnel of a company
  aliases:
  - officer
  - executive
  - CEO
  - CFO
  - president
- id: regulatory_filing
  label: Regulatory Filing
  description: Official document submitted to regulatory authorities
  aliases: &id001
  - form
  - report
  - filing
  - submission
- id: form_type
  label: Form Type
  description: 'Domain-specific term: form type'
  aliases: &id002
  - form type
  - Form Type
element_mappings:
- term_id: company_name
  rules:
  - type: regex
    pattern: \b(MICROSOFT CORP|Apple Inc\.|[A-Z][a-z]+\s+(Corp|Inc|LLC))\b
    case_sensitive: false
    confidence: 0.85
  - type: regex
    pattern: <issuerName>\s*(.+)
    element_types:
    - xml_element
    confidence: 0.95
- term_id: stock_symbol
  rules:
  - type: regex
    pattern: \b[A-Z]{1,5}\b
    case_sensitive: true
    confidence: 0.75
  - type: regex
    pattern: <issuerTradingSymbol>\s*([A-Z]+)
    element_types:
    - xml_element
    confidence: 0.95
- term_id: revenue
  rules:
  - type: regex
    pattern: \b(Revenue|Total revenue|Net revenue|Sales)\b
    case_sensitive: false
    confidence: 0.85
  - type: semantic
    semantic_phrase: revenue, sales, income from operations
    confidence: 0.8
- term_id: executive_officer
  rules:
  - type: regex
    pattern: \b(Chief\s+\w+\s+Officer|President|CEO|CFO|CTO)\b
    case_sensitive: false
    confidence: 0.9
- term_id: regulatory_filing
  rules:
  - type: keywords
    keywords: *id001
    confidence: 0.7
- term_id: form_type
  rules:
  - type: keywords
    keywords: *id002
    confidence: 0.7
relationship_rules:
- id: company_has_symbol
  description: Company has a trading symbol
  relationship_type: HAS_SYMBOL
  source:
    term_id: company_name
    semantic_phrase: company, corporation
    confidence_threshold: 0.8
  target:
    term_id: stock_symbol
    semantic_phrase: symbol, ticker
    confidence_threshold: 0.8
  constraints:
    hierarchy_level: -1
    direction: any
  confidence:
    minimum: 0.75
    calculation: average
- id: company_reports_revenue
  description: Company reports financial metrics
  relationship_type: REPORTS
  source:
    term_id: company_name
    semantic_phrase: company
    confidence_threshold: 0.8
  target:
    term_id: revenue
    semantic_phrase: revenue, financial metric
    confidence_threshold: 0.85
  constraints:
    hierarchy_level: -1
    direction: any
  confidence:
    minimum: 0.7
    calculation: average
