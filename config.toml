[relationship_detection]
enabled = true
structural = true
semantic = false

[relationship_detection.cross_document_semantic]
enabled = true
similarity_threshold = 0.70
queue_idle_trigger_minutes = 0  # 0 minutes for immediate testing (30 seconds via code)
rate_limit_batch_size = 1000
rate_limit_sleep_ms = 100
min_interval_minutes = 1  # 1 minute minimum interval for testing

# UDML-O: Ontology-based entity and relationship extraction
[ontology]
enabled = true
schema_path = "./schemas"  # Directory containing ontology schema YAML/JSON files
diversity_threshold = 0.0001  # Cosine similarity threshold for diversity filtering (0.0-1.0, lower = more diverse). Default: 0.0001
queue_idle_trigger_minutes = 0  # Run after queue idle (0 = 30 seconds via code)

# Processing configuration
[processing]
batch_size = 100
workers = 4
timeout_seconds = 300

[processing.job_control]
backend = "sqlite"
path = "./job_queue.db"
claim_timeout = 300
heartbeat_interval = 30
max_retries = 3

# Analytics outputs configuration
[analytics]
enabled = true

[[analytics.outputs]]
type = "parquet"
path = "./analytics-output"

[logging]
level = "INFO"
file = "./logs/go-doc-go.log"
