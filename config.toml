# Go-Doc-Go Configuration (TOML format)

[embedding]
enabled = true
provider = "onnx"
model = "sentence-transformers/all-MiniLM-L6-v2"
dimensions = 384
chunk_size = 512
overlap = 128
contextual = true
predecessor_count = 1
successor_count = 1

# Content Sources Configuration
[[content_sources]]
name = "wikipedia"
type = "web"
base_url = "https://en.wikipedia.org"
url_list = [
    "https://en.wikipedia.org/wiki/Banking",
    "https://en.wikipedia.org/wiki/Insurance",
    "https://en.wikipedia.org/wiki/Medicine",
    "https://en.wikipedia.org/wiki/Cardiology",
    "https://en.wikipedia.org/wiki/Surgery",
    "https://en.wikipedia.org/wiki/Neurology"
]
include_patterns = [
    "^https://en.wikipedia.org/wiki/"
]
exclude_patterns = [
    "/Special:",
    "/Talk:",
    "/Category:",
    "/File:"
]
max_link_depth = 1
refresh_interval = 604800  # 7 days in seconds

[content_sources.headers]
User-Agent = "Go-Doc-Go/1.0 (educational project; ken@kenstott.com)"

