# SEC HTML Document Store Configuration with Neo4j Export
# Based on sec-html-store.yaml with added Neo4j export capabilities

embedding:
  enabled: true
  provider: fastembed
  model: "BAAI/bge-small-en-v1.5"
  dimensions: 384
  chunk_size: 512
  overlap: 128
  contextual: true
  predecessor_count: 2
  successor_count: 2

content_sources:
  - name: "sec-html-filings"
    type: "file"
    base_path: "/Volumes/T9/govdata-cache/sec/sec-data"
    file_pattern: "**/*.htm"
    include_extensions: ["htm", "html"]
    exclude_extensions: ["xml", "txt", "pdf"]
    watch_for_changes: false
    max_link_depth: 1

    # Metadata extraction from path
    path_metadata:
      cik: "/(\\d{10})/"
      accession_number: "/(\\d{18})/"
      filename: "/([^/]+\\.htm)$"

  - name: "sec-xml-filings"
    type: "file"
    base_path: "/Volumes/T9/govdata-cache/sec/sec-data"
    file_pattern: "**/*.xml"
    include_extensions: ["xml"]
    exclude_extensions: ["htm", "html", "txt", "pdf"]
    watch_for_changes: false
    max_link_depth: 1

    # Metadata extraction from path
    path_metadata:
      cik: "/(\\d{10})/"
      accession_number: "/(\\d{18})/"
      filename: "/([^/]+\\.xml)$"

relationship_detection:
  enabled: true
  structural: true
  semantic: true
  cross_document_semantic:
    similarity_threshold: 0.75
    max_cross_doc_relationships: 100

processing:
  batch_size: 50
  max_workers: 6
  timeout_seconds: 600
  job_control:
    backend: "sqlite"
    path: "/Volumes/T9/sec_html_store_job_queue.db"
    claim_timeout: 300
    heartbeat_interval: 30
    max_retries: 2

  # Neo4j export configuration
  neo4j_export:
    enabled: true
    connection:
      uri: "bolt://localhost:7687"
      username: "neo4j"
      password: "password"
      database: "neo4j"

analytics:
  enabled: true
  outputs:
    - type: "parquet"
      path: "/Volumes/T9/sec_analytics"
      partitioning: ["date", "source", "cik"]
      compression: "snappy"
      row_group_size: 10000

domain_ontologies:
  - name: "sec_xbrl_reporting"
    path: "./examples/ontologies/sec_xbrl.yaml"
    enabled: true
    extraction_config:
      confidence_threshold: 0.65
      max_entities_per_document: 1000
      enable_cross_document_links: true

logging:
  level: "INFO"
  file: "/Volumes/T9/logs/sec_processing.log"