domain:
  name: corporate_regulatory_filings
  version: 1.0.0
  description: LLM-generated ontology for corporate_regulatory_filings
  settings:
    default_confidence_threshold: 0.7
    max_relationships_per_pair: 5
    enable_transitive_inference: true
terms:
- id: company
  label: Company
  description: The business organization that is the subject of the regulatory filing.
  aliases: []
- id: ticker
  label: Ticker Symbol
  description: The unique stock symbol or abbreviation used to identify the company's
    publicly traded securities.
  aliases: []
- id: revenue
  label: Revenue
  description: The total amount of income generated by the company from its business
    activities.
  aliases: []
- id: executive
  label: Executive
  description: A senior manager or officer of the company who is responsible for making
    decisions and overseeing operations.
  aliases:
  - officer
- id: filing_date
  label: Filing Date
  description: The date on which the regulatory filing was submitted.
  aliases:
  - submission_date
- id: form_type
  label: Form Type
  description: The specific type of regulatory filing document, such as a 10-K, 8-K,
    or 4.
  aliases:
  - document_type
element_mappings:
- term_id: company
  rules:
  - type: regex
    pattern: ([A-Z][a-z]+\s[A-Z][a-z]+\sCompany)
    confidence: 0.9
    element_types:
    - paragraph
    - table_row
  - type: keywords
    keywords:
    - company
    - organization
    - business
    confidence: 0.8
    element_types:
    - paragraph
    - table_row
- term_id: ticker
  rules: []
- term_id: revenue
  rules:
  - type: regex
    pattern: ([0-9]+%?\s?revenue)
    confidence: 0.85
    element_types:
    - table_cell
  - type: keywords
    keywords:
    - revenue
    - income
    - sales
    confidence: 0.8
    element_types:
    - table_cell
- term_id: executive
  rules:
  - type: regex
    pattern: ([A-Z][a-z]+\s[A-Z][a-z]+,\s[0-9]+,\shas\sbeen\sApple\u2019s\sChief\sExecutive\sOfficer)
    confidence: 0.9
    element_types:
    - table_row
  - type: keywords
    keywords:
    - executive
    - officer
    - manager
    - senior
    confidence: 0.8
    element_types:
    - paragraph
    - table_row
- term_id: filing_date
  rules:
  - type: regex
    pattern: ([0-9]{2}/[0-9]{2}/[0-9]{4})
    confidence: 0.85
    element_types:
    - div
    - table_row
    - table_cell
  - type: keywords
    keywords:
    - filing
    - submission
    - date
    confidence: 0.8
    element_types:
    - div
    - table_row
    - table_cell
- term_id: form_type
  rules:
  - type: regex
    pattern: ([0-9]+-[A-Z])
    confidence: 0.9
    element_types:
    - table_row
    - table_cell
  - type: keywords
    keywords:
    - form
    - document
    - type
    confidence: 0.8
    element_types:
    - table_row
    - table_cell
relationship_rules:
- id: company_has_ticker
  description: A company has a ticker symbol
  relationship_type: HAS_SYMBOL
  source:
    term_id: company
    semantic_phrase: company
    confidence_threshold: 0.8
  target:
    term_id: ticker
    semantic_phrase: ticker symbol
    confidence_threshold: 0.8
  constraints:
    hierarchy_level: -1
    direction: any
  confidence:
    minimum: 0.8
    calculation: average
- id: company_reports_revenue
  description: A company reports its revenue
  relationship_type: REPORTS
  source:
    term_id: company
    semantic_phrase: company
    confidence_threshold: 0.8
  target:
    term_id: revenue
    semantic_phrase: revenue
    confidence_threshold: 0.8
  constraints:
    hierarchy_level: -1
    direction: any
  confidence:
    minimum: 0.8
    calculation: average
- id: executive_works_for_company
  description: An executive works for a company
  relationship_type: WORKS_FOR
  source:
    term_id: executive
    semantic_phrase: executive
    confidence_threshold: 0.8
  target:
    term_id: company
    semantic_phrase: company
    confidence_threshold: 0.8
  constraints:
    hierarchy_level: -1
    direction: any
  confidence:
    minimum: 0.8
    calculation: average
- id: filing_has_date
  description: A regulatory filing has a filing date
  relationship_type: HAS_DATE
  source:
    term_id: form_type
    semantic_phrase: regulatory filing
    confidence_threshold: 0.8
  target:
    term_id: filing_date
    semantic_phrase: filing date
    confidence_threshold: 0.8
  constraints:
    hierarchy_level: -1
    direction: any
  confidence:
    minimum: 0.8
    calculation: average
