name: test_companies
domain: business
version: "1.0"
description: Test schema for extracting company and location entities

element_entity_mappings:
  - domain: "business"
    entity_type: "Organization"
    element_types: ["paragraph"]
    confidence: 0.9
    extraction_rules:
      - type: "regex_pattern"
        pattern: '\b([A-Z][a-z]+(?:\s+[A-Z][a-z]+)*\s+(?:Inc|LLC|Corp|Corporation|Ltd|Limited))\b'
      - type: "regex_pattern"
        pattern: '\b(IBM|MSFT|GOOG)\b'

  - domain: "business"
    entity_type: "Location"
    element_types: ["paragraph"]
    confidence: 0.7
    extraction_rules:
      - type: "regex_pattern"
        pattern: '\b([A-Z][a-z]+(?:,\s*[A-Z]{2})?)\b'

entity_relationship_rules:
  - source_type: "Organization"
    target_type: "Location"
    relationship_type: "located_in"
    patterns:
      - type: "proximity"
        max_distance: 3
        confidence: 0.7
      - type: "content_pattern"
        regex: "{source}.*(?:in|at|located in).*{target}"
        confidence: 0.9
