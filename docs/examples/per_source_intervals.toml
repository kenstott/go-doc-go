# Example configuration demonstrating per-source discovery intervals
# Each content source can have its own discovery_interval or refresh_interval

[embedding]
enabled = true
provider = "fastembed"
model = "sentence-transformers/all-MiniLM-L6-v2"
dimensions = 384

# File source - check frequently for active development
[[content_sources]]
name = "project-docs"
type = "file"
base_path = "./docs"
file_pattern = "**/*.{md,docx,pdf}"
watch_for_changes = true
discovery_interval = 3600  # Check every hour (1 hour = 3600 seconds)

# Web source - less frequent updates expected
[[content_sources]]
name = "company-website"
type = "web"
base_url = "https://example.com"
url_list = ["https://example.com/documentation"]
discovery_interval = 604800  # Check weekly (7 days = 604800 seconds)

# Confluence - moderate update frequency
[[content_sources]]
name = "team-confluence"
type = "confluence"
base_url = "https://your-instance.atlassian.net"
username = "user@example.com"
api_token = "your-api-token"
spaces = ["TEAM", "DOCS"]
discovery_interval = 21600  # Check every 6 hours (21600 seconds)

# S3 bucket - frequent updates from automated systems
[[content_sources]]
name = "data-lake"
type = "s3"
bucket_name = "my-data-bucket"
prefix = "documents/"
discovery_interval = 300  # Check every 5 minutes for new uploads

# JIRA - check frequently during business hours
[[content_sources]]
name = "project-jira"
type = "jira"
base_url = "https://your-instance.atlassian.net"
username = "user@example.com"
api_token = "your-api-token"
projects = ["PROJ"]
discovery_interval = 7200  # Check every 2 hours (7200 seconds)

# Database - infrequent updates to reference data
[[content_sources]]
name = "reference-db"
type = "database"
connection_string = "postgresql://user:pass@host/db"
discovery_interval = 86400  # Check daily (1 day = 86400 seconds)

[[content_sources.queries]]
name = "policies"
query = "SELECT * FROM policies WHERE status = 'active'"

[processing.job_control]
backend = "sqlite"
path = "./job_queue.db"

[analytics]
enabled = true

[[analytics.outputs]]
type = "parquet"
path = "./analytics-output"

# Global default discovery interval (used if source doesn't specify one)
# Can be overridden with --discovery-interval CLI option
# Default: 86400 seconds (1 day)
