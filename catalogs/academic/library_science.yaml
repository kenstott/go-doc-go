domain: library_science
description: 'Library operations including cataloging workflows, circulation systems, collection development policies, archival
  procedures, and reference services. NOTE: Mere presence of bibliographic identifiers (ISBN, DOI, PMID) or citation formats
  does NOT indicate library science content - this domain requires discussion of library processes, operations, or professional
  practices.'
subdomains:
- cataloging
- circulation
- collection_management
- archives
- reference_services
entity_types:
- entity_type: library_item
  description: Library item or material
  aliases:
  - book
  - resource
  - material
  - holding
  element_types:
  - paragraph
  - list_item
  - table_row
  extraction_rules:
  - name: library_item_keyword_match_1
    description: Matches 7 keywords including book, item, resource, etc.
    keywords:
    - book
    - item
    - resource
    - material
    - holding
    - ISBN
    - call number
  parent_type: ''
  w_category: what
  domain: library_science
- entity_type: patron
  description: Library patron or user
  aliases:
  - user
  - member
  - borrower
  - cardholder
  element_types:
  - paragraph
  - list_item
  - table_row
  extraction_rules:
  - name: patron_keyword_match_1
    description: Matches 6 keywords including patron, user, member, etc.
    keywords:
    - patron
    - user
    - member
    - borrower
    - cardholder
    - library card
  parent_type: ''
  w_category: what
  domain: library_science
- entity_type: circulation_transaction
  description: Checkout or circulation transaction
  aliases:
  - checkout
  - loan
  - borrowing
  - return
  element_types:
  - paragraph
  - list_item
  - table_row
  extraction_rules:
  - name: circulation_transaction_keyword_match_1
    description: Matches 6 keywords including checkout, loan, borrowed, etc.
    keywords:
    - checkout
    - loan
    - borrowed
    - returned
    - due date
    - circulation
  parent_type: ''
  w_category: what
  domain: library_science
- entity_type: collection
  description: Library collection or section
  aliases:
  - section
  - department
  - special collection
  element_types:
  - paragraph
  - heading
  - list_item
  extraction_rules:
  - name: collection_keyword_match_1
    description: 'Matches keywords: collection, section, department, special collection, archive'
    keywords:
    - collection
    - section
    - department
    - special collection
    - archive
  parent_type: ''
  w_category: what
  domain: library_science
- entity_type: catalog_record
  description: Bibliographic catalog record
  aliases:
  - record
  - bibliographic record
  - metadata record
  element_types:
  - paragraph
  - list_item
  - table_row
  extraction_rules:
  - name: catalog_record_keyword_match_1
    description: 'Matches keywords: catalog record, bibliographic record, MARC record, metadata'
    keywords:
    - catalog record
    - bibliographic record
    - MARC record
    - metadata
  parent_type: ''
  w_category: what
  domain: library_science
- entity_type: archive
  description: Archival collection or materials
  aliases:
  - archival collection
  - manuscript collection
  - special materials
  element_types:
  - paragraph
  - heading
  - list_item
  extraction_rules:
  - name: archive_keyword_match_1
    description: 'Matches keywords: archive, archival, manuscript, special materials, rare books'
    keywords:
    - archive
    - archival
    - manuscript
    - special materials
    - rare books
  parent_type: ''
  w_category: what
  domain: library_science
relationship_types:
- relationship_type: checked_out_by
  description: Item checked out by patron
  extraction_rules:
  - name: checked_out_by_keyword_match_1
    description: 'Matches keywords: checked out by, borrowed by, on loan to'
    keywords:
    - checked out by
    - borrowed by
    - on loan to
  source_type: library_item
  target_type: patron
- relationship_type: in_transaction
  description: Item in circulation transaction
  extraction_rules:
  - name: in_transaction_keyword_match_1
    description: 'Matches keywords: checkout, loan, circulation, transaction'
    keywords:
    - checkout
    - loan
    - circulation
    - transaction
  source_type: library_item
  target_type: circulation_transaction
- relationship_type: part_of_collection
  description: Item part of collection
  extraction_rules:
  - name: part_of_collection_keyword_match_1
    description: 'Matches keywords: part of, in, belongs to, collection'
    keywords:
    - part of
    - in
    - belongs to
    - collection
  source_type: library_item
  target_type: collection
- relationship_type: cataloged_as
  description: Item cataloged as record
  extraction_rules:
  - name: cataloged_as_keyword_match_1
    description: 'Matches keywords: cataloged as, catalog record, bibliographic record'
    keywords:
    - cataloged as
    - catalog record
    - bibliographic record
  source_type: library_item
  target_type: catalog_record
- relationship_type: archived_in
  description: Materials archived in archive
  extraction_rules:
  - name: archived_in_keyword_match_1
    description: 'Matches keywords: archived in, part of archive, in collection'
    keywords:
    - archived in
    - part of archive
    - in collection
  source_type: library_item
  target_type: archive
