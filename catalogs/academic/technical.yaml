domain: technical
description: 'Technical documentation about software systems, API specifications, architecture documents, and IT infrastructure.
  NOTE: Mere presence of code files or technical syntax does NOT indicate "technical" domain - classify code by its business
  function (e.g., payment processing code → "financial" domain, not "technical"). This domain is for documentation ABOUT technical
  infrastructure, not code implementing business logic.'
subdomains:
- software_development
- api_documentation
- system_architecture
- networking
- database
- cloud_infrastructure
terms:
- name: API
  synonyms:
  - application programming interface
  - web service
  - endpoint
  - service
  description: Application programming interface
- name: endpoint
  synonyms:
  - route
  - path
  - resource
  - URI
  description: API endpoint or URL path
- name: parameter
  synonyms:
  - argument
  - input
  - variable
  - field
  description: Input parameter or variable
- name: response
  synonyms:
  - output
  - result
  - return value
  - payload
  description: API response or output
- name: authentication
  synonyms:
  - auth
  - authorization
  - credentials
  - access control
  description: Authentication and authorization mechanism
- name: schema
  synonyms:
  - structure
  - model
  - definition
  - specification
  description: Data schema or structure definition
- name: dependency
  synonyms:
  - requirement
  - prerequisite
  - library
  - package
  description: Software dependency or required component
- name: configuration
  synonyms:
  - config
  - settings
  - options
  - parameters
  description: System or application configuration
- name: deployment
  synonyms:
  - release
  - rollout
  - installation
  - provisioning
  description: Software deployment or release
- name: protocol
  synonyms:
  - standard
  - specification
  - format
  description: Communication protocol or standard
entity_types:
- entity_type: software_component
  description: Software component, module, or service
  aliases:
  - component
  - module
  - service
  - microservice
  - library
  element_types:
  - paragraph
  - heading
  - code
  extraction_rules:
  - name: software_component_keyword_match_1
    description: 'Matches keywords: service, module, component, library, package'
    keywords:
    - service
    - module
    - component
    - library
    - package
  parent_type: ''
  w_category: what
  domain: technical
- entity_type: api_endpoint
  description: API endpoint or resource path
  aliases:
  - endpoint
  - route
  - path
  - resource
  - URL
  element_types:
  - paragraph
  - code
  - list_item
  extraction_rules:
  - name: api_endpoint_pattern_match_1
    description: Matches text using regex pattern
    pattern: \b(?:GET|POST|PUT|DELETE|PATCH)\s+/[a-zA-Z0-9/_\-{}]+
  - name: api_endpoint_pattern_match_2
    description: Matches text using regex pattern
    pattern: /api/v\d+/[a-zA-Z0-9/_\-]+
  parent_type: ''
  w_category: what
  domain: technical
- entity_type: http_method
  description: HTTP request method
  aliases:
  - method
  - verb
  - request type
  element_types:
  - paragraph
  - code
  - table_cell
  extraction_rules:
  - name: http_method_keyword_match_1
    description: Matches 7 keywords including GET, POST, PUT, etc.
    keywords:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
    - HEAD
    - OPTIONS
  parent_type: ''
  w_category: what
  domain: technical
