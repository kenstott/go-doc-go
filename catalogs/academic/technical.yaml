relationships:
- name: component_implements_api
  source_type: software_component
  target_type: api_endpoint
  relationship_type: implements
  description: Component implements API endpoint
  sample_patterns:
  - '{component} implements {endpoint}'
  - '{endpoint} provided by {component}'
- name: endpoint_accepts_parameter
  source_type: api_endpoint
  target_type: parameter
  relationship_type: related_to
  description: Endpoint accepts parameter
  sample_patterns:
  - '{endpoint} accepts {parameter}'
  - '{parameter} for {endpoint}'
- name: component_depends_on_component
  source_type: software_component
  target_type: software_component
  relationship_type: depends_on
  description: Component depends on another component
  sample_patterns:
  - '{component} depends on {component}'
  - '{component} requires {component}'
- name: component_uses_database
  source_type: software_component
  target_type: database
  relationship_type: depends_on
  description: Component uses database
  sample_patterns:
  - '{component} uses {database}'
  - '{component} connects to {database}'
- name: endpoint_returns_status_code
  source_type: api_endpoint
  target_type: status_code
  relationship_type: related_to
  description: Endpoint returns status code
  sample_patterns:
  - '{endpoint} returns {status_code}'
  - '{status_code} from {endpoint}'
- name: component_uses_framework
  source_type: software_component
  target_type: framework
  relationship_type: depends_on
  description: Component uses framework
  sample_patterns:
  - '{component} built with {framework}'
  - '{component} uses {framework}'
- name: component_written_in_language
  source_type: software_component
  target_type: programming_language
  relationship_type: related_to
  description: Component written in programming language
  sample_patterns:
  - '{component} written in {language}'
  - '{component} ({language})'
- name: endpoint_uses_authentication
  source_type: api_endpoint
  target_type: authentication_method
  relationship_type: depends_on
  description: Endpoint requires authentication
  sample_patterns:
  - '{endpoint} requires {auth}'
  - '{auth} for {endpoint}'
- name: component_deployed_on_infrastructure
  source_type: software_component
  target_type: infrastructure_component
  relationship_type: related_to
  description: Component deployed on infrastructure
  sample_patterns:
  - '{component} deployed on {infrastructure}'
  - '{component} runs on {infrastructure}'
- name: component_communicates_via_protocol
  source_type: software_component
  target_type: protocol
  relationship_type: related_to
  description: Component uses communication protocol
  sample_patterns:
  - '{component} uses {protocol}'
  - '{protocol} for {component}'
