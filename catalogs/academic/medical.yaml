domain: medical
description: Medical records, clinical notes, prescriptions, lab reports, patient documents, and healthcare documentation
subdomains:
- clinical_care
- diagnostics
- pharmaceuticals
- surgery
- radiology
- pathology
terms:
- name: diagnosis
  synonyms:
  - condition
  - disease
  - disorder
  - ailment
  - illness
  description: Medical condition identified in a patient
- name: symptom
  synonyms:
  - sign
  - manifestation
  - presentation
  - complaint
  description: Observable indication of disease or condition
- name: treatment
  synonyms:
  - therapy
  - intervention
  - procedure
  - care
  - management
  description: Medical intervention for a condition
- name: medication
  synonyms:
  - drug
  - pharmaceutical
  - medicine
  - prescription
  - rx
  description: Substance used to treat or prevent disease
- name: dosage
  synonyms:
  - dose
  - strength
  - amount
  - quantity
  description: Amount of medication to be administered
- name: vital signs
  synonyms:
  - vitals
  - clinical parameters
  - physiological measurements
  description: Measurements of body's basic functions
- name: prognosis
  synonyms:
  - outlook
  - forecast
  - expected outcome
  - recovery expectation
  description: Expected course and outcome of disease
- name: contraindication
  synonyms:
  - warning
  - precaution
  - restriction
  description: Condition that makes treatment inadvisable
- name: adverse reaction
  synonyms:
  - side effect
  - adverse event
  - complication
  - reaction
  description: Unintended harmful reaction to treatment
- name: comorbidity
  synonyms:
  - concurrent condition
  - coexisting disease
  - additional diagnosis
  description: Simultaneous presence of multiple conditions
entity_types:
- entity_type: patient
  description: Person receiving medical care
  aliases:
  - individual
  - subject
  - case
  element_types:
  - paragraph
  - heading
  - table_cell
  extraction_rules:
  - name: patient_keyword_match_1
    description: 'Matches keywords: patient, subject, individual'
    keywords:
    - patient
    - subject
    - individual
  parent_type: ''
  w_category: what
  domain: medical
- entity_type: condition
  description: Disease, disorder, or medical condition
  aliases:
  - diagnosis
  - disease
  - disorder
  - illness
  - ailment
  element_types:
  - paragraph
  - list_item
  - table_cell
  extraction_rules:
  - name: condition_keyword_match_1
    description: Matches 9 keywords including diabetes, hypertension, cancer, etc.
    keywords:
    - diabetes
    - hypertension
    - cancer
    - infection
    - pneumonia
    - asthma
    - arthritis
    - heart disease
    - stroke
  parent_type: ''
  w_category: what
  domain: medical
- entity_type: medication
  description: Drug or pharmaceutical product
  aliases:
  - drug
  - medicine
  - pharmaceutical
  - prescription
  - therapy
  element_types:
  - paragraph
  - list_item
  - table_cell
  extraction_rules:
  - name: medication_pattern_match_1
    description: Matches text using regex pattern
    pattern: \b[A-Z][a-z]+(?:in|ol|azole|mycin|cillin|oxacin)\b
  - name: medication_keyword_match_2
    description: 'Matches keywords: mg, mcg, tablet, capsule, injection'
    keywords:
    - mg
    - mcg
    - tablet
    - capsule
    - injection
  parent_type: ''
  w_category: what
  domain: medical
- entity_type: dosage
  description: Medication dose and frequency
  aliases:
  - dose
  - strength
  - administration
  element_types:
  - paragraph
  - table_cell
  extraction_rules:
  - name: dosage_pattern_match_1
    description: Matches text using regex pattern
    pattern: \b\d+(?:\.\d+)?\s*(?:mg|mcg|g|mL|units)
  - name: dosage_keyword_match_2
    description: Matches 6 keywords including daily, twice daily, BID, etc.
    keywords:
    - daily
    - twice daily
    - BID
    - TID
    - QID
    - PRN
  parent_type: ''
  w_category: what
  domain: medical
- entity_type: procedure
  description: Medical procedure or surgery
  aliases:
  - surgery
  - operation
  - intervention
  - treatment
  element_types:
  - paragraph
  - heading
  - list_item
  extraction_rules:
  - name: procedure_keyword_match_1
    description: Matches 7 keywords including surgery, biopsy, catheterization, etc.
    keywords:
    - surgery
    - biopsy
    - catheterization
    - endoscopy
    - resection
    - transplant
    - implantation
  parent_type: global.process
  w_category: how
  domain: medical
- entity_type: lab_test
  description: Laboratory test or diagnostic exam
  aliases:
  - test
  - lab
  - study
  - examination
  - diagnostic
  element_types:
  - paragraph
  - table_cell
  - list_item
  extraction_rules:
  - name: lab_test_keyword_match_1
    description: Matches 10 keywords including CBC, blood test, urinalysis, etc.
    keywords:
    - CBC
    - blood test
    - urinalysis
    - X-ray
    - MRI
    - CT scan
    - ultrasound
    - EKG
    - ECG
    - biopsy
  parent_type: ''
  w_category: what
  domain: medical
- entity_type: lab_result
  description: Laboratory test result value
  aliases:
  - finding
  - measurement
  - value
  - level
  element_types:
  - table_cell
  - paragraph
  extraction_rules:
  - name: lab_result_pattern_match_1
    description: Matches text using regex pattern
    pattern: \b\d+(?:\.\d+)?\s*(?:mg/dL|mmol/L|%|units/L|mEq/L)
  parent_type: ''
  w_category: what
  domain: medical
- entity_type: symptom
  description: Clinical symptom or sign
  aliases:
  - sign
  - complaint
  - presentation
  - manifestation
  element_types:
  - paragraph
  - list_item
  extraction_rules:
  - name: symptom_keyword_match_1
    description: Matches 9 keywords including pain, fever, cough, etc.
    keywords:
    - pain
    - fever
    - cough
    - fatigue
    - nausea
    - vomiting
    - dizziness
    - weakness
    - shortness of breath
  parent_type: ''
  w_category: what
  domain: medical
- entity_type: body_part
  description: Anatomical structure or body part
  aliases:
  - anatomy
  - organ
  - structure
  - region
  element_types:
  - paragraph
  - table_cell
  extraction_rules:
  - name: body_part_keyword_match_1
    description: Matches 11 keywords including heart, lung, liver, etc.
    keywords:
    - heart
    - lung
    - liver
    - kidney
    - brain
    - stomach
    - chest
    - abdomen
    - head
    - neck
    - extremity
  parent_type: ''
  w_category: what
  domain: medical
- entity_type: healthcare_provider
  description: Medical professional or healthcare facility
  aliases:
  - physician
  - doctor
  - provider
  - hospital
  - clinic
  element_types:
  - paragraph
  - heading
  extraction_rules:
  - name: healthcare_provider_keyword_match_1
    description: Matches 8 keywords including Dr., MD, physician, etc.
    keywords:
    - Dr.
    - MD
    - physician
    - doctor
    - nurse
    - hospital
    - clinic
    - medical center
  parent_type: ''
  w_category: what
  domain: medical
- entity_type: medical_specialty
  description: Medical specialty or department
  aliases:
  - specialty
  - department
  - service
  - field
  element_types:
  - paragraph
  - heading
  extraction_rules:
  - name: medical_specialty_keyword_match_1
    description: Matches 8 keywords including cardiology, oncology, neurology, etc.
    keywords:
    - cardiology
    - oncology
    - neurology
    - orthopedics
    - pediatrics
    - radiology
    - surgery
    - internal medicine
  parent_type: ''
  w_category: what
  domain: medical
- entity_type: allergy
  description: Patient allergy or adverse reaction
  aliases:
  - hypersensitivity
  - adverse reaction
  - intolerance
  element_types:
  - paragraph
  - list_item
  - table_cell
  extraction_rules:
  - name: allergy_keyword_match_1
    description: 'Matches keywords: allergy, allergic, adverse reaction, intolerance'
    keywords:
    - allergy
