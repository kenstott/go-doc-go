  parent_type: ''
  w_category: what
  domain: compliance
common_entity_refs:
- person
- organization
- email
- phone
- date
- money
- percentage
- document
relationships:
- name: regulation_enforced_by
  source_type: regulation
  target_type: regulatory_body
  relationship_type: related_to
  description: Regulation is enforced by regulatory body
  sample_patterns:
  - '{regulation} is enforced by {regulatory_body}'
  - '{regulatory_body} enforces {regulation}'
- name: requirement_mandated_by
  source_type: compliance_requirement
  target_type: regulation
  relationship_type: derived_from
  description: Compliance requirement is mandated by regulation
  sample_patterns:
  - '{compliance_requirement} required by {regulation}'
  - '{regulation} mandates {compliance_requirement}'
- name: officer_oversees
  source_type: compliance_officer
  target_type: policy_document
  relationship_type: related_to
  description: Compliance officer oversees policy
  sample_patterns:
  - '{compliance_officer} oversees {policy_document}'
  - '{policy_document} managed by {compliance_officer}'
- name: audit_identifies_finding
  source_type: audit_finding
  target_type: control
  relationship_type: related_to
  description: Audit finding identifies deficiency in control
  sample_patterns:
  - audit identified {audit_finding} in {control}
  - '{control} found deficient: {audit_finding}'
- name: control_addresses_requirement
  source_type: control
  target_type: compliance_requirement
  relationship_type: related_to
  description: Control implemented to address compliance requirement
  sample_patterns:
  - '{control} implemented to address {compliance_requirement}'
  - '{compliance_requirement} addressed by {control}'
- name: violation_results_in_penalty
  source_type: audit_finding
  target_type: penalty
  relationship_type: related_to
  description: Compliance violation results in penalty
  sample_patterns:
  - '{audit_finding} resulted in {penalty}'
  - '{penalty} imposed for {audit_finding}'
- name: risk_mitigated_by_control
  source_type: risk_assessment
  target_type: control
  relationship_type: related_to
  description: Risk mitigated by control
  sample_patterns:
  - '{risk_assessment} mitigated by {control}'
  - '{control} addresses {risk_assessment}'
