relationship_types:
- relationship_type: transported_by
  description: Shipment transported by carrier
  extraction_rules:
  - name: transported_by_keyword_match_1
    description: 'Matches keywords: transported by, shipped via, carrier, hauled by'
    keywords:
    - transported by
    - shipped via
    - carrier
    - hauled by
  source_type: shipment
  target_type: carrier
- relationship_type: assigned_to_vehicle
  description: Shipment assigned to vehicle
  extraction_rules:
  - name: assigned_to_vehicle_keyword_match_1
    description: 'Matches keywords: loaded on, assigned to, vehicle, truck, trailer'
