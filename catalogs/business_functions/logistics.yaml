domain: logistics
description: Transportation, warehousing operations, fleet management, route optimization, freight forwarding, and last-mile
  delivery
subdomains:
- transportation_management
- warehouse_operations
- fleet_management
- freight_forwarding
- last_mile_delivery
- route_optimization
entity_types:
- entity_type: shipment
  description: Individual shipment or freight consignment
  aliases:
  - freight
  - consignment
  - cargo
  - load
  element_types:
  - paragraph
  - heading
  - list_item
  - table_row
  extraction_rules:
  - name: shipment_keyword_match_1
    description: Matches 8 keywords including shipment, freight, consignment, etc.
    keywords:
    - shipment
    - freight
    - consignment
    - cargo
    - load
    - tracking number
    - BOL
    - bill of lading
  parent_type: ''
  w_category: what
  domain: logistics
