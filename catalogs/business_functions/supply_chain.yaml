  aliases:
  - SKU
  - stock item
  - product
  - material
  element_types:
  - paragraph
  - list_item
  - table_row
  extraction_rules:
  - name: inventory_item_keyword_match_1
    description: Matches 6 keywords including SKU, inventory item, stock, etc.
    keywords:
    - SKU
    - inventory item
    - stock
    - part number
    - material
    - component
  parent_type: ''
  w_category: what
  domain: supply_chain
- entity_type: warehouse
