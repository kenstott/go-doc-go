domain: supply_chain
description: Procurement, inventory management, warehousing, distribution, logistics, and supplier management
subdomains:
- procurement
- inventory_management
- warehouse_management
- transportation
- supplier_management
- demand_planning
entity_types:
- entity_type: supplier
  description: Vendor or supplier organization
  aliases:
  - vendor
  - supplier
  - provider
  element_types:
  - paragraph
  - heading
  - list_item
  - table_row
  extraction_rules:
  - name: supplier_keyword_match_1
    description: 'Matches keywords: supplier, vendor, provider, manufacturer, distributor'
    keywords:
    - supplier
    - vendor
    - provider
    - manufacturer
    - distributor
  parent_type: global.organization
  w_category: who
  domain: supply_chain
- entity_type: purchase_order
  description: Purchase order or procurement request
  aliases:
  - PO
  - procurement order
  - buy order
  element_types:
  - paragraph
  - heading
  - list_item
  - table_row
  extraction_rules:
  - name: purchase_order_keyword_match_1
    description: 'Matches keywords: purchase order, PO, procurement, buy order, requisition'
    keywords:
    - purchase order
    - PO
    - procurement
    - buy order
    - requisition
  parent_type: ''
  w_category: what
  domain: supply_chain
- entity_type: inventory_item
