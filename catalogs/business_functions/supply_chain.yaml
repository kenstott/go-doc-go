  aliases:
  - distribution center
  - DC
  - storage facility
  - fulfillment center
  element_types:
  - paragraph
  - heading
  - list_item
  extraction_rules:
  - name: warehouse_keyword_match_1
    description: 'Matches keywords: warehouse, distribution center, DC, storage facility, fulfillment center'
    keywords:
    - warehouse
    - distribution center
    - DC
    - storage facility
    - fulfillment center
  parent_type: ''
  w_category: what
  domain: supply_chain
- entity_type: shipment
  description: Shipment or delivery
  aliases:
  - delivery
  - transportation
  - freight
  element_types:
  - paragraph
  - list_item
  - table_row
  extraction_rules:
  - name: shipment_keyword_match_1
    description: 'Matches keywords: shipment, delivery, freight, transportation, cargo'
    keywords:
    - shipment
    - delivery
    - freight
    - transportation
    - cargo
  parent_type: ''
  w_category: what
  domain: supply_chain
- entity_type: carrier
  description: Transportation carrier or logistics provider
  aliases:
  - shipper
  - logistics provider
  - freight forwarder
  element_types:
  - paragraph
  - list_item
  extraction_rules:
  - name: carrier_keyword_match_1
    description: 'Matches keywords: carrier, shipper, logistics provider, freight forwarder, courier'
    keywords:
    - carrier
    - shipper
    - logistics provider
    - freight forwarder
    - courier
  parent_type: ''
  w_category: what
  domain: supply_chain
- entity_type: demand_forecast
  description: Demand forecast or planning projection
  aliases:
  - demand plan
  - forecast
  - demand projection
  element_types:
  - paragraph
  - list_item
  - table_row
  extraction_rules:
  - name: demand_forecast_keyword_match_1
    description: 'Matches keywords: demand forecast, demand plan, planning, projection, expected demand'
    keywords:
    - demand forecast
    - demand plan
    - planning
    - projection
    - expected demand
  parent_type: ''
  w_category: what
  domain: supply_chain
relationship_types:
- relationship_type: supplied_by
  description: Item supplied by supplier
  extraction_rules:
  - name: supplied_by_keyword_match_1
    description: 'Matches keywords: supplied by, from, vendor, sourced from'
    keywords:
    - supplied by
    - from
    - vendor
    - sourced from
  source_type: inventory_item
  target_type: supplier
- relationship_type: ordered_from
  description: Purchase order placed with supplier
  extraction_rules:
  - name: ordered_from_keyword_match_1
    description: 'Matches keywords: ordered from, placed with, vendor'
    keywords:
    - ordered from
    - placed with
    - vendor
  source_type: purchase_order
  target_type: supplier
- relationship_type: contains_item
  description: Purchase order contains inventory item
  extraction_rules:
  - name: contains_item_keyword_match_1
    description: 'Matches keywords: includes, contains, for, item'
    keywords:
    - includes
    - contains
    - for
    - item
  source_type: purchase_order
  target_type: inventory_item
- relationship_type: stored_in
  description: Item stored in warehouse
  extraction_rules:
  - name: stored_in_keyword_match_1
    description: 'Matches keywords: stored in, located at, warehouse, facility'
    keywords:
    - stored in
    - located at
    - warehouse
    - facility
  source_type: inventory_item
  target_type: warehouse
- relationship_type: shipped_via
  description: Shipment transported by carrier
  extraction_rules:
  - name: shipped_via_keyword_match_1
    description: 'Matches keywords: shipped via, carrier, transported by, using'
    keywords:
    - shipped via
    - carrier
    - transported by
    - using
  source_type: shipment
  target_type: carrier
- relationship_type: fulfills_order
  description: Shipment fulfills purchase order
  extraction_rules:
  - name: fulfills_order_keyword_match_1
    description: 'Matches keywords: fulfills, delivers, for order, PO'
    keywords:
    - fulfills
    - delivers
    - for order
    - PO
  source_type: shipment
  target_type: purchase_order
- relationship_type: based_on_forecast
  description: Order based on demand forecast
  extraction_rules:
  - name: based_on_forecast_keyword_match_1
    description: 'Matches keywords: based on, forecast, projected demand, planning'
    keywords:
    - based on
    - forecast
    - projected demand
    - planning
  source_type: purchase_order
  target_type: demand_forecast
