  aliases:
  - physician
  - doctor
  - nurse
  - clinician
  - practitioner
  element_types:
  - paragraph
  - list_item
  - table_row
  extraction_rules:
  - name: provider_keyword_match_1
    description: Matches 9 keywords including physician, doctor, MD, etc.
    keywords:
    - physician
    - doctor
    - MD
    - DO
    - nurse
    - NP
    - PA
    - clinician
    - provider
