domain: healthcare
description: Patient care, medical treatments, diagnoses, healthcare providers, medical records, and clinical operations
dependencies:
- medical
subdomains:
- clinical_care
- patient_records
- pharmacy
- radiology
- laboratory
- billing_coding
entity_types:
