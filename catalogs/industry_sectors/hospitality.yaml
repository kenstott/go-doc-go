domain: hospitality
description: Hotels, reservations, guests, events, food & beverage, and hospitality operations
subdomains:
- reservations
- guest_services
- property_management
- events
- food_beverage
entity_types:
- entity_type: guest
  description: Hotel guest or customer
  aliases:
  - customer
  - visitor
  - patron
  element_types:
  - paragraph
  - list_item
  - table_row
  extraction_rules:
  - name: guest_keyword_match_1
    description: 'Matches keywords: guest, customer, visitor, patron, traveler'
    keywords:
    - guest
    - customer
    - visitor
    - patron
    - traveler
  parent_type: ''
  w_category: what
  domain: hospitality
- entity_type: reservation
  description: Hotel reservation or booking
  aliases:
  - booking
  - reservation
  - stay
  element_types:
  - paragraph
  - heading
  - list_item
  - table_row
  extraction_rules:
  - name: reservation_keyword_match_1
    description: Matches 6 keywords including reservation, booking, check-in, etc.
    keywords:
    - reservation
    - booking
    - check-in
    - check-out
    - stay
    - confirmation
  parent_type: ''
  w_category: what
  domain: hospitality
- entity_type: room
  description: Hotel room or accommodation
  aliases:
  - accommodation
  - suite
  - unit
  element_types:
  - paragraph
  - list_item
  - table_row
  extraction_rules:
  - name: room_keyword_match_1
    description: Matches 7 keywords including room, suite, accommodation, etc.
    keywords:
    - room
    - suite
    - accommodation
    - king
    - queen
    - double
    - single
  parent_type: ''
  w_category: what
  domain: hospitality
- entity_type: hotel_property
  description: Hotel property or location
  aliases:
  - hotel
  - property
  - location
  - resort
  element_types:
  - paragraph
  - heading
  - list_item
  extraction_rules:
  - name: hotel_property_keyword_match_1
    description: 'Matches keywords: hotel, property, resort, location, branch'
    keywords:
    - hotel
    - property
    - resort
    - location
    - branch
  parent_type: ''
  w_category: what
  domain: hospitality
- entity_type: event
  description: Hotel event or function
  aliases:
  - function
  - meeting
  - conference
  - banquet
  element_types:
  - paragraph
  - heading
  - list_item
  extraction_rules:
  - name: event_keyword_match_1
    description: Matches 6 keywords including event, function, meeting, etc.
    keywords:
    - event
    - function
    - meeting
    - conference
    - wedding
    - banquet
  parent_type: ''
  w_category: what
  domain: hospitality
relationship_types:
- relationship_type: booked_by
  description: Reservation booked by guest
  extraction_rules:
  - name: booked_by_keyword_match_1
    description: 'Matches keywords: booked by, reserved by, guest name'
    keywords:
    - booked by
    - reserved by
    - guest name
  source_type: reservation
  target_type: guest
- relationship_type: for_room
  description: Reservation for room
  extraction_rules:
  - name: for_room_keyword_match_1
    description: 'Matches keywords: room, suite, accommodation type'
    keywords:
    - room
    - suite
    - accommodation type
  source_type: reservation
  target_type: room
- relationship_type: at_property
  description: Reservation at property
  extraction_rules:
  - name: at_property_keyword_match_1
    description: 'Matches keywords: at, location, property, hotel'
    keywords:
    - at
    - location
    - property
    - hotel
  source_type: reservation
  target_type: hotel_property
- relationship_type: hosted_at
  description: Event hosted at property
  extraction_rules:
  - name: hosted_at_keyword_match_1
    description: 'Matches keywords: hosted at, held at, venue, location'
    keywords:
    - hosted at
    - held at
    - venue
    - location
  source_type: event
  target_type: hotel_property
