domain: nonprofit
description: Nonprofit organization management including fundraising, donor management, grants, programs, volunteers, and
  impact measurement
subdomains:
- fundraising
- donor_management
- grant_management
- program_delivery
- volunteer_coordination
- impact_measurement
terms:
- name: fundraising
  synonyms:
  - development
  - donations
  - giving
  - charitable giving
  description: Activities related to raising funds for the organization
- name: donor
  synonyms:
  - contributor
  - benefactor
  - sponsor
  - supporter
  - philanthropist
  description: Individual or organization that provides financial support
- name: grant
  synonyms:
  - award
  - funding
  - endowment
  - subsidy
  description: Financial award from a foundation or government agency
- name: program
  synonyms:
  - initiative
  - project
  - service
  - outreach
  description: Organized activity or service delivered by the nonprofit
- name: volunteer
  synonyms:
  - helper
  - supporter
  - activist
  - community member
  description: Person who donates time and skills to the organization
- name: impact
  synonyms:
  - outcome
  - result
  - effect
  - benefit
  - change
  description: Measurable positive change created by the organization
entity_types:
- entity_type: donor
  parent_type: ''
  w_category: what
  domain: nonprofit
  description: Individual or organization providing financial support
  element_types:
  - paragraph
  - table_cell
  - heading
  extraction_rules:
  - name: donor_phrase_list_1
    description: Matches 4 specific phrases including donor, contributor, etc.
    phrase_list:
    - donor
    - contributor
    - sponsor
    - benefactor
- entity_type: donation
  parent_type: ''
  w_category: what
  domain: nonprofit
  description: Financial contribution or gift
  element_types:
  - table_cell
  - paragraph
  extraction_rules:
  - name: donation_pattern_match_1
    description: Matches text using regex pattern
    pattern: \$\d{1,3}(?:,\d{3})*(?:\.\d{2})?
- entity_type: grant
  parent_type: ''
  w_category: what
  domain: nonprofit
  description: Formal funding award from foundation or government
  element_types:
  - paragraph
  - heading
  - table_cell
  extraction_rules:
  - name: grant_phrase_list_1
    description: Matches 4 specific phrases including grant, award, etc.
    phrase_list:
    - grant
    - award
    - funding
    - foundation grant
- entity_type: program
  parent_type: ''
  w_category: what
  domain: nonprofit
  description: Organized service or activity delivered by nonprofit
  element_types:
  - paragraph
  - heading
  extraction_rules:
  - name: program_phrase_list_1
    description: Matches 4 specific phrases including program, initiative, etc.
    phrase_list:
    - program
    - initiative
    - project
    - outreach
- entity_type: volunteer
  parent_type: ''
  w_category: what
  domain: nonprofit
  description: Person donating time and skills
  element_types:
  - paragraph
  - table_cell
  extraction_rules:
  - name: volunteer_phrase_list_1
    description: 'Matches exact phrases: volunteer, helper, supporter'
    phrase_list:
    - volunteer
    - helper
    - supporter
- entity_type: beneficiary
  parent_type: ''
  w_category: what
  domain: nonprofit
  description: Person or community served by the nonprofit
  element_types:
  - paragraph
  - table_cell
  extraction_rules:
  - name: beneficiary_phrase_list_1
    description: Matches 4 specific phrases including beneficiary, participant, etc.
    phrase_list:
    - beneficiary
    - participant
    - client
    - recipient
- entity_type: foundation
  parent_type: ''
  w_category: what
  domain: nonprofit
  description: Grant-making organization
  element_types:
  - paragraph
  - heading
  extraction_rules:
  - name: foundation_pattern_match_1
    description: Matches text using regex pattern
    pattern: '\b[A-Z][a-z]+(?: [A-Z][a-z]+)* Foundation\b'
- entity_type: nonprofit_organization
  parent_type: ''
  w_category: what
  domain: nonprofit
  description: Tax-exempt charitable organization
  element_types:
  - paragraph
  - heading
  extraction_rules:
  - name: nonprofit_organization_phrase_list_1
    description: Matches 5 specific phrases including nonprofit, NGO, etc.
    phrase_list:
    - nonprofit
    - NGO
    - charity
    - 501(c)(3)
    - charitable organization
- entity_type: impact_metric
  parent_type: ''
  w_category: what
  domain: nonprofit
  description: Measure of social impact or outcomes
  element_types:
  - table_cell
  - paragraph
  extraction_rules:
  - name: impact_metric_phrase_list_1
    description: Matches 4 specific phrases including lives impacted, people served, etc.
    phrase_list:
    - lives impacted
    - people served
    - outcomes achieved
    - impact
common_entity_refs:
- person
- email
- phone
- address
- date
- percentage
- number
relationships:
- name: donor_contributes_to
  source_type: donor
  target_type: nonprofit_organization
  relationship_type: related_to
  description: Donor provides financial support to nonprofit
  sample_patterns:
  - '{donor} donated to {nonprofit_organization}'
  - '{donor} contributed ${amount} to {nonprofit_organization}'
- name: grant_awarded_by
  source_type: grant
  target_type: foundation
  relationship_type: related_to
  description: Grant awarded by foundation
  sample_patterns:
  - '{grant} awarded by {foundation}'
  - '{foundation} provided {grant}'
- name: volunteer_supports
  source_type: volunteer
  target_type: program
  relationship_type: part_of
  description: Volunteer participates in program
  sample_patterns:
  - '{volunteer} volunteers for {program}'
  - '{volunteer} supports {program}'
- name: program_serves
  source_type: program
  target_type: beneficiary
  relationship_type: related_to
  description: Program provides services to beneficiaries
  sample_patterns:
  - '{program} serves {beneficiary}'
  - '{program} benefits {beneficiary}'
