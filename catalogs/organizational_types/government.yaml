domain: government
description: Government operations, regulations, permits, licenses, public records, and citizen services
subdomains:
- licensing
- permits
- public_records
- citizen_services
- regulatory_compliance
entity_types:
- entity_type: regulation
  parent_type: ''
  w_category: what
  domain: government
  description: Government regulation or law
  element_types:
  - paragraph
  - heading
  - list_item
  extraction_rules:
  - name: regulation_phrase_list_1
    description: Matches 8 specific phrases including regulation, law, etc.
    phrase_list:
    - regulation
    - law
    - statute
    - ordinance
    - rule
    - code
    - CFR
    - USC
- entity_type: permit
  parent_type: ''
  w_category: what
  domain: government
  description: Government permit or authorization
  element_types:
  - paragraph
  - heading
  - list_item
  - table_row
  extraction_rules:
  - name: permit_phrase_list_1
    description: Matches 5 specific phrases including permit, authorization, etc.
    phrase_list:
    - permit
    - authorization
    - approval
    - building permit
    - zoning permit
- entity_type: license
  parent_type: ''
  w_category: what
  domain: government
  description: Government license or certification
  element_types:
  - paragraph
  - list_item
  - table_row
  extraction_rules:
  - name: license_phrase_list_1
    description: Matches 5 specific phrases including license, certification, etc.
    phrase_list:
    - license
    - certification
    - credential
    - registration
    - business license
- entity_type: citizen
  parent_type: ''
  w_category: what
  domain: government
  description: Citizen or resident
  element_types:
  - paragraph
  - list_item
  - table_row
  extraction_rules:
  - name: citizen_phrase_list_1
    description: Matches 4 specific phrases including citizen, resident, etc.
    phrase_list:
    - citizen
    - resident
    - constituent
    - taxpayer
- entity_type: government_agency
  parent_type: ''
  w_category: what
  domain: government
  description: Government agency or department
  element_types:
  - paragraph
  - heading
  - list_item
  extraction_rules:
  - name: government_agency_phrase_list_1
    description: Matches 8 specific phrases including agency, department, etc.
    phrase_list:
    - agency
    - department
    - bureau
    - office
    - division
    - DMV
    - EPA
    - IRS
- entity_type: public_record
  parent_type: ''
  w_category: what
  domain: government
  description: Public record or document
  element_types:
  - paragraph
  - heading
  - list_item
  extraction_rules:
  - name: public_record_phrase_list_1
    description: Matches 4 specific phrases including public record, government document, etc.
    phrase_list:
    - public record
    - government document
    - official record
    - filing
relationship_types:
- relationship_type: issued_by
  description: Permit issued by agency
  extraction_rules:
  - name: issued_by_keyword_match_1
    description: 'Matches keywords: issued by, granted by, approved by'
    keywords:
    - issued by
    - granted by
    - approved by
  source_type: permit
  target_type: government_agency
- relationship_type: issued_to
  description: Permit issued to citizen
  extraction_rules:
  - name: issued_to_keyword_match_1
    description: 'Matches keywords: issued to, granted to, holder'
    keywords:
    - issued to
    - granted to
    - holder
  source_type: permit
  target_type: citizen
- relationship_type: governed_by
  description: Permit governed by regulation
  extraction_rules:
  - name: governed_by_keyword_match_1
    description: 'Matches keywords: governed by, under, pursuant to, according to'
    keywords:
    - governed by
    - under
    - pursuant to
    - according to
  source_type: permit
  target_type: regulation
- relationship_type: maintained_by
  description: Record maintained by agency
  extraction_rules:
  - name: maintained_by_keyword_match_1
    description: 'Matches keywords: maintained by, held by, managed by'
    keywords:
    - maintained by
    - held by
    - managed by
  source_type: public_record
  target_type: government_agency
- relationship_type: applies_to
  description: Regulation applies to entity
  extraction_rules:
  - name: applies_to_keyword_match_1
    description: 'Matches keywords: applies to, governs, regulates, covers'
    keywords:
    - applies to
    - governs
    - regulates
    - covers
  source_type: regulation
  target_type: citizen
