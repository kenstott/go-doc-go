domain: religion
description: Religious organizations, faith communities, worship, religious texts, spiritual practices, and faith-based services
subdomains:
- worship
- religious_education
- community_services
- faith_administration
- spiritual_care
terms:
- name: congregation
  synonyms:
  - parish
  - assembly
  - flock
  - community
  - fellowship
  description: Group of people who worship together
- name: clergy
  synonyms:
  - minister
  - priest
  - rabbi
  - imam
  - pastor
  - spiritual leader
  description: Religious leader ordained to perform religious ceremonies
- name: worship
  synonyms:
  - service
  - mass
  - prayer
  - devotion
  - liturgy
  description: Acts of religious devotion and ceremony
- name: scripture
  synonyms:
  - holy text
  - sacred text
  - religious text
  - bible
  description: Religious texts considered sacred
- name: sacrament
  synonyms:
  - ritual
  - rite
  - ceremony
  - ordinance
  description: Religious ceremony or ritual
- name: ministry
  synonyms:
  - service
  - outreach
  - mission
  - pastoral care
  description: Religious service or outreach activity
entity_types:
- entity_type: religious_organization
  parent_type: ''
  w_category: what
  domain: religion
  description: Church, synagogue, mosque, temple, or faith-based organization
  element_types:
  - paragraph
  - heading
  extraction_rules:
  - name: religious_organization_pattern_match_1
    description: Matches text using regex pattern
    pattern: '\b[A-Z][a-z]+(?: [A-Z][a-z]+)* (?:Church|Temple|Synagogue|Mosque|Cathedral|Chapel)\b'
  - name: religious_organization_phrase_list_2
    description: Matches 6 specific phrases including church, temple, etc.
    phrase_list:
    - church
    - temple
    - synagogue
    - mosque
    - parish
    - congregation
- entity_type: clergy
  parent_type: ''
  w_category: what
  domain: religion
  description: Religious leader or ordained minister
  element_types:
  - paragraph
  - table_cell
  extraction_rules:
  - name: clergy_phrase_list_1
    description: Matches 8 specific phrases including reverend, pastor, etc.
    phrase_list:
    - reverend
    - pastor
    - priest
    - rabbi
    - imam
    - minister
    - deacon
    - bishop
  - name: clergy_pattern_match_2
    description: Matches text using regex pattern
    pattern: '\b(?:Rev\.|Reverend|Pastor|Fr\.|Father|Rabbi|Imam)\s+[A-Z][a-z]+(?: [A-Z][a-z]+)+\b'
- entity_type: worship_service
  parent_type: ''
