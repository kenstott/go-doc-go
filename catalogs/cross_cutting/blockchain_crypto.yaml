  w_category: what
  domain: blockchain_crypto
relationship_types:
- relationship_type: sent_from
  description: Transaction sent from wallet
  extraction_rules:
  - name: sent_from_keyword_match_1
    description: 'Matches keywords: from, sent from, sender, source address'
    keywords:
    - from
    - sent from
    - sender
    - source address
  source_type: blockchain_transaction
  target_type: wallet
- relationship_type: sent_to
  description: Transaction sent to wallet
  extraction_rules:
  - name: sent_to_keyword_match_1
    description: 'Matches keywords: to, sent to, recipient, destination address'
    keywords:
    - to
    - sent to
    - recipient
    - destination address
  source_type: blockchain_transaction
  target_type: wallet
- relationship_type: transfers_token
  description: Transaction transfers token
  extraction_rules:
  - name: transfers_token_keyword_match_1
    description: 'Matches keywords: transfers, sends, token, coin, amount'
    keywords:
    - transfers
    - sends
    - token
    - coin
    - amount
  source_type: blockchain_transaction
  target_type: token
- relationship_type: included_in
  description: Transaction included in block
  extraction_rules:
  - name: included_in_keyword_match_1
    description: 'Matches keywords: included in, in block, block, confirmed in'
    keywords:
    - included in
    - in block
    - block
    - confirmed in
  source_type: blockchain_transaction
  target_type: block
- relationship_type: executed_by
  description: Transaction executed by smart contract
  extraction_rules:
  - name: executed_by_keyword_match_1
    description: 'Matches keywords: executed by, called, contract, smart contract'
    keywords:
    - executed by
    - called
    - contract
    - smart contract
  source_type: blockchain_transaction
  target_type: smart_contract
- relationship_type: uses_protocol
  description: Smart contract uses DeFi protocol
  extraction_rules:
  - name: uses_protocol_keyword_match_1
    description: 'Matches keywords: uses, integrates with, protocol, DeFi'
    keywords:
    - uses
    - integrates with
    - protocol
    - DeFi
  source_type: smart_contract
  target_type: defi_protocol
