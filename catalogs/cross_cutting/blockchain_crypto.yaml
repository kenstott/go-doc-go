domain: blockchain_crypto
description: Blockchain transactions, wallets, smart contracts, tokens, and cryptocurrency operations
subdomains:
- blockchain_operations
- cryptocurrency
- smart_contracts
- token_management
- defi
entity_types:
- entity_type: blockchain_transaction
  description: Blockchain transaction or transfer
  aliases:
  - transaction
  - transfer
  - payment
  - tx
  element_types:
  - paragraph
  - list_item
  - table_row
  extraction_rules:
  - name: blockchain_transaction_keyword_match_1
    description: Matches 6 keywords including transaction, transfer, payment, etc.
    keywords:
    - transaction
    - transfer
    - payment
    - tx
    - blockchain transaction
    - hash
  parent_type: ''
  w_category: what
  domain: blockchain_crypto
- entity_type: wallet
  description: Cryptocurrency wallet or address
  aliases:
  - address
  - account
  - wallet address
  element_types:
  - paragraph
  - list_item
  - table_row
  extraction_rules:
  - name: wallet_keyword_match_1
    description: 'Matches keywords: wallet, address, account, wallet address, public key'
    keywords:
    - wallet
    - address
    - account
    - wallet address
    - public key
  parent_type: ''
  w_category: what
  domain: blockchain_crypto
