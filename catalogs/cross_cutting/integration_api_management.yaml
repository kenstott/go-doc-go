domain: integration_api_management
description: APIs, integrations, data exchange, service orchestration, and API lifecycle management
subdomains:
- api_development
- api_security
- service_integration
- data_exchange
- api_monitoring
entity_types:
- entity_type: api
  description: API or web service
  aliases:
  - web service
  - REST API
  - API endpoint
  - service
  element_types:
  - paragraph
  - heading
  - list_item
  extraction_rules:
  - name: api_keyword_match_1
    description: Matches 6 keywords including API, web service, REST, etc.
    keywords:
    - API
    - web service
    - REST
    - endpoint
    - service
    - interface
  parent_type: ''
  w_category: what
  domain: integration_api_management
- entity_type: api_endpoint
  description: API endpoint or route
  aliases:
  - route
  - path
  - operation
  - method
  element_types:
  - paragraph
  - list_item
  - table_row
  extraction_rules:
  - name: api_endpoint_keyword_match_1
    description: Matches 8 keywords including endpoint, route, path, etc.
    keywords:
    - endpoint
    - route
    - path
    - operation
    - GET
    - POST
    - PUT
    - DELETE
  parent_type: ''
  w_category: what
  domain: integration_api_management
- entity_type: integration
  description: System integration or connector
  aliases:
  - connector
  - integration point
  - connection
  element_types:
  - paragraph
  - list_item
  extraction_rules:
  - name: integration_keyword_match_1
    description: 'Matches keywords: integration, connector, connection, integration point, interface'
    keywords:
    - integration
    - connector
    - connection
    - integration point
    - interface
  parent_type: ''
  w_category: what
  domain: integration_api_management
- entity_type: data_format
