  - schema
  - format
  - data structure
  - message format
  element_types:
  - paragraph
  - list_item
  extraction_rules:
  - name: data_format_keyword_match_1
    description: Matches 6 keywords including format, schema, JSON, etc.
    keywords:
    - format
    - schema
    - JSON
    - XML
    - data structure
    - message format
  parent_type: ''
  w_category: what
  domain: integration_api_management
- entity_type: api_consumer
  description: API consumer or client
  aliases:
  - client
  - application
  - consumer
  - subscriber
