  - paragraph
  - list_item
  - table_row
  extraction_rules:
  - name: api_key_keyword_match_1
    description: 'Matches keywords: API key, credential, access token, API token, secret'
    keywords:
    - API key
    - credential
    - access token
    - API token
    - secret
  parent_type: ''
  w_category: what
  domain: integration_api_management
relationship_types:
- relationship_type: exposes_endpoint
  description: API exposes endpoint
  extraction_rules:
  - name: exposes_endpoint_keyword_match_1
    description: 'Matches keywords: exposes, provides, offers, endpoint, route'
    keywords:
    - exposes
    - provides
    - offers
    - endpoint
    - route
  source_type: api
  target_type: api_endpoint
- relationship_type: uses_format
  description: Endpoint uses data format
  extraction_rules:
  - name: uses_format_keyword_match_1
    description: 'Matches keywords: uses, accepts, returns, format, schema'
    keywords:
    - uses
    - accepts
    - returns
    - format
    - schema
  source_type: api_endpoint
  target_type: data_format
- relationship_type: integrates_with
  description: Integration connects APIs
  extraction_rules:
  - name: integrates_with_keyword_match_1
    description: 'Matches keywords: integrates with, connects to, calls, consumes'
    keywords:
    - integrates with
    - connects to
    - calls
    - consumes
  source_type: integration
  target_type: api
- relationship_type: consumed_by
  description: API consumed by consumer
  extraction_rules:
  - name: consumed_by_keyword_match_1
    description: 'Matches keywords: consumed by, used by, client, consumer'
    keywords:
    - consumed by
    - used by
    - client
    - consumer
  source_type: api
  target_type: api_consumer
- relationship_type: authenticated_with
  description: Consumer authenticated with API key
  extraction_rules:
  - name: authenticated_with_keyword_match_1
    description: 'Matches keywords: authenticated with, uses key, API key, credential'
    keywords:
    - authenticated with
    - uses key
    - API key
    - credential
  source_type: api_consumer
  target_type: api_key
