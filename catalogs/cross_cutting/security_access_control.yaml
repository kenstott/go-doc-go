domain: security_access_control
description: Authentication, authorization, permissions, roles, identity management, and access control
subdomains:
- authentication
- authorization
- identity_management
- access_control
- audit_logging
entity_types:
- entity_type: user
  description: User or identity
  aliases:
  - identity
  - account
  - principal
  element_types:
  - paragraph
  - list_item
  - table_row
  extraction_rules:
  - name: user_keyword_match_1
    description: 'Matches keywords: user, identity, account, principal, username'
    keywords:
    - user
    - identity
    - account
    - principal
    - username
  parent_type: ''
  w_category: what
  domain: security_access_control
- entity_type: role
  description: Security role or group
  aliases:
  - group
  - security group
  - permission group
  element_types:
  - paragraph
  - list_item
  - table_row
  extraction_rules:
  - name: role_keyword_match_1
    description: 'Matches keywords: role, group, security group, permission group'
    keywords:
    - role
    - group
    - security group
    - permission group
  parent_type: ''
  w_category: what
  domain: security_access_control
- entity_type: permission
  description: Permission or privilege
  aliases:
  - privilege
  - access right
  - entitlement
  element_types:
  - paragraph
  - list_item
  - table_row
  extraction_rules:
  - name: permission_keyword_match_1
    description: 'Matches keywords: permission, privilege, access right, entitlement, grant'
    keywords:
    - permission
    - privilege
    - access right
    - entitlement
    - grant
  parent_type: ''
  w_category: what
  domain: security_access_control
- entity_type: resource
  description: Protected resource or object
  aliases:
  - object
  - asset
  - protected resource
  element_types:
  - paragraph
  - list_item
  - table_row
  extraction_rules:
  - name: resource_keyword_match_1
    description: 'Matches keywords: resource, object, asset, protected resource, system'
    keywords:
    - resource
    - object
    - asset
    - protected resource
    - system
  parent_type: ''
  w_category: what
  domain: security_access_control
- entity_type: authentication_method
  description: Authentication method or mechanism
  aliases:
  - auth method
  - authentication mechanism
  - credential type
  element_types:
  - paragraph
  - list_item
  extraction_rules:
  - name: authentication_method_keyword_match_1
    description: Matches 7 keywords including authentication, auth method, password, etc.
    keywords:
    - authentication
    - auth method
    - password
    - MFA
    - SSO
    - OAuth
    - SAML
  parent_type: ''
  w_category: what
  domain: security_access_control
- entity_type: audit_event
  description: Security audit or access event
  aliases:
  - access event
  - security event
  - audit log
  element_types:
  - paragraph
  - list_item
  - table_row
  extraction_rules:
  - name: audit_event_keyword_match_1
    description: 'Matches keywords: audit, access event, security event, log entry, access attempt'
    keywords:
    - audit
    - access event
    - security event
    - log entry
    - access attempt
  parent_type: ''
  w_category: what
  domain: security_access_control
relationship_types:
- relationship_type: has_role
  description: User has role
  extraction_rules:
  - name: has_role_keyword_match_1
    description: 'Matches keywords: has role, member of, assigned to, in group'
    keywords:
    - has role
    - member of
    - assigned to
    - in group
  source_type: user
  target_type: role
- relationship_type: has_permission
  description: Role has permission
  extraction_rules:
  - name: has_permission_keyword_match_1
    description: 'Matches keywords: has permission, grants, includes, allows'
    keywords:
    - has permission
    - grants
    - includes
    - allows
  source_type: role
  target_type: permission
- relationship_type: protects
  description: Permission protects resource
  extraction_rules:
  - name: protects_keyword_match_1
    description: 'Matches keywords: protects, controls access to, guards, secures'
    keywords:
    - protects
    - controls access to
    - guards
    - secures
  source_type: permission
  target_type: resource
- relationship_type: authenticated_via
  description: User authenticated via method
  extraction_rules:
  - name: authenticated_via_keyword_match_1
    description: 'Matches keywords: authenticated via, logged in with, uses, auth method'
    keywords:
    - authenticated via
    - logged in with
    - uses
    - auth method
  source_type: user
  target_type: authentication_method
- relationship_type: logged_as
  description: Access logged as audit event
  extraction_rules:
  - name: logged_as_keyword_match_1
    description: 'Matches keywords: logged, audit, access event, recorded'
    keywords:
    - logged
    - audit
    - access event
    - recorded
  source_type: user
  target_type: audit_event
