  conversation_log:
  - question: What domain or industry is this data from? What are you trying to analyze?
    response: This is SEC regulatory filing data. I work in corporate governance and
      need to track executive compensation, board appointments, and insider trading
      activities from 10-K and proxy filings.
    category: domain_context
  - question: Looking at the frequent terms I found, what specific concepts would
      you like to track? For example, are you interested in people, events, organizations,
      or something else?
    response: I'm specifically interested in tracking executive positions like CEO,
      CFO, directors, and their compensation including stock options, salaries, and
      bonuses. I also want to monitor when board members join or leave committees.
    category: specific_interests
  - question: 'What relationships between these concepts matter to you? For example:
      ''who did what'', ''what belongs to whom'', or ''what happened when''?'
    response: I care about who receives what type of compensation, which executives
      serve on which board committees, and when compensation changes occur relative
      to business performance or leadership transitions.
    category: relationships
  - question: What different ways might these concepts be expressed in your documents?
      Are there synonyms, abbreviations, or alternative phrasings I should watch for?
    response: Executive titles have many variations - CEO vs Chief Executive Officer,
      CFO vs Chief Financial Officer. Compensation can be called equity awards, stock
      grants, RSUs, options. Board roles might be Chair, Chairman, Chairperson, Committee
      Member.
    category: variations
  generation_notes:
  - Ontology generated through interactive interview
  - Terms derived from user interests and corpus analysis
  - Semantic variations based on corpus patterns
  - Relationships inferred from user descriptions
