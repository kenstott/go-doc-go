domain:
  name: "semantic_insider_trading"
  version: "1.0.0"
  description: "Semantic-enhanced ontology for SEC insider trading analysis with robust similarity matching"
  settings:
    default_confidence_threshold: 0.70
    max_relationships_per_pair: 5
    enable_transitive_inference: true

terms:
- id: insider
  label: "Insider"
  description: "A person who has access to non-public information about a company, such as an executive, director, or officer"
  aliases: ["reportingOwner", "rptOwnerStateDescription", "ownerSignature", "reportingOwnerRelationship", "reportingOwnerId"]

- id: transaction
  label: "Transaction"
  description: "A trading activity performed by an insider, such as buying, selling, or acquiring shares"
  aliases: ["transactionAcquiredDisposedCode", "transactionDate", "transactionPricePerShare", "transactionCoding", "transactionAmounts"]

- id: ownership
  label: "Ownership"
  description: "Details about an insider's ownership of company shares"
  aliases: ["ownershipNature", "directOrIndirectOwnership", "securityTitle", "sharesOwnedFollowingTransaction", "postTransactionAmounts"]

- id: company
  label: "Company"
  description: "The issuer of securities being traded by insiders"
  aliases: ["securityTitle"]

- id: filing
  label: "Filing"
  description: "Regulatory documents submitted to the SEC containing insider trading information"
  aliases: ["footnoteId", "transactionFormType"]

- id: financial
  label: "Financial Metric"
  description: "Financial performance data reported by companies"
  aliases: []

element_mappings:
- term_id: insider
  rules:
  - type: semantic
    semantic_phrase: "executive director officer CEO president chief executive officer chief operating officer chief financial officer"
    confidence: 0.75
    element_types: ["paragraph", "table_cell"]
  - type: keywords
    keywords: ["reportingOwner", "rptOwnerStateDescription", "ownerSignature", "reportingOwnerRelationship", "reportingOwnerId"]
    confidence: 0.7
    element_types: ["xml_element"]

- term_id: transaction
  rules:
  - type: semantic
    semantic_phrase: "buy purchase acquire acquisition disposition sold sale trading transaction"
    confidence: 0.75
    element_types: ["paragraph", "table_cell"]
  - type: regex
    pattern: "<transactionAcquiredDisposedCode>|<transactionDate>|<transactionPricePerShare>|<transactionCoding>"
    confidence: 0.9
    element_types: ["xml_element"]

- term_id: ownership
  rules:
  - type: semantic
    semantic_phrase: "shares ownership stake holdings"
    confidence: 0.75
    element_types: ["paragraph", "table_cell"]
  - type: regex
    pattern: "<ownershipNature>|<directOrIndirectOwnership>|<securityTitle>|<sharesOwnedFollowingTransaction>"
    confidence: 0.9
    element_types: ["xml_element"]

- term_id: company
  rules:
  - type: semantic
    semantic_phrase: "company corporation issuer enterprise business firm organization"
    confidence: 0.75
    element_types: ["paragraph", "table_cell"]
  - type: keywords
    keywords: ["securityTitle"]
    confidence: 0.7
    element_types: ["xml_element"]

- term_id: filing
  rules:
  - type: semantic
    semantic_phrase: "Form 4 10-K 10-Q 8-K filing report disclosure"
    confidence: 0.75
    element_types: ["paragraph", "table_cell"]
  - type: keywords
    keywords: ["footnoteId", "transactionFormType"]
    confidence: 0.7
    element_types: ["xml_element"]

- term_id: financial
  rules:
  - type: semantic
    semantic_phrase: "revenue sales income earnings profit financial performance"
    confidence: 0.75
    element_types: ["paragraph", "table_cell"]

relationship_rules:
- id: insider_executes_transaction
  relationship_type: action
  description: "Insider executes a stock transaction"
  source:
    term_id: insider
    semantic_phrase: "(?i)(executive|director|officer|insider)"
  target:
    term_id: transaction
    semantic_phrase: "(?i)(buy|purchase|acquisition|acquired|disposition|sold)"
  confidence:
    minimum_score: 0.8
  constraints:
    hierarchy_level: document

- id: insider_owns_shares
  relationship_type: ownership
  description: "Insider owns company shares"
  source:
    term_id: insider
    semantic_phrase: "(?i)(executive|director|officer|insider)"
  target:
    term_id: ownership
    semantic_phrase: "(?i)(owns|ownership|shares)"
  confidence:
    minimum_score: 0.8
  constraints:
    hierarchy_level: document

- id: insider_works_for_company
  relationship_type: corporate_structure
  description: "Insider works for a company"
  source:
    term_id: insider
    semantic_phrase: "(?i)(executive|director|officer|insider)"
  target:
    term_id: company
    semantic_phrase: "(?i)(company|corporation|inc|llc)"
  confidence:
    minimum_score: 0.8
  constraints:
    hierarchy_level: document

- id: transaction_involves_company
  relationship_type: transaction
  description: "A transaction involves a company's stock"
  source:
    term_id: transaction
    semantic_phrase: "(?i)(buy|purchase|acquisition|acquired|disposition|sold)"
  target:
    term_id: company
    semantic_phrase: "(?i)(company|corporation|inc|llc)"
  confidence:
    minimum_score: 0.8
  constraints:
    hierarchy_level: document

- id: transaction_occurred_on_date
  relationship_type: temporal
  description: "A transaction occurred on a specific date"
  source:
    term_id: transaction
    semantic_phrase: "(?i)(buy|purchase|acquisition|acquired|disposition|sold)"
  target:
    term_id: filing
    semantic_phrase: "(?i)(date|filed|reported)"
  confidence:
    minimum_score: 0.8
  constraints:
    hierarchy_level: document

- id: company_reports_financial_metrics
  relationship_type: financial
  description: "A company reports financial metrics in its filings"
  source:
    term_id: company
    semantic_phrase: "(?i)(company|corporation|inc|llc)"
  target:
    term_id: financial
    semantic_phrase: "(?i)(revenue|sales|income|earnings|profit)"
  confidence:
    minimum_score: 0.8
  constraints:
    hierarchy_level: document