domain:
  name: sec_regulatory_filings
  version: 1.0.0
  description: Ontology for SEC regulatory filings
  discovery_method: interactive_progressive
  user_context: "These are SEC regulatory filings including:\n        - 10-K annual\
    \ reports\n        - 10-Q quarterly reports\n        - 8-K current reports\n \
    \       - Form 4 insider trading reports\n        The corpus contains both HTML\
    \ (human-readable) and XML (structured) versions."
  settings:
    default_confidence_threshold: 0.7
    max_relationships_per_pair: 5
    enable_transitive_inference: true
terms:
- id: company
  label: Company
  description: The company that is the subject of the SEC filing.
  aliases:
  - issuerName
- id: ticker
  label: Ticker Symbol
  description: The stock ticker symbol for the company.
  aliases:
  - issuerTradingSymbol
- id: revenue
  label: Revenue
  description: The total revenue or sales reported by the company.
  aliases: []
- id: executive
  label: Executive
  description: A senior officer or director of the company.
  aliases:
  - NAMED EXECUTIVE OFFICER COMPENSATION
- id: filingDate
  label: Filing Date
  description: The date the SEC filing was submitted.
  aliases: []
- id: formType
  label: Form Type
  description: The type of SEC filing, e.g. 10-K, 10-Q, 8-K, Form 4.
  aliases:
  - <transactionFormType>
- id: footnote
  label: Footnote
  description: Additional explanatory information provided in a footnote.
  aliases:
  - <footnoteId>
- id: ownershipNature
  label: Ownership Nature
  description: The nature of the insider's ownership of the company's securities,
    e.g. direct or indirect.
  aliases:
  - <ownershipNature>
- id: securityTitle
  label: Security Title
  description: The title of the company's securities owned by the insider.
  aliases:
  - <securityTitle>
- id: sharesOwned
  label: Shares Owned
  description: The number of shares of the company's securities owned by the insider.
  aliases:
  - <sharesOwnedFollowingTransaction>
- id: transactionAmount
  label: Transaction Amount
  description: The number of shares transacted by the insider.
  aliases:
  - <transactionShares>
- id: transactionPrice
  label: Transaction Price
  description: The price per share of the transaction.
  aliases:
  - <transactionPricePerShare>
- id: transactionDate
  label: Transaction Date
  description: The date the insider transaction occurred.
  aliases:
  - <transactionDate>
- id: transactionType
  label: Transaction Type
  description: The type of insider transaction, e.g. acquisition or disposition.
  aliases:
  - <transactionAcquiredDisposedCode>
- id: transactionCoding
  label: Transaction Coding
  description: The coding used to classify the insider transaction.
  aliases:
  - <transactionCoding>
- id: equitySwapInvolved
  label: Equity Swap Involved
  description: Indicates whether an equity swap was involved in the transaction.
  aliases:
  - <equitySwapInvolved>
- id: nonDerivativeTransaction
  label: Non-Derivative Transaction
  description: Indicates whether the transaction was a non-derivative transaction.
  aliases:
  - <nonDerivativeTransaction>
- id: reportingOwnerAddress
  label: Reporting Owner Address
  description: The address of the insider reporting the transaction.
  aliases:
  - <reportingOwnerAddress>
- id: reportingOwnerState
  label: Reporting Owner State
  description: The state of the insider reporting the transaction.
  aliases:
  - <rptOwnerStateDescription>
- id: reportingOwnerId
  label: Reporting Owner ID
  description: The identifier for the insider reporting the transaction.
  aliases:
  - <reportingOwnerId>
element_mappings:
- term_id: company
  rules:
  - type: xpath
    pattern: //div[contains(., 'Company')]/text()
  - type: xpath
    pattern: //table//th[contains(., 'Company')]/following-sibling::td/text()
  - type: regex
    pattern: (?<=<issuerName>)[^<]+(?=</issuerName>)
- term_id: ticker
  rules:
  - type: regex
    pattern: (?<=<issuerTradingSymbol>)[A-Z]{1,5}(?=</issuerTradingSymbol>)
- term_id: revenue
  rules:
  - type: xpath
    pattern: //table//th[contains(., 'Revenue')]/following-sibling::td/text()
  - type: xpath
    pattern: //table//th[contains(., 'Sales')]/following-sibling::td/text()
- term_id: executive
  rules:
  - type: xpath
    pattern: //h2[contains(., 'NAMED EXECUTIVE OFFICER COMPENSATION')]/following-sibling::*
  - type: xpath
    pattern: //table//th[contains(., 'Executive')]/following-sibling::td/text()
- term_id: filingDate
  rules:
  - type: xpath
    pattern: //table//th[contains(., 'Filing Date')]/following-sibling::td/text()
  - type: regex
    pattern: (?<=<filingDate>)[^<]+(?=</filingDate>)
- term_id: formType
  rules:
  - type: xpath
    pattern: //table//th[contains(., 'Form Type')]/following-sibling::td/text()
  - type: regex
    pattern: (?<=<transactionFormType>)[^<]+(?=</transactionFormType>)
relationship_rules:
- source: company
  target: filing
  label: files
  description: Companies file regulatory reports with the SEC.
- source: company
  target: ticker
  label: has
  description: Companies have associated trading symbols or ticker symbols.
- source: executive
  target: company
  label: works_for
  description: Executives are employed by the companies they work for.
- source: filing
  target: revenue
  label: contains
  description: Regulatory filings contain financial metrics like revenue.
- source: insider
  target: ownership
  label: owns
  description: Corporate insiders own securities in the companies they are affiliated
    with.
- source: filing
  target: filingDate
  label: has
  description: Regulatory filings are associated with a specific filing date.
- source: filing
  target: formType
  label: is
  description: Regulatory filings are categorized by their form type (10-K, 10-Q,
    8-K, etc.).
metadata:
  hypothesized_domain: Securities and Investments
  domain_confidence: 0.9
  domain_evidence:
  - The high frequency of XML tags related to securities, ownership, transactions,
    and reporting requirements suggests these documents are likely related to the
    securities and investments domain.
  - The most frequent content patterns include information about security titles,
    ownership nature, transaction details, and reporting forms, which are all common
    elements in securities-related filings.
  - The overall structure and content of the corpus, with a focus on tabular data,
    transaction details, and regulatory reporting, is characteristic of securities
    and investment-related documents.
  user_corrections: []
