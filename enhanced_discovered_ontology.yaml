domain:
  name: sec_regulatory_filings
  version: 1.0.0
  description: Enhanced ontology for SEC regulatory filings
  discovery_method: enhanced_interactive_progressive
  user_context: "SEC regulatory filings including:\n        \u2022 10-K annual reports\
    \ with comprehensive financial statements\n        \u2022 10-Q quarterly reports\
    \ with interim financial updates\n        \u2022 8-K current reports for material\
    \ corporate events\n        \u2022 Form 4 insider trading reports in structured\
    \ XML format\n        \u2022 DEF 14A proxy statements with executive compensation\
    \ details\n        The corpus contains both HTML (human-readable) and XML (structured)\
    \ versions."
  settings:
    default_confidence_threshold: 0.75
    max_relationships_per_pair: 5
    enable_transitive_inference: true
terms:
- id: company
  label: Company
  description: The organization that is filing the SEC regulatory documents. This
    represents the overall business entity that is subject to SEC reporting requirements.
  aliases:
  - company
  - emerging growth company
  domain_context: SEC filings contain information about the company that is required
    to be disclosed, such as financial statements, executive compensation, and corporate
    governance.
  examples:
  - <footnote> Dividend equivalent rights accrue when and as dividends are paid on
    the Company's common stock and b...
  - If an emerging growth company, indicate by check mark if the registrant has elected
    not to use the e...
  - 'Other Public Company Directorships:'
  confidence: 0.95
- id: ticker
  label: Ticker Symbol
  description: The stock ticker symbol that represents the publicly traded company
    filing the SEC documents.
  aliases: []
  domain_context: SEC filings are associated with the company's publicly traded stock
    and its ticker symbol.
  examples: []
  confidence: 0.0
- id: revenue
  label: Revenue
  description: The total income or sales generated by the company, as reported in
    the financial statements within the SEC filings.
  aliases:
  - revenue
  - deferred revenue
  - unearned revenue
  - revenue recognition
  domain_context: Revenue is a key financial metric disclosed in SEC filings, such
    as the annual 10-K and quarterly 10-Q reports.
  examples:
  - As a percent of revenue
  - Revenue
  - Deferred revenue
  - Unearned Revenue
  - Revenue Recognition
  confidence: 0.95
- id: executive
  label: Executive
  description: The senior-level managers and officers of the company, whose compensation
    and other details are required to be disclosed in the SEC filings.
  aliases:
  - named executive officer
  - chief executive officer
  domain_context: SEC filings, particularly the proxy statement (DEF 14A), contain
    detailed information about the compensation and backgrounds of the company's top
    executives.
  examples:
  - "NAMED EXECUTIVE\_OFFICER COMPENSATION"
  - "1 | GOVERNANCE\_AND OUR BOARD OF DIRECTORS | 2 | NAMED EXECUTIVE\_OFFICER COMPENSATION\
    \ | 3"
  - <officerTitle> Chief Executive Officer
  confidence: 0.95
- id: filing_date
  label: Filing Date
  description: The date on which the SEC regulatory filing was submitted by the company.
  aliases:
  - filing date
  - period end date
  domain_context: The filing date is an important piece of metadata associated with
    SEC filings, as it indicates when the information was reported to the SEC.
  examples:
  - Check the appropriate box below if the Form 8-K filing is intended to simultaneously
    satisfy the fil...
  - Filing Date/ Period End Date
  - Filing Date
  confidence: 0.95
- id: form_type
  label: Form Type
  description: The specific SEC reporting form that the company is filing, such as
    the 10-K annual report, 10-Q quarterly report, 8-K current report, or Form 4 insider
    trading report.
  aliases:
  - form type
  - transaction form type
  domain_context: SEC filings are categorized by their form type, which indicates
    the purpose and content of the document.
  examples:
  - <transactionFormType> 4
  - INFORMATION ABOUT THE MEETING
  - Other Information
  confidence: 0.95
element_mappings:
- term_id: company
  rules:
  - type: regex
    pattern: (?i)(?:the )?company(?:'s)?
    confidence: 0.95
    element_types:
    - xml_element
    - paragraph
    description: Matches references to the company filing the SEC documents, including
      variations like 'the company' and 'the company's'
  - type: semantic
    semantic_phrase: emerging growth company
    confidence: 0.88
    element_types:
    - paragraph
    description: Matches references to the company being an 'emerging growth company'
  - type: keywords
    keywords:
    - company
    - registrant
    confidence: 0.8
    element_types:
    - paragraph
    - table_cell
    description: Matches general references to the company or registrant filing the
      SEC documents
  expected_frequency: common
  validation_examples:
  - <footnote> Dividend equivalent rights accrue when and as dividends are paid on
    the Company's common stock and b...
  - If an emerging growth company, indicate by check mark if the registrant has elected
    not to use the e...
  - 'Other Public Company Directorships:'
- term_id: ticker
  rules:
  - type: regex
    pattern: (?i)ticker symbol
    confidence: 0.75
    element_types:
    - paragraph
    - table_cell
    description: Matches references to the company's stock ticker symbol
  expected_frequency: rare
  validation_examples: []
- term_id: revenue
  rules:
  - type: regex
    pattern: (?i)revenue(?:s?)|deferred revenue|unearned revenue|revenue recognition
    confidence: 0.95
    element_types:
    - table_cell
    - paragraph
    description: Matches references to the company's revenue, including specific terms
      like 'deferred revenue', 'unearned revenue', and 'revenue recognition'
  - type: semantic
    semantic_phrase: as a percent of revenue
    confidence: 0.88
    element_types:
    - table_cell
    - paragraph
    description: Matches references to revenue as a percentage
  - type: keywords
    keywords:
    - revenue
    - total revenue
    - linkedin revenue growth
    confidence: 0.8
    element_types:
    - table_cell
    - paragraph
    description: Matches general references to the company's revenue
  expected_frequency: common
  validation_examples:
  - As a percent of revenue
  - Deferred revenue
  - Unearned revenue
  - LinkedIn revenue growth
  - Total revenue
- term_id: executive
  rules:
  - type: regex
    pattern: (?i)named executive officer(?:s?)|chief executive officer
    confidence: 0.95
    element_types:
    - table_cell
    - paragraph
    description: Matches references to the company's named executive officers and
      chief executive officer
  - type: semantic
    semantic_phrase: governance and our board of directors
    confidence: 0.88
    element_types:
    - table_row
    - paragraph
    description: Matches references to the company's governance and board of directors,
      which often include executive compensation details
  - type: keywords
    keywords:
    - executive
    - officer
    - compensation
    confidence: 0.8
    element_types:
    - table_cell
    - paragraph
    description: Matches general references to the company's executives and their
      compensation
  expected_frequency: common
  validation_examples:
  - "NAMED EXECUTIVE\_OFFICER COMPENSATION"
  - "1 | GOVERNANCE\_AND OUR BOARD OF DIRECTORS | 2 | NAMED EXECUTIVE\_OFFICER COMPENSATION\
    \ | 3"
  - <officerTitle> Chief Executive Officer
- term_id: filing_date
  rules:
  - type: regex
    pattern: (?i)filing date(?:/period end date)?
    confidence: 0.95
    element_types:
    - table_cell
    - paragraph
    description: Matches references to the filing date or period end date of the SEC
      document
  - type: semantic
    semantic_phrase: form 8-k filing
    confidence: 0.88
    element_types:
    - paragraph
    description: Matches references to Form 8-K filings, which have a specific filing
      date
  - type: keywords
    keywords:
    - filing
    - date
    confidence: 0.8
    element_types:
    - table_cell
    - paragraph
    description: Matches general references to the filing date of the SEC document
  expected_frequency: common
  validation_examples:
  - Check the appropriate box below if the Form 8-K filing is intended to simultaneously
    satisfy the fil...
  - Exhibit Number | Exhibit Description | Form | Exhibit | Filing Date/ Period End
    Date
  - Filing Date
- term_id: form_type
  rules:
  - type: regex
    pattern: (?i)<transactionFormType> 4
    confidence: 0.95
    element_types:
    - xml_element
    description: Matches the XML tag for Form 4 insider trading reports
  - type: semantic
    semantic_phrase: information about the meeting
    confidence: 0.88
    element_types:
    - table_cell
    - paragraph
    description: Matches references to information about shareholder meetings, which
      are often found in proxy statements (DEF 14A)
  - type: keywords
    keywords:
    - form
    - information
    - other
    confidence: 0.8
    element_types:
    - table_cell
    - paragraph
    description: Matches general references to the type of SEC form or other information
      in the document
  expected_frequency: common
  validation_examples:
  - <transactionFormType> 4
  - INFORMATION ABOUT THE MEETING
  - Other Information
relationship_rules:
- id: company_files_form
  description: The company files a specific SEC form type, such as 10-K, 10-Q, 8-K,
    or Form 4
  relationship_type: FILES
  source:
    term_id: company
    semantic_phrase: the company
    confidence_threshold: 0.8
  target:
    term_id: form_type
    semantic_phrase: the SEC form type
    confidence_threshold: 0.8
  constraints:
    hierarchy_level: 0
    direction: any
  confidence:
    minimum: 0.8
    calculation: average
  corpus_evidence: 96.5% of documents show the company and the form type co-occurring
  domain_justification: SEC filings require companies to submit specific reporting
    forms, so this relationship is expected based on the domain context.
- id: form_filed_on_date
  description: The SEC form is filed on a specific date
  relationship_type: DATED
  source:
    term_id: form_type
    semantic_phrase: the SEC form type
    confidence_threshold: 0.8
  target:
    term_id: filing_date
    semantic_phrase: the filing date
    confidence_threshold: 0.8
  constraints:
    hierarchy_level: 0
    direction: any
  confidence:
    minimum: 0.8
    calculation: average
  corpus_evidence: 98.9% of documents show the form type and filing date co-occurring
  domain_justification: SEC filings have a specific date associated with when the
    form was submitted, so this relationship is expected based on the domain context.
- id: company_has_ticker
  description: The company has a stock ticker symbol
  relationship_type: HAS
  source:
    term_id: company
    semantic_phrase: the company
    confidence_threshold: 0.8
  target:
    term_id: ticker
    semantic_phrase: the ticker symbol
    confidence_threshold: 0.8
  constraints:
    hierarchy_level: 0
    direction: any
  confidence:
    minimum: 0.8
    calculation: average
  corpus_evidence: 77.1% of documents show the company and ticker symbol co-occurring
  domain_justification: Public companies that file SEC reports have a unique stock
    ticker symbol, so this relationship is expected based on the domain context.
- id: company_has_executives
  description: The company has executives whose compensation is reported
  relationship_type: HAS
  source:
    term_id: company
    semantic_phrase: the company
    confidence_threshold: 0.8
  target:
    term_id: executive
    semantic_phrase: the executives
    confidence_threshold: 0.8
  constraints:
    hierarchy_level: 0
    direction: any
  confidence:
    minimum: 0.8
    calculation: average
  corpus_evidence: 77.1% of documents show the company and executives co-occurring
  domain_justification: SEC filings require public companies to disclose information
    about their senior executives, so this relationship is expected based on the domain
    context.
- id: company_reports_revenue
  description: The company reports its revenue in the SEC filings
  relationship_type: REPORTS
  source:
    term_id: company
    semantic_phrase: the company
    confidence_threshold: 0.8
  target:
    term_id: revenue
    semantic_phrase: the revenue
    confidence_threshold: 0.8
  constraints:
    hierarchy_level: 1
    direction: any
  confidence:
    minimum: 0.8
    calculation: average
  corpus_evidence: 6.5% of documents show the company and revenue co-occurring
  domain_justification: SEC filings, especially the 10-K annual report, require companies
    to disclose their financial performance, including revenue, so this relationship
    is expected based on the domain context.
