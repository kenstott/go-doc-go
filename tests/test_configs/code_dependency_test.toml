# Test Configuration: Code Dependency Crawling
# Purpose: Test code import/dependency discovery and crawling

[embedding]
enabled = true
provider = "onnx"
model = "sentence-transformers/all-MiniLM-L6-v2"
dimensions = 384
chunk_size = 512
overlap = 128
contextual = true
predecessor_count = 1
successor_count = 1

# Content Sources Configuration - File source for Go code
[[content_sources]]
name = "doculyzer_go_code"
type = "file"
base_path = "./go/internal/importer"  # Start with the importer package
file_pattern = "**/*.go"
recursive = true
watch_for_changes = false

[content_sources.discovery]
enabled = true
max_depth = 2  # Limit depth to avoid crawling entire stdlib
include_patterns = [
    "github.com/kennethstott/doculyzer-go-conversion/**"  # Only our code
]
exclude_patterns = [
    "**/test/**",
    "**/*_test.go",
    "**/vendor/**"
]

[content_sources.discovery.hyperlinks]
enabled = false  # Not applicable for code files

[content_sources.discovery.code_dependencies]
enabled = true
follow_stdlib = false   # Don't follow Go standard library
follow_local = true     # Follow local packages in same module
follow_external = false # Don't follow third-party dependencies

[relationship_detection]
enabled = true
structural = true
semantic = false

[relationship_detection.cross_document_semantic]
enabled = false

# UDML-O: Ontology extraction disabled for this test
[ontology]
enabled = false

# Processing configuration
[processing]
batch_size = 10
max_workers = 2
timeout_seconds = 300

[processing.job_control]
backend = "sqlite"
path = "./tests/test_output/code_dependency_test.db"
claim_timeout = 300
heartbeat_interval = 30
max_retries = 3

# Analytics outputs configuration
[analytics]
enabled = true

[[analytics.outputs]]
type = "parquet"
path = "./tests/test_output/code_dependency_analytics"

[logging]
level = "DEBUG"
file = "./tests/test_output/code_dependency_test.log"
