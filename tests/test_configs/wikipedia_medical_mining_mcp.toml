# MCP-Enabled Ontology Extraction Configuration
# Purpose: Test MCP tool calling with medical and mining corpus

# Use existing Parquet data from previous test
parquet_path = "./tests/test_output/wikipedia_medical_mining_analytics"

# Ontology Builder Configuration
[ontology_builder]
# Sampling
sample_size = 100
diversity_threshold = 0.85  # Cosine similarity threshold (lower = more diverse)

# LLM Configuration
llm_provider = "anthropic"
llm_model = "claude-3-5-sonnet-20241022"
llm_max_tokens = 8000

# MCP Configuration - ENABLED
enable_mcp = true
embedding_model = "all-MiniLM-L6-v2"

# Analysis
top_entity_count = 50
min_entity_frequency = 3
confidence_threshold = 0.7

# Output
schema_name = "medical_mining_ontology"
schema_version = "1.0.0"
domain = "multi-domain"

# Ontology Extraction Configuration
[ontology]
enabled = true
schema_path = "./tests/test_output/ontology_schemas"

# Output paths for results
output_dir = "./tests/test_output/ontology_results"
entities_json = "./tests/test_output/ontology_results/entities.json"
relationships_json = "./tests/test_output/ontology_results/relationships.json"
summary_json = "./tests/test_output/ontology_results/summary.json"

# Logging
[logging]
level = "INFO"
file = "./tests/test_output/mcp_ontology_extraction.log"
