job_control:
    backend: "sqlite"
    path: "./test_wikipedia_only.db"
    claim_timeout: 300
    heartbeat_interval: 30
    max_retries: 3

content_sources:
  - name: "wikipedia"
    type: "web"
    base_url: "https://en.wikipedia.org"
    url_list:
      - "https://en.wikipedia.org/wiki/Document_management_system"
    include_patterns:
      - "^https://en.wikipedia.org/wiki/"
    exclude_patterns:
      - "/Special:"
      - "/Talk:"
      - "/Category:"
      - "/File:"
    headers:
      User-Agent: "Go-Doc-Go/1.0 (educational project; ken@kenstott.com)"
    max_link_depth: 1
    refresh_interval: 604800  # 7 days in seconds

analytics:
  enabled: true
  outputs:
    - backend: "parquet"
      output_dir: "./test_output"
      compression: "snappy"
