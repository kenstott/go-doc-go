# Go-Doc-Go Configuration File (TOML format)

[embedding]
enabled = true
provider = "onnx"  # Use native Go ONNX Runtime for parallel inference
model = "sentence-transformers/all-MiniLM-L6-v2"
model_path = "go/models/all-MiniLM-L6-v2"  # Path to exported ONNX model
dimensions = 384
chunk_size = 512
overlap = 128
contextual = true
predecessor_count = 1
successor_count = 1

[[content_sources]]
name = "file-docs"
type = "file"
base_path = "./assets"
file_pattern = "**/*"
include_extensions = ["md", "txt", "xml", "pptx", "csv", "docx", "xlsx", "pdf", "htm", "html"]
watch_for_changes = true
max_link_depth = 2
refresh_interval = 300  # 5 minutes in seconds

[[content_sources]]
name = "wikipedia"
type = "web"
base_url = "https://en.wikipedia.org"
url_list = [
    "https://en.wikipedia.org/wiki/Document_management_system"
]
include_patterns = [
    "^https://en.wikipedia.org/wiki/"
]
exclude_patterns = [
    "/Special:",
    "/Talk:",
    "/Category:",
    "/File:"
]
max_link_depth = 1
refresh_interval = 604800  # 7 days in seconds

[content_sources.headers]
User-Agent = "Go-Doc-Go/1.0 (educational project; ken@kenstott.com)"

[relationship_detection]
enabled = true
structural = true
semantic = true

[relationship_detection.cross_document_semantic]
similarity_threshold = 0.55

[processing]
batch_size = 100
max_workers = 4
timeout_seconds = 300

[processing.job_control]
backend = "postgres"
path = "postgres://postgres:password@localhost:5432/go_doc_go?sslmode=disable"
claim_timeout = 300
heartbeat_interval = 30
max_retries = 3

[processing.neo4j_export]
enabled = false
empty_queue_wait_time = 600  # 10 minutes in seconds
source_analytics = "parquet"
batch_size = 1000

[processing.neo4j_export.connection]
uri = "bolt://localhost:7687"
username = "neo4j"
password = "password"
database = "neo4j"

[analytics]
enabled = true

[[analytics.outputs]]
type = "parquet"
path = "./test-analytics-output"
partitioning = ["date", "source"]

[logging]
level = "INFO"
file = "./logs/go-doc-go.log"
