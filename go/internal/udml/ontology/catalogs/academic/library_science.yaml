domain: library_science
description: 'Library operations including cataloging workflows, circulation systems,
  collection development policies, archival procedures, and reference services. NOTE:
  Mere presence of bibliographic identifiers (ISBN, DOI, PMID) or citation formats
  does NOT indicate library science content - this domain requires discussion of library
  processes, operations, or professional practices.'
subdomains:
- cataloging
- circulation
- collection_management
- archives
- reference_services
entity_types:
- entity_type: library_item
  description: Library item or material
  aliases:
  - book
  - resource
  - material
  - holding
  element_types:
  - paragraph
  - list_item
  - table_row
  extraction_rules:
  - phrase_list:
    - library item
    - book
    - resource
    - material
    - holding
  parent_type: ''
  w_category: what
  domain: library_science
