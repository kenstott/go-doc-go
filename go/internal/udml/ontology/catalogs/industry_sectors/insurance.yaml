domain: insurance
description: Insurance policies, claims, underwriting documents, actuarial reports,
  and insurance correspondence
subdomains:
- life_insurance
- property_insurance
- health_insurance
- auto_insurance
- liability_insurance
- workers_compensation
- marine_insurance
- reinsurance
terms:
- name: premium
  synonyms:
  - payment
  - insurance cost
  - rate
  - contribution
  description: Payment for insurance coverage
- name: deductible
  synonyms:
  - excess
  - out-of-pocket
  - copay
  description: Amount insured pays before coverage begins
- name: claim
  synonyms:
  - loss claim
  - insurance claim
  - demand
  description: Request for payment under insurance policy
- name: coverage
  synonyms:
  - protection
  - insurance
  - benefit
  - indemnity
  description: Protection provided by insurance policy
- name: policyholder
  synonyms:
  - insured
  - covered person
  - policy owner
  - subscriber
  description: Person or entity holding insurance policy
- name: beneficiary
  synonyms:
  - recipient
  - payee
  - claimant
  description: Person entitled to receive benefits
- name: underwriting
  synonyms:
  - risk assessment
  - evaluation
  - approval process
  description: Process of evaluating insurance risk
- name: exclusion
  synonyms:
  - limitation
  - exception
  - carve-out
  description: Condition not covered by policy
- name: rider
  synonyms:
  - endorsement
  - amendment
  - addendum
  - supplement
  description: Addition or modification to policy
- name: subrogation
  synonyms:
  - recovery
  - reimbursement
  - right of recovery
  description: Insurer's right to recover costs from responsible party
- name: liability
  synonyms:
  - responsibility
  - obligation
  - exposure
  description: Legal responsibility for loss or damage
- name: loss ratio
  synonyms:
  - claims ratio
  - loss experience
  description: Ratio of claims paid to premiums collected
entity_types:
- entity_type: policy
  description: Insurance policy or contract
  aliases:
  - insurance policy
  - contract
  - coverage
  - plan
  element_types:
  - paragraph
  - heading
  extraction_rules:
  - pattern: \bpolicy\s+(?:number|#)?\s*[A-Z0-9\-]+
  parent_type: global.document
  w_category: what
  domain: insurance
- entity_type: policyholder
  description: Person or entity holding insurance policy
  aliases:
  - insured
  - policy owner
  - subscriber
  - member
  element_types:
  - paragraph
  - table_cell
  extraction_rules:
  - phrase_list:
