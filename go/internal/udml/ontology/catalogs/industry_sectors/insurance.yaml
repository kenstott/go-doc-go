relationships:
- name: policyholder_has_policy
  source_type: policyholder
  target_type: policy
  relationship_type: related_to
  description: Policyholder has insurance policy
  sample_patterns:
  - '{policyholder} holds {policy}'
  - '{policy} for {policyholder}'
  - '{policyholder} insured under {policy}'
- name: policy_covers_beneficiary
  source_type: policy
  target_type: beneficiary
  relationship_type: related_to
  description: Policy designates beneficiary
  sample_patterns:
  - '{beneficiary} named on {policy}'
  - '{policy} beneficiary: {beneficiary}'
- name: policy_has_coverage
  source_type: policy
  target_type: coverage_type
  relationship_type: contains
  description: Policy includes coverage type
  sample_patterns:
  - '{policy} includes {coverage}'
  - '{coverage} under {policy}'
- name: policy_has_premium
  source_type: policy
  target_type: premium
  relationship_type: related_to
  description: Policy has premium amount
  sample_patterns:
  - '{policy} premium: {premium}'
  - '{premium} for {policy}'
- name: claim_filed_for_loss
  source_type: claim
  target_type: loss_event
  relationship_type: related_to
  description: Claim filed for loss event
  sample_patterns:
  - '{claim} for {loss}'
  - '{loss} resulted in {claim}'
- name: claim_under_policy
  source_type: claim
  target_type: policy
  relationship_type: part_of
  description: Claim made under policy
  sample_patterns:
  - '{claim} under {policy}'
  - '{policy} claim: {claim}'
- name: policyholder_filed_claim
  source_type: policyholder
  target_type: claim
  relationship_type: created_by
  description: Policyholder filed claim
  sample_patterns:
  - '{policyholder} filed {claim}'
  - '{claim} by {policyholder}'
- name: policy_excludes_risk
  source_type: policy
  target_type: exclusion
  relationship_type: related_to
  description: Policy has exclusion
  sample_patterns:
  - '{policy} excludes {exclusion}'
  - '{exclusion} not covered by {policy}'
- name: policy_modified_by_endorsement
  source_type: policy
  target_type: endorsement
  relationship_type: related_to
  description: Policy modified by endorsement
  sample_patterns:
  - '{endorsement} modifies {policy}'
  - '{policy} amended by {endorsement}'
- name: insurer_issued_policy
  source_type: insurer
  target_type: policy
  relationship_type: created_by
  description: Insurer issued policy
  sample_patterns:
  - '{insurer} issued {policy}'
  - '{policy} from {insurer}'
- name: agent_sold_policy
  source_type: agent
  target_type: policy
  relationship_type: related_to
  description: Agent sold policy
  sample_patterns:
  - '{agent} sold {policy}'
  - '{policy} through {agent}'
- name: policy_covers_vehicle
  source_type: policy
  target_type: vehicle
  relationship_type: related_to
  description: Auto policy covers vehicle
  subdomain: auto_insurance
  sample_patterns:
  - '{policy} covers {vehicle}'
  - '{vehicle} insured under {policy}'
- name: policy_covers_property
  source_type: policy
  target_type: property
  relationship_type: related_to
  description: Property policy covers property
  subdomain: property_insurance
  sample_patterns:
  - '{policy} covers {property}'
  - '{property} insured by {policy}'
