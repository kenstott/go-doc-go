domain: leisure
description: Travel, hospitality, tourism, entertainment, recreation, and leisure
  industry services
subdomains:
- travel
- hospitality
- tourism
- entertainment
- recreation
- events
terms:
- name: travel
  synonyms:
  - journey
  - trip
  - voyage
  - tour
  description: Movement from one place to another for leisure
- name: hospitality
  synonyms:
  - accommodation
  - lodging
  - hotel service
  description: Services providing food, drink, and accommodation
- name: tourism
  synonyms:
  - sightseeing
  - travel industry
  - visitor services
  description: Commercial organization and operation of vacations and visits
- name: entertainment
  synonyms:
  - amusement
  - recreation
  - leisure activity
  description: Activities providing enjoyment and recreation
- name: recreation
  synonyms:
  - leisure activity
  - pastime
  - hobby
  description: Activities done for enjoyment during free time
- name: destination
  synonyms:
  - location
  - place
  - venue
  - site
  description: Place to which someone is going or traveling
entity_types:
- entity_type: destination
  description: Travel destination or tourist location
  aliases:
  - location
  - place
  - tourist site
  - attraction
  element_types:
  - paragraph
  - heading
  extraction_rules:
  - phrase_list:
    - destination
    - location
    - place
    - tourist site
    - attraction
  parent_type: ''
  w_category: what
  domain: leisure
- entity_type: hotel
  description: Accommodation establishment
  aliases:
  - resort
  - inn
  - lodge
  - accommodation
  - hostel
  element_types:
  - paragraph
  - heading
  extraction_rules:
  - pattern: '\b[A-Z][a-z]+(?: [A-Z][a-z]+)* (?:Hotel|Resort|Inn|Lodge)\b'
  parent_type: ''
  w_category: what
  domain: leisure
- entity_type: airline
  description: Air transport carrier
  aliases:
  - carrier
  - airline company
  - aviation company
  element_types:
  - paragraph
  - heading
  extraction_rules:
  - pattern: '\b[A-Z][a-z]+(?: [A-Z][a-z]+)* Airlines?\b'
  parent_type: ''
  w_category: what
  domain: leisure
- entity_type: flight
  description: Air travel service
  aliases:
  - air travel
  - flight service
  element_types:
  - paragraph
  - table_cell
  extraction_rules:
  - pattern: \b[A-Z]{2}\d{1,4}\b
