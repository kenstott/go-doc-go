domain: compliance
description: Regulatory compliance, risk management, audit, policy enforcement, and
  regulatory reporting across industries including financial services, healthcare,
  and corporate governance
subdomains:
- financial_regulation
- healthcare_regulation
- data_privacy
- corporate_governance
- environmental_compliance
- safety_compliance
terms:
- name: compliance
  synonyms:
  - regulatory compliance
  - adherence
  - conformity
  - regulatory adherence
  description: Conforming to rules, regulations, standards, and laws
- name: regulation
  synonyms:
  - rule
  - law
  - statute
  - regulatory requirement
  - mandate
  description: Official rule or directive having force of law
- name: audit
  synonyms:
  - examination
  - inspection
  - review
  - compliance review
  - regulatory audit
  description: Systematic examination of records and activities to ensure compliance
- name: policy
  synonyms:
  - procedure
  - guideline
  - protocol
  - standard operating procedure
  description: Formal statement of principles or rules of conduct
- name: risk
  synonyms:
  - exposure
  - liability
  - threat
  - compliance risk
  - regulatory risk
  description: Potential for non-compliance resulting in penalties or harm
- name: remediation
  synonyms:
  - corrective action
  - mitigation
  - resolution
  - compliance correction
  description: Actions taken to address compliance violations or gaps
entity_types:
- entity_type: regulation
  description: Specific law, rule, or regulatory requirement
  aliases:
  - regulatory requirement
  - law
  - statute
  - rule
  - mandate
  - directive
  element_types:
  - paragraph
  - heading
  - list_item
  extraction_rules:
  - pattern: \b(?:Regulation|Rule|Directive|Act)\s+[A-Z0-9-]+\b
  parent_type: ''
  w_category: what
  domain: compliance
- entity_type: compliance_requirement
  description: Specific obligation or control required for compliance
  aliases:
  - requirement
  - obligation
  - mandate
  - control requirement
  element_types:
  - paragraph
  - list_item
  - table_cell
  extraction_rules:
  - phrase_list:
    - compliance requirement
    - requirement
    - obligation
    - mandate
    - control requirement
  parent_type: ''
  w_category: what
  domain: compliance
- entity_type: regulatory_body
  description: Government agency or authority enforcing regulations
  aliases:
  - regulator
  - regulatory authority
  - enforcement agency
  - supervisory authority
  element_types:
  - paragraph
  - heading
  - table_cell
  extraction_rules:
  - pattern: \b(?:Securities and Exchange Commission|Food and Drug Administration|Environmental
      Protection Agency|Occupational Safety and Health Administration)\b
  parent_type: ''
  w_category: what
  domain: compliance
- entity_type: compliance_officer
  description: Person responsible for compliance oversight
  aliases:
  - chief compliance officer
  - CCO
  - compliance manager
  - regulatory affairs officer
  element_types:
  - paragraph
  - table_cell
  extraction_rules:
  - pattern: \b(?:Chief Compliance Officer|CCO|Compliance Manager|Director of Compliance)\b
  parent_type: ''
  w_category: what
  domain: compliance
- entity_type: audit_finding
  description: Issue or deficiency identified during audit
  aliases:
  - finding
  - deficiency
  - gap
  - non-compliance
  - violation
  - audit observation
  element_types:
  - paragraph
  - list_item
  - table_cell
  extraction_rules:
  - phrase_list:
    - audit finding
    - finding
    - deficiency
    - gap
    - non-compliance
    - violation
    - audit observation
  parent_type: ''
  w_category: what
  domain: compliance
- entity_type: control
  description: Process or mechanism to ensure compliance
  aliases:
  - internal control
  - compliance control
  - safeguard
  - preventive control
  - detective control
  element_types:
  - paragraph
  - list_item
  - table_cell
  extraction_rules:
  - phrase_list:
    - control
    - internal control
    - compliance control
    - safeguard
    - preventive control
    - detective control
  parent_type: ''
  w_category: what
  domain: compliance
- entity_type: policy_document
  description: Formal document establishing compliance policies
  aliases:
  - policy
  - procedure manual
  - compliance manual
  - standard operating procedure
  - SOP
  element_types:
  - heading
  - paragraph
  extraction_rules:
  - pattern: \b(?:Policy|Procedure|Manual|SOP|Guideline)\s+[A-Z0-9-]+\b
  parent_type: ''
  w_category: what
  domain: compliance
- entity_type: penalty
  description: Fine, sanction, or punishment for non-compliance
  aliases:
  - fine
  - sanction
  - enforcement action
  - monetary penalty
  - disciplinary action
  element_types:
  - paragraph
  - table_cell
  extraction_rules:
  - pattern: \$\d{1,3}(?:,\d{3})*(?:\s+(?:fine|penalty|sanction))
  parent_type: ''
  w_category: what
  domain: compliance
- entity_type: risk_assessment
  description: Evaluation of compliance risks
  aliases:
  - risk analysis
  - compliance risk assessment
  - risk evaluation
  - risk review
  element_types:
  - heading
  - paragraph
  - table_cell
  extraction_rules:
  - phrase_list:
    - risk assessment
    - risk analysis
    - compliance risk assessment
    - risk evaluation
    - risk review
  parent_type: ''
  w_category: what
  domain: compliance
