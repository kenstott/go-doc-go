    - permission
  parent_type: ''
  w_category: what
  domain: legal
- entity_type: remedy
  description: Legal remedy or relief
  aliases:
  - relief
  - damages
  - compensation
  - cure
  element_types:
  - paragraph
  - list_item
  extraction_rules:
  - phrase_list:
    - remedy
