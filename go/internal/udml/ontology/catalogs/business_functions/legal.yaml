domain: legal
description: Legal contracts, agreements, court documents, regulations, and legal
  correspondence
subdomains:
- contract_law
- corporate_law
- intellectual_property
- litigation
- regulatory_compliance
- real_estate_law
terms:
- name: plaintiff
  synonyms:
  - claimant
  - complainant
  - petitioner
  - appellant
  description: Party bringing a legal action
- name: defendant
  synonyms:
  - respondent
  - appellee
  - accused
  description: Party defending against a legal action
- name: jurisdiction
  synonyms:
  - venue
  - court authority
  - legal authority
  description: Legal authority of a court or governing body
- name: liability
  synonyms:
  - responsibility
  - obligation
  - legal duty
  - accountability
  description: Legal responsibility or obligation
- name: indemnification
  synonyms:
  - indemnity
  - protection
  - reimbursement
  - compensation
  description: Protection against loss or legal liability
- name: statute
  synonyms:
  - law
  - act
  - legislation
  - code
  - regulation
  description: Written law passed by legislative body
- name: precedent
  synonyms:
  - case law
  - judicial precedent
  - prior ruling
  description: Legal principle established in previous case
- name: covenant
  synonyms:
  - agreement
  - promise
  - undertaking
  - contractual term
  description: Formal agreement or promise in a contract
- name: consideration
  synonyms:
  - payment
  - exchange
  - quid pro quo
  - compensation
  description: Something of value exchanged in a contract
- name: breach
  synonyms:
  - violation
  - default
  - non-performance
  - infringement
  description: Failure to fulfill contractual obligation
entity_types:
- entity_type: party
  description: Legal party to contract or case
  aliases:
  - contracting party
  - litigant
  - signatory
  - legal entity
  element_types:
  - paragraph
  - heading
  - table_cell
  extraction_rules:
  - phrase_list:
    - party
    - contracting party
    - litigant
    - signatory
    - legal entity
  parent_type: ''
  w_category: what
  domain: legal
- entity_type: legal_entity
  description: Business or organization in legal context
  aliases:
  - corporation
  - LLC
  - partnership
  - legal person
  - entity
  element_types:
  - paragraph
  - heading
  - table_cell
  extraction_rules:
  - pattern: \b[A-Z][A-Za-z\s]+(?:Inc|Corp|LLC|Ltd|LP|LLP|Company)\b
  parent_type: ''
  w_category: what
  domain: legal
- entity_type: statute_reference
  description: Reference to law, statute, or regulation
  aliases:
  - law citation
  - code reference
  - regulation
  - statute
  element_types:
  - paragraph
  - table_cell
  extraction_rules:
  - pattern: \b\d+\s+U\.?S\.?C\.?\s+§\s*\d+
  - pattern: \bSection\s+\d+(?:\.\d+)*\b
  parent_type: ''
  w_category: what
  domain: legal
- entity_type: case_citation
  description: Legal case citation
  aliases:
  - case reference
  - precedent citation
  - court decision
  element_types:
  - paragraph
  extraction_rules:
  - pattern: \b[A-Z][a-z]+\s+v\.\s+[A-Z][a-z]+(?:,\s*\d+\s+[A-Z][a-z\.]+\s+\d+)?
  parent_type: ''
  w_category: what
  domain: legal
- entity_type: contract_term
  description: Duration or term of contract
  aliases:
  - term
  - contract period
  - duration
  - effective period
  element_types:
  - paragraph
  - table_cell
  extraction_rules:
  - pattern: \b(?:term|duration|period)\s+of\s+\d+\s+(?:years?|months?|days?)
  parent_type: ''
  w_category: what
  domain: legal
- entity_type: obligation
  description: Legal obligation or duty
  aliases:
  - duty
  - requirement
  - covenant
  - undertaking
  - promise
  element_types:
  - paragraph
  - list_item
  extraction_rules:
  - phrase_list:
    - obligation
    - duty
    - requirement
    - covenant
    - undertaking
    - promise
  parent_type: ''
  w_category: what
  domain: legal
- entity_type: right
  description: Legal right or entitlement
  aliases:
  - entitlement
  - privilege
  - license
  - permission
  element_types:
  - paragraph
  - list_item
  extraction_rules:
  - phrase_list:
    - right
