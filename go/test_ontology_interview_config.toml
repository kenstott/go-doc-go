# Test config for ontology interview - process test assets

[embedding]
enabled = false  # Disable for faster processing

# Test documents from assets directory
[[content_sources]]
name = "test-assets"
type = "file"
base_path = "/Users/kennethstott/PycharmProjects/doculyzer-go-conversion/tests/assets"
file_pattern = "*.{csv,md,json,xml,html}"
watch_for_changes = false
max_link_depth = 0
refresh_interval = 0

# Wikipedia articles - Financial domain
[[content_sources]]
name = "wikipedia-financial"
type = "web"
seed_urls = [
    "https://en.wikipedia.org/wiki/Revenue",
    "https://en.wikipedia.org/wiki/Financial_statement",
    "https://en.wikipedia.org/wiki/Earnings_before_interest_and_taxes"
]
max_link_depth = 0  # Don't follow links, just get these pages
watch_for_changes = false
refresh_interval = 0

# Wikipedia articles - Medical domain
[[content_sources]]
name = "wikipedia-medical"
type = "web"
seed_urls = [
    "https://en.wikipedia.org/wiki/Prescription_drug",
    "https://en.wikipedia.org/wiki/Medical_diagnosis",
    "https://en.wikipedia.org/wiki/Patient"
]
max_link_depth = 0
watch_for_changes = false
refresh_interval = 0

# Wikipedia articles - Technical domain
[[content_sources]]
name = "wikipedia-technical"
type = "web"
seed_urls = [
    "https://en.wikipedia.org/wiki/Application_programming_interface",
    "https://en.wikipedia.org/wiki/Software_documentation"
]
max_link_depth = 0
watch_for_changes = false
refresh_interval = 0

[relationship_detection]
enabled = true
structural = true
semantic = false

[relationship_detection.cross_document_semantic]
enabled = false

# Disable ontology extraction for corpus creation
[ontology]
enabled = false

[processing]
batch_size = 50
max_workers = 1
timeout_seconds = 120

[processing.job_control]
backend = "sqlite"
path = "./test_interview_queue.db"
claim_timeout = 60
heartbeat_interval = 10
max_retries = 2

# Output to parquet for ontology interview testing
[analytics]
enabled = true

[[analytics.outputs]]
type = "hive"
path = "./test_interview_corpus"
partitioning = ["date", "source"]

[logging]
level = "INFO"
