domain:
  name: sec_insider_trading_analysis
  version: 1.0.0
  description: Enhanced ontology for SEC insider trading and financial reporting analysis
  discovery_method: enhanced_interactive_insider_trading
  user_context: "SEC regulatory filings focused on insider trading analysis:\n\nPrimary\
    \ Documents:\n\u2022 Form 4 - Insider trading transaction reports (XML structured\
    \ data)\n\u2022 10-K annual reports with comprehensive financial statements\n\u2022\
    \ 10-Q quarterly reports with interim financial updates\n\u2022 8-K current reports\
    \ for material corporate events\n\nKey Analysis Focus:\n\u2022 Insider transactions:\
    \ buy/sell activities, transaction amounts, prices\n\u2022 Share ownership: ownership\
    \ changes, direct/indirect ownership\n\u2022 Insider identification: executives,\
    \ directors, officers, their roles\n\u2022 Company identification: issuer names,\
    \ ticker symbols, CIK numbers\n\u2022 Temporal tracking: transaction dates, filing\
    \ dates, reporting periods\n\u2022 Financial metrics: revenue, earnings, financial\
    \ performance data\n\nData Formats:\n\u2022 XML: Structured transaction data from\
    \ Form 4 filings\n\u2022 HTML: Human-readable financial reports and statements\n\
    \nThe goal is to track insider trading patterns, identify key corporate insiders,\n\
    monitor ownership changes, and correlate with company financial performance."
  settings:
    default_confidence_threshold: 0.75
    max_relationships_per_pair: 5
    enable_transitive_inference: true
    insider_trading_focus: true
terms:
- id: insider
  label: Insider
  description: A person who has access to non-public, material information about a
    company, such as an executive, director, or officer. Insiders are required to
    report their trading activities to the SEC.
  aliases:
  - reportingOwner
  - rptOwnerStateDescription
  - reportingOwnerRelationship
  domain_context: Insiders are the key entities involved in insider trading activities.
    Analyzing their trading patterns, ownership changes, and relationships to the
    company is crucial for this domain.
- id: transaction
  label: Transaction
  description: A trading activity performed by an insider, such as buying or selling
    shares of the company's stock. Transactions include details like the number of
    shares, price per share, and the nature of the transaction (acquisition or disposition).
  aliases:
  - transactionCoding
  - transactionAcquiredDisposedCode
  - transactionDate
  - transactionPricePerShare
  - transactionShares
  domain_context: Transactions are the core events that need to be tracked and analyzed
    to understand insider trading behavior and patterns.
- id: ownership
  label: Ownership
  description: The details of an insider's ownership of the company's stock, including
    the number of shares owned, whether the ownership is direct or indirect, and the
    nature of the ownership (e.g., common stock).
  aliases:
  - directOrIndirectOwnership
  - ownershipNature
  - sharesOwnedFollowingTransaction
  domain_context: Ownership information is crucial for understanding an insider's
    motivations and the impact of their trading activities on their overall stake
    in the company.
- id: company
  label: Company
  description: The issuer of the securities that are being traded by insiders. Companies
    are identified by their name, ticker symbol, and CIK (Central Index Key) number.
  aliases:
  - securityTitle
  domain_context: The company is the central entity in the insider trading domain,
    as the insiders' trading activities are directly related to the company's securities.
- id: filing
  label: Filing
  description: The regulatory documents submitted to the SEC that contain information
    about insider trading activities, such as Form 4 (Insider Trading Report) and
    the company's periodic financial reports (10-K, 10-Q).
  aliases:
  - footnoteId
  - transactionFormType
  - filingDate
  domain_context: Filings are the primary sources of data for analyzing insider trading
    and must be tracked to understand the timing and context of the reported transactions.
- id: financial
  label: Financial
  description: The financial performance metrics of the company, such as revenue,
    earnings, and other key indicators that may be relevant for understanding the
    context and potential motivations behind insider trading activities.
  aliases:
  - revenue
  domain_context: Financial information can provide valuable context for interpreting
    insider trading patterns and identifying potential correlations between a company's
    performance and its insiders' trading activities.
element_mappings:
- term_id: insider
  rules:
  - type: regex
    pattern: <reportingOwner>
    confidence: 0.9
    element_types:
    - xml_element
    description: Extracts the reporting owner (insider) from the structured XML data
      in Form 4 filings.
  - type: regex
    pattern: <rptOwnerStateDescription>
    confidence: 0.9
    element_types:
    - xml_element
    description: Extracts the reporting owner's state description from the Form 4
      XML data.
  - type: regex
    pattern: <reportingOwnerRelationship>
    confidence: 0.9
    element_types:
    - xml_element
    description: Extracts the reporting owner's relationship to the company from the
      Form 4 XML data.
  - type: semantic
    pattern: executive|director|officer
    confidence: 0.75
    element_types:
    - paragraph
    - table_cell
    description: Identifies insiders by their roles using semantic matching in the
      financial reports.
- term_id: transaction
  rules:
  - type: regex
    pattern: <transactionCoding>
    confidence: 0.9
    element_types:
    - xml_element
    description: Extracts the transaction coding (e.g., acquisition, disposition)
      from the Form 4 XML data.
  - type: regex
    pattern: <transactionAcquiredDisposedCode>
    confidence: 0.9
    element_types:
    - xml_element
    description: Extracts the transaction acquired/disposed code from the Form 4 XML
      data.
  - type: regex
    pattern: <transactionDate>
    confidence: 0.9
    element_types:
    - xml_element
    description: Extracts the transaction date from the Form 4 XML data.
  - type: regex
    pattern: <transactionPricePerShare>
    confidence: 0.9
    element_types:
    - xml_element
    description: Extracts the transaction price per share from the Form 4 XML data.
  - type: regex
    pattern: <transactionShares>
    confidence: 0.9
    element_types:
    - xml_element
    description: Extracts the number of shares transacted from the Form 4 XML data.
- term_id: ownership
  rules:
  - type: regex
    pattern: <directOrIndirectOwnership>
    confidence: 0.9
    element_types:
    - xml_element
    description: Extracts the direct or indirect nature of the insider's ownership
      from the Form 4 XML data.
  - type: regex
    pattern: <ownershipNature>
    confidence: 0.9
    element_types:
    - xml_element
    description: Extracts the nature of the insider's ownership (e.g., common stock)
      from the Form 4 XML data.
  - type: regex
    pattern: <sharesOwnedFollowingTransaction>
    confidence: 0.9
    element_types:
    - xml_element
    description: Extracts the number of shares owned by the insider following the
      reported transaction from the Form 4 XML data.
- term_id: company
  rules:
  - type: regex
    pattern: <securityTitle>
    confidence: 0.9
    element_types:
    - xml_element
    description: Extracts the title of the security (company's stock) from the Form
      4 XML data.
  - type: semantic
    pattern: company|issuer
    confidence: 0.8
    element_types:
    - paragraph
    - table_cell
    description: Identifies the company or issuer of the securities from the financial
      reports using semantic matching.
  - type: keywords
    pattern:
    - ticker
    - CIK
    confidence: 0.8
    element_types:
    - paragraph
    - table_cell
    description: Extracts the company's ticker symbol and CIK (Central Index Key)
      number from the financial reports using keyword matching.
- term_id: filing
  rules:
  - type: regex
    pattern: <footnoteId>
    confidence: 0.9
    element_types:
    - xml_element
    description: Extracts the footnote ID from the Form 4 XML data, which can be used
      to link the transaction to the filing.
  - type: regex
    pattern: <transactionFormType>
    confidence: 0.9
    element_types:
    - xml_element
    description: Extracts the form type (e.g., Form 4) of the transaction from the
      XML data.
  - type: regex
    pattern: <filingDate>
    confidence: 0.9
    element_types:
    - xml_element
    description: Extracts the filing date of the Form 4 from the XML data.
  - type: keywords
    pattern:
    - 10-K
    - 10-Q
    - 8-K
    confidence: 0.8
    element_types:
    - table_cell
    - paragraph
    description: Identifies the type of financial report (10-K, 10-Q, 8-K) from the
      text content using keyword matching.
- term_id: financial
  rules:
  - type: keywords
    pattern: revenue
    confidence: 0.8
    element_types:
    - table_cell
    description: Extracts the company's revenue data from financial tables in the
      10-K and 10-Q reports.
  - type: semantic
    pattern: earnings|profit|loss
    confidence: 0.8
    element_types:
    - paragraph
    description: Extracts the company's earnings-related information from the narrative
      sections of the financial reports.
relationship_rules:
- id: insider_executes_transaction
  relationship_type: action
  description: Insider executes a stock transaction
  source:
    term_id: insider
    semantic_phrase: insider
  target:
    term_id: transaction
    semantic_phrase: executes
  confidence:
    minimum_score: 0.8
  constraints:
    hierarchy_level: document
- id: insider_owns_shares
  relationship_type: ownership
  description: Insider owns company shares
  source:
    term_id: insider
    semantic_phrase: insider
  target:
    term_id: ownership
    semantic_phrase: owns
  confidence:
    minimum_score: 0.8
  constraints:
    hierarchy_level: document
- id: insider_works_for_company
  relationship_type: employment
  description: Insider works for the company
  source:
    term_id: insider
    semantic_phrase: insider
  target:
    term_id: company
    semantic_phrase: works_for
  confidence:
    minimum_score: 0.8
  constraints:
    hierarchy_level: document
- id: transaction_involves_company
  relationship_type: involvement
  description: Transaction involves the company's stock
  source:
    term_id: transaction
    semantic_phrase: transaction
  target:
    term_id: company
    semantic_phrase: involves
  confidence:
    minimum_score: 0.8
  constraints:
    hierarchy_level: document
- id: transaction_occurred_on_date
  relationship_type: temporal
  description: Transaction occurred on a specific date
  source:
    term_id: transaction
    semantic_phrase: transaction
  target:
    term_id: filing
    semantic_phrase: occurred_on
  confidence:
    minimum_score: 0.8
  constraints:
    hierarchy_level: document
- id: company_reports_financial_metrics
  relationship_type: reporting
  description: Company reports financial performance metrics
  source:
    term_id: company
    semantic_phrase: company
  target:
    term_id: financial
    semantic_phrase: reports
  confidence:
    minimum_score: 0.8
  constraints:
    hierarchy_level: document
